<title>Kfoot 98</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Kfoot 98 — layout: moldura de "placar eletrônico de estádio": cabeçalho fino com passos, conteúdo em painéis planos, tabelas densas estilo Brasfoot */
:root {
  --bg: #e6ece4; --panel: #f6f8f2; --panel2: #eaf0e6; --ink: #13241a; --muted: #566a5c; --line: #c3d0c1;
  --accent: #0b6e3f; --accent-ink: #ffffff; --hot: #e8ab00; --hot-ink: #1d1500;
  --st-verde: #2fa84f; --st-vclaro: #9ccc3c; --st-amarelo: #e6c200; --st-laranja: #ec8a1c; --st-vermelho: #d63a2f;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
    --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
  --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
h3 { font-family: var(--display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* barra superior com passos */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand b { background: var(--hot); color: var(--hot-ink); padding: 0 6px; margin-left: 4px; font-weight: 400; }
.steps { display: flex; gap: 6px; margin-left: auto; list-style: none; padding: 0; margin-block: 0; flex-wrap: wrap; }
.steps li { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 3px 9px; border: 1px solid var(--line); }
.steps li.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.ok { color: var(--ink); }

/* botões */
.btn { appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 11px 22px; font-family: var(--display); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: transform .08s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.alt { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: var(--hot-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* tela 1 */
.hero { position: relative; overflow: hidden; background: #0f2f1c; color: #eef6ea; border-bottom: 4px solid var(--hot); }
.hero svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.hero .wrap { position: relative; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; padding-block: clamp(48px, 12vw, 120px); }
.logo { font-family: var(--display); line-height: .86; text-transform: uppercase; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.logo .k { font-size: clamp(88px, 22vw, 220px); letter-spacing: .01em; }
.logo .y { font-size: clamp(88px, 22vw, 220px); background: var(--hot); color: #1d1500; padding: 0 .09em; }
.hero .lead { max-width: 34ch; font-size: clamp(19px, 2.6vw, 26px); line-height: 1.3; }
.hero .btn { border-color: var(--hot); background: var(--hot); color: #1d1500; font-size: 22px; padding: 14px 30px; }
.hero small { opacity: .7; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.ticker { background: var(--panel); border-bottom: 1px solid var(--line); }
.ticker .wrap { display: flex; gap: 8px 28px; flex-wrap: wrap; padding-block: 14px; font-size: 15px; }
.ticker span b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-right: 6px; color: var(--accent); }

/* telas 2-5 */
.page { padding-block: 28px 8px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 8px; }
.head p { max-width: 70ch; color: var(--muted); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.rule { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rule b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; }
.rule span { font-size: 15px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); margin-top: 4px; align-self: flex-start; }
.seg button { appearance: none; background: transparent; border: 0; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.divs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.div { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.div > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); gap: 8px; }
.div ol { list-style: none; margin: 0; padding: 0; counter-reset: c; }
.div li { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; border-bottom: 1px dotted var(--line); font-size: 15px; counter-increment: c; }
.div li::before { content: counter(c); width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.div li .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.div li .uf { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.div li.sorteavel { background: color-mix(in srgb, var(--hot) 22%, transparent); font-weight: 600; }
.div li.bloq { color: var(--muted); }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.hot { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.slot { border: 1px dashed var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); min-width: 0; }
.slot.me { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--panel2); }
.slot label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.slot input { padding: 10px 12px; border: 2px solid var(--line); background: var(--panel); font-size: 18px; width: 100%; min-width: 0; }
.slot input:focus-visible { border-color: var(--accent); outline-offset: 0; }
.err { color: #c0322a; font-weight: 600; min-height: 1.4em; }
:root[data-theme="dark"] .err { color: #ff7a6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff7a6e; } }

.draw { background: #0f2f1c; color: #eef6ea; border: 1px solid var(--line); padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-left: 6px solid var(--hot); }
.draw .big { font-family: var(--display); font-size: clamp(34px, 8vw, 68px); line-height: 1; text-transform: uppercase; min-height: 1.1em; overflow-wrap: anywhere; }
.draw .big.rolling { opacity: .75; }

.assign { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.club { background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--hot); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.club .who { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.club .nm { font-family: var(--display); font-size: 36px; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* plantel */
.strip { display: flex; flex-wrap: wrap; gap: 6px 26px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.strip div { display: flex; flex-direction: column; min-width: 0; }
.strip small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.strip b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs span { padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); }
.tabs span.on { background: var(--accent); color: var(--accent-ink); }
.tabs span.soon::after { content: " · em breve"; font-family: var(--body); font-size: 11px; text-transform: none; letter-spacing: 0; }
.plantel { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .plantel { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; font-weight: 700; }
th.sorted { color: var(--ink); box-shadow: inset 0 -3px var(--hot); }
td.l, th.l { text-align: left; }
td.nm { font-weight: 600; position: sticky; left: 0; background: var(--panel); }
tr.sep td { background: var(--panel2); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); text-align: left; }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover td, tbody tr[data-id]:hover td.nm { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.sel td, tr.sel td.nm { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
td.pos { font-weight: 700; }
.tit { display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 6px; }
.ovr { font-weight: 800; }
.hi { color: var(--accent); font-weight: 700; }
.lo { color: var(--muted); }
.bar { display: inline-block; width: 56px; height: 9px; background: var(--line); vertical-align: middle; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; }
.c-verde { background: var(--st-verde); } .c-verde-claro { background: var(--st-vclaro); } .c-amarelo { background: var(--st-amarelo); } .c-laranja { background: var(--st-laranja); } .c-vermelho { background: var(--st-vermelho); }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
@media (max-width: 960px) { .panel { position: static; } }
.panel .pn { font-family: var(--display); font-size: 28px; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; }
.attr { display: grid; grid-template-columns: 38px 1fr 28px; gap: 8px; align-items: center; font-size: 14px; }
.attr .bar { width: 100%; height: 10px; }
.attr .bar i { background: var(--accent); }
.attr b { text-align: right; }
.fit { display: flex; gap: 6px; flex-wrap: wrap; }
.fit span { border: 1px solid var(--line); padding: 2px 8px; font-size: 14px; }
.fit span b { margin-left: 4px; }
.footnote { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* ---------- tooltip ---------- */
.tooltip { position: fixed; z-index: 50; display: none; max-width: 260px; padding: 8px 10px; background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1.35; pointer-events: none; font-weight: 400; text-transform: none; letter-spacing: 0; box-shadow: 0 4px 14px rgb(0 0 0 / .3); }
[data-tip] { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
th[data-tip] { text-decoration: none; }

/* ---------- casa do jogo: cabeçalho, status, abas ---------- */
.gamehead { display: flex; gap: 16px 28px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.gamehead .head { min-width: 0; flex: 1 1 260px; }
.status { flex: 0 1 460px; min-width: min(100%, 300px); background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--hot); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 15px; }
.srow small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.srow > span, .srow > b { display: flex; flex-direction: column; min-width: 0; }
.srow small.muted { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
.ult { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.rl small { font-size: 12px; }
i.res { font-style: normal; font-weight: 800; width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 12px; color: #fff; flex: none; align-self: center; }
i.res.rV { background: var(--st-verde); } i.res.rE { background: #7d8a80; } i.res.rD { background: var(--st-vermelho); }
.status .btn { align-self: flex-start; font-size: 16px; padding: 8px 18px; }
.tabbtn { appearance: none; border: 0; background: transparent; padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); cursor: pointer; }
.tabbtn:hover { color: var(--ink); }
.tabbtn.on { background: var(--accent); color: var(--accent-ink); }
.tabs .soon { padding: 7px 16px; }
.btn.sm { font-size: 15px; padding: 7px 14px; }

/* plantel */
.plantelwrap { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.barpct { display: inline-flex; align-items: center; gap: 8px; }
.barpct b { font-size: 14px; min-width: 3.2ch; text-align: right; }
.bar.mini { width: 100%; height: 5px; display: block; }
.bad { color: #c0322a; font-weight: 700; } .warn { color: #a56d00; font-weight: 700; }
:root[data-theme="dark"] .bad { color: #ff7a6e; } :root[data-theme="dark"] .warn { color: var(--hot); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bad { color: #ff7a6e; } :root:not([data-theme="light"]) .warn { color: var(--hot); } }
.panel .media { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.panel .media b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.attrn { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 0; }
.attrn span { font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.attrn b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.meters { display: flex; flex-direction: column; gap: 8px; }
.meters > div { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.meters .bar { width: 100%; flex: 1; }
.meters .barpct { width: 100%; }
.meters .barpct .bar { width: auto; flex: 1; }

/* ---------- tabela ---------- */
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.subtabs .tabbtn { border: 1px solid var(--line); font-size: 15px; padding: 5px 14px; }
.subtabs .tabbtn.on { border-color: var(--accent); }
.ligabox { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .ligabox { grid-template-columns: minmax(0, 1fr); } }
table.liga td.z { color: var(--muted); font-size: 13px; width: 2.4em; }
table.liga tr.z-sobe td.z { box-shadow: inset 4px 0 var(--st-verde); }
table.liga tr.z-desce td.z { box-shadow: inset 4px 0 var(--st-vermelho); }
table.liga tr.meu td, table.liga tr.meu td.nm { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
.rodadas { display: flex; flex-direction: column; gap: 12px; }
.rodada, .jdiv { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.rodada h3, .jdiv h3 { font-size: 16px; margin-bottom: 6px; }
.rodada ul, .jdiv ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rodada li, .jdiv li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); font-size: 14px; align-items: baseline; }
.rodada .tc, .jdiv .tc { text-align: right; overflow-wrap: anywhere; } .rodada .tf, .jdiv .tf { overflow-wrap: anywhere; }
.pl { text-align: center; min-width: 3.6em; }
li.meu { background: color-mix(in srgb, var(--hot) 28%, transparent); font-weight: 700; }
.sw { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; } .sw.sobe { background: var(--st-verde); } .sw.desce { background: var(--st-vermelho); }
.ligalado { display: flex; flex-direction: column; gap: 10px; }
.campeao { font-size: 18px; }
.faseCopa { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
table.copa tr.meu td { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
td.venc { font-weight: 800; color: var(--accent); }

/* ---------- escalação ---------- */
.escwrap { display: flex; flex-direction: column; gap: 12px; }
.esccontrols { display: flex; gap: 14px 28px; flex-wrap: wrap; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.esccontrols > div { display: flex; flex-direction: column; gap: 4px; }
.esccontrols .seg { margin-top: 0; }
.escmsg { min-height: 1.4em; color: var(--muted); }
.escgrid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .escgrid { grid-template-columns: minmax(0, 1fr); } }
.campocol { display: flex; flex-direction: column; gap: 6px; }
.campo { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 82vh; background: repeating-linear-gradient(180deg, #1f6b3a 0 12.5%, #1b6035 12.5% 25%); color: rgb(255 255 255 / .55); border: 2px solid #0f3a21; }
.campo .linhas { position: absolute; inset: 0; }
.chip { position: absolute; transform: translate(-50%, -50%); width: 19.5%; min-width: 62px; background: #f5f8f1; color: #13241a; border: 2px solid #13241a; padding: 3px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; text-align: center; line-height: 1.1; font-size: 13px; }
.chip .cs { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #0b6e3f; } .chip .cs em { font-style: normal; color: #b45309; }
.chip b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cv { font-size: 12px; font-variant-numeric: tabular-nums; color: #3c4d41; }
.chip.fora { border-color: #d9780f; background: #fff3e2; }
.chip.sel { outline: 3px solid var(--hot); outline-offset: 1px; background: #fff6cc; }
.chip .bar { background: #c3d0c1; }
.lista { max-height: 82vh; overflow: auto; }
.lista tbody tr { cursor: pointer; }
.lista tbody tr:hover td { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.tit-row td { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
tr.indisp td { opacity: .55; }

/* ---------- jogo ao vivo ---------- */
