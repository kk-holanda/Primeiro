l: terço de baixo da tabela perde menos (Série A 64 → 60, Série D 61 → 59; v19 62 → 48 e 62 → 49). A moral do técnico no terço de baixo continua em espiral (D: 22 → 7).\n\n### 1.6 Copa e pênaltis\n\n| Confronto | Liga: forte vence | Copa: forte vence |\n|---|---|---|\n| 80 × 80 | 35% | 38% |\n| 70 × 40 | 82% | 63% |\n| 90 × 30 | 99% | 82% |\n| 60 × 20 | 94% | 71% |\n\nDisputa de pênaltis (3.000 por linha, 10 melhores de linha e melhor goleiro): visitante vence 40,1% com times iguais (vantagem do mando), 54,3% quando o visitante é muito mais forte (85 × 25) e 27,8% quando é muito mais fraco. A escolha do batedor pelo humano é respeitada (o `batedor` configurado passa para o início da fila). A moral tem efeito pequeno (41,3% e 38,5% com 90 × 30 e 30 × 90). Corrigido: não é mais moeda.\n\n## 2. Mercado, treino e base (o ponto central)\n\n### 2.1 Compra de reforços por clubes da D (Δ ppg, média das 10 posições, jogos contra D / contra B)\n\n| Origem | v19 | v21 |\n|---|---|---|\n| Série D | +0,04 / +0,03 | +0,03 / +0,02 |\n| Série C | +0,08 / +0,03 | +0,10 / +0,02 |\n| Série B | +0,15 / +0,05 | +0,18 / +0,03 |\n| Série A | +0,25 / +0,08 | +0,27 / +0,06 |\n\nO ganho em campo é igual (era esperado, o motor de partida não mudou nesse ponto). Preço médio pedido: C R$ 111 mil, B R$ 393 mil, A R$ 2,17 mi (v19: 115 / 363 / 2.258). Ou seja, o encarecimento (+13% em valor, +10% em salário) foi pequeno. Na tela, jogadores veteranos da A (33 a 37 anos, média 63 a 68) aparecem no topo de \"Melhora para o meu time\" por R$ 210 a 295 mil, com Δ de +28 a +31 para um clube da D; o desconto por idade é o que torna o mercado barato.\n\n### 2.2 Campanhas do técnico-robô (30 campanhas por linha; mesmos mundos e estratégias do relatório 3)\n\nD, 8 anos, 10 piores clubes:\n\n| Estratégia | Força (início → fim) | ppg 1º ano | Chegou à C / B | Caixa final | v19 (C / B) |\n|---|---|---|---|---|---|\n| Passivo | 45,9 → 40,2 | 0,87 | 0% / 0% | R$ 243 mil | 0% / 0% |\n| Só treina (Formador) | 45,9 → 43,7 | 0,95 | 3% / 0% | R$ 160 mil | 3% / 0% |\n| Só livres | 45,9 → 45,9 | 1,10 | 20% / 0% | R$ 415 mil | 40% / 7% |\n| Compra | 45,9 → 42,7 | 1,11 | 7% / 0% | −R$ 47 mil | 23% / 7% |\n| Compra + livres | 45,9 → 45,2 | 1,18 | 10% / 0% | −R$ 79 mil | 27% / 10% |\n| Compra + treina (Formador) | 45,9 → 51,9 | 1,63 | 50% / 3% | −R$ 26 mil | 93% / 60% |\n| Compra + livres + treino Ofensivista / Retranqueiro | → 45,5 / 45,5 | 1,22 / 1,17 | 20% / 13% | | 30% / 53% |\n\nB e C, 6 anos: passivo 1,19 ppg e chega à A em 3%; compra + livres + treino 1,61 ppg, chega à B em 100% e à A em **40%** (v19: 67%), caixa final R$ 1,95 mi (v19: 2,7 mi).\n\nLeituras: (a) o mercado perdeu cerca de metade do efeito, o desejado: sair da D leva muitos anos e quem só joga continua preso; (b) livres perderam o efeito quase de graça (20% contra 40% para a C); (c) o treino de jovens continua sendo o multiplicador (50% contra 7% a 10% sem ele); (d) os robôs compradores terminam com caixa negativo (−R$ 26 a −79 mil), ou seja, o robô (que gasta 60% do caixa sem ver a folha) quebra o clube. Não verifiquei o que o jogo faz com caixa negativo do humano (demissão? bloqueio de compra?), o que merece um teste próprio.\n\n### 2.3 O computador comprando (política \"mesmo nível ou abaixo\", 3 mundos × 8 anos)\n\n| Política | Compras/temporada | ρ força×posição (A / B / C / D) | Campeões da A em 24 temporadas | Caixa D no ano 8 |\n|---|---|---|---|---|\n| Nenhuma (como o jogo faz hoje) | 0 | 0,81 / 0,85 / 0,71 / 0,90 | 6 clubes | R$ 883 mil |\n| Subida | 142 | 0,76 / 0,80 / 0,62 / 0,88 | 7 clubes | R$ 967 mil |\n\nReforça a conclusão do relatório 3: o computador comprando entre si traz um pouco mais de equilíbrio, sem esvaziar o caixa da D. O jogo continua sem implementar isso.\n\n### 2.4 Técnicos do computador (6 personalidades, 4 mundos × 8 anos, resíduo de pontos por temporada ±~0,45)\n\nFormador +1,65, Ofensivista +0,06, Preparador −0,26, Estrategista −0,35, Retranqueiro −0,97, Professor −0,97. Amplitude 2,6 pontos por temporada, como na v19, mas a ordem mudou (no relatório 3: Professor +1,1, Retranqueiro −1,4). Sinal estável: personalidade muda ~1 a 2 pontos por temporada, o Formador é o mais forte nas duas medições mais recentes (v19: +0,07 e v21: +1,65) e o Retranqueiro o mais fraco nas duas.\n\n### 2.5 Elencos montados à mão (mesmo overall, 5 estilos, 3 anos, 20 temporadas-clube por linha no 1º ano)\n\n| Elenco | ppg 1º ano | v19 |\n|---|---|---|\n| Controle | 0,77 | 0,91 |\n| Ataque técnico (4-3-3 ofensivo) | 1,17 | 1,42 |\n| Muralha (4-5-1 defensivo) | 0,84 | 0,83 |\n| Passadores (4-2-3-1) | 1,02 | 1,09 |\n| Desencontro (ataque técnico em 4-5-1 defensivo) | 1,07 | 1,17 |\n\nDiferenças para o controle: ataque +0,40 (v19 +0,51), passadores +0,25 (+0,18), muralha +0,07 (−0,08), desencontro +0,30 (+0,26). Erro padrão de ~0,07 a 0,10 por linha. A hierarquia (ataque > passe > defesa) continua, mas a distância caiu.\n\n### 2.6 Estilos e habilidade do técnico (campanhas de 1 ano)\n\nDez estilos: amplitude 0,114 ppg (4,4 pontos por temporada; v19 0,099): Leitor 1,036 no topo, Equilibrado 4-4-2 0,921 por último. Habilidade: aleatório 1,137, passivo 1,054, intuitivo 1,075, estudioso 1,047, expert 1,168. O expert fica +0,11 do passivo (antes 0,015); o aleatório fica competitivo (ruído).\n\n## 3. Interface e multiplayer\n\n- 12 partidas pelo navegador, compra de jogador da C pela tela (caixa R$ 426 mil → 42 mil, elenco +1), treino iniciado, escalação 3-5-2 ofensiva aplicada ao motor, tabs e finanças: **sem erros de JavaScript**.\n- Mercado novo na tela: abre com \"Só o que cabe no caixa\" ligado, colunas MÉD e Δ, filtros de idade e \"Só quem melhora meu time\", ordenação por custo-benefício; posições extras aparecem (por exemplo \"SA/CA\", \"MC/ALA\").\n- Ingresso fixo (sem mudança); lotação A 61 / B 46 / C 34 / D 25%, nenhum clube chega ao piso de 3%.\n- Determinismo (2 anos): 1, 4 e 8 humanos idênticos entre ao vivo × ao vivo, ao vivo × passo a passo e ao vivo × simulação rápida; 10 humanos na D com táticas independentes.\n\n## 4. Pendências e propostas para discutir\n\n1. **Stamina:** confirmar se a nova curva quadrática é a intenção. Efeito atual: 10 pontos de stamina = ~0,5 ppg. Se for demais, alternativas: expoente 1,5 ou piso de 0,60.\n2. **Caixa negativo do humano:** testar o que acontece e avisar antes de comprar (a tela já bloqueia compra acima do caixa, mas não considera a folha mensal e as luvas dos livres).\n3. **Veteranos baratos da Série A** dominam a lista \"Melhora para o meu time\" (R$ 210 a 295 mil por jogadores de 33 a 37 anos). Pode valer um desconto por idade menos agressivo ou contratos com salário que não cai com a idade.\n4. **Treino de jovens (Formador) segue como multiplicador** do mercado. Se quiser reduzir ainda mais a diferença entre estratégias, limitar o ganho acumulado por temporada.\n5. **O computador comprando e vendendo** continua não implementado; a política \"mesmo nível ou abaixo\" é a que recomendo.\n6. **Defesa de zagueiro e lateral (atributo DEF)** segue sem retorno acima do overall (−0,01 a +0,05).\n7. **Série B** ainda tem campeão = mais forte em 52% (Série A 24%), ainda acima do nível de C (37%) e D (35%).\n8. **Moral do técnico no terço de baixo** continua em espiral (D: 22 → 7).\n"}, {"id": "relatorios/08-medicoes-melhorias-22.md", "titulo": "Medições da Melhorias #22 (v22)", "md": "# Kfoot 98 — Medições da Melhorias #22 (v22)\n\nMétodo: motor real em Node, 4 temporadas completas (6.712 jogos) por medição, sementes comuns; efeitos de cada trait em 1.500 a 3.000 jogos pareados (mesmo jogo com e sem o trait, mesmas sementes). ± é erro padrão.\n\n## Resumo\n- **Posse ao vivo**: a posse mostrada agora é a dos últimos minutos e oscila bastante (num jogo de teste foi de 28% a 54%, 19 valores diferentes em 90 minutos); o total do jogo continua no resumo.\n- **Acréscimos**: 1º tempo 1,8' em média (1 a 6), 2º tempo 3,6' (1 a 8). Como o jogo dura ≈ 5,4' a mais, os eventos por minuto foram multiplicados por 0,94: gols/jogo 2,618 (v21) → 2,638; faltas 21,25 → 21,06; lesões 0,111 → 0,108.\n- **Prorrogação na Copa**: de 316 voltas, 47 (15%) foram à prorrogação e 25 (8%) aos pênaltis (na v21 eram 45 pares empatados, 14%, direto aos pênaltis). A prorrogação resolveu 22 dos 47 empates.\n- **Estrelas por time** (média / mín–máx): A 3,05 (2–4) · B 2,15 (1–3) · C 1,65 (1–2) · D 1,40 (1–2). Média do melhor 11: A 75,0 → 76,5, B 63,1 → 64,5, C 55,9 → 57,0, D 48,8 → 50,2. Efeito colateral: as estrelas extras derrubavam os gols em ≈ 10% (A 2,66 → 2,38); calibrado com ataques por minuto 0,56 → 0,575 e chance de gol ×1,065. Gols/jogo depois: A 2,53, B 2,48, C 2,62, D 2,70 (v21: 2,66, 2,60, 2,59, 2,57), média da liga 2,59.\n- **Traits**: 2 a 4 por time (média 2,9; 1.920 jogadores, 231 com trait).\n\n## Efeito de cada trait (por jogo, jogador com × sem)\n| Trait | Medida | Sem → com |\n|---|---|---|\n| Matador | gols do jogador / gols do time em cara a cara | 0,269 → 0,293 / 0,152 → 0,175 |\n| Salvador da pátria | gols do reserva que entra aos 76' | 0,034 → 0,058; chutes 0,40 → 0,55 |\n| Líder nato | gols do time (efeito pequeno de propósito) | 1,33 → 1,32 (só +5 de moral no 2º tempo quando perde no intervalo) |\n| Batedor de faltas | gols de falta / gols | 0,021 → 0,054 / 0,289 → 0,325 |\n| Desarmador | desarmes / faltas cometidas | 1,26 → 1,79 / 1,11 → 1,08 |\n| Catimbeiro | faltas sofridas | 0,070 → 0,138 |\n| Driblador | passes tentados / faltas sofridas | 83,3 → 61,2 / 0,070 → 0,227 |\n| Cabeção | gols de cabeça | 0,013 → 0,023 |\n| Maestro | assistências / gols de cara a cara do time | 0,088 → 0,113 / 0,152 → 0,159 |\n| Cabeça de gelo | amarelos / vermelhos | 0,163 → 0,092 / 0,007 → 0,002 |\n| Highlander | stamina ao fim do jogo | 85,4 → 87,6 (lesões são raras demais para medir em 1.500 jogos) |\n| Coringa | média no slot | 100% da média natural em qualquer posição de linha |\n| Popstar, Menino prodígio | economia e progressão (não entram no motor da partida) | patrocínio +4 pp e público +4% por popstar; progressão ×1,5 nos jogos e treinos |\n\nAjustes feitos nas medições: batedor de faltas estava triplicando os gols de falta (+0,09 por jogo) e foi reduzido pela metade; o desarmador fazia 83% mais desarmes e foi reduzido para +42%.\n\n## Verificações\nRegressão em navegador (t13 a t29) sem erros de console, mais testes novos: acréscimos no relógio (45+1', 90+3'), pausa do intervalo, tela de resultados da Copa sem humano, conversa com tom e alvo, etiquetas de trait e legenda.\n"}, {"id": "relatorios/09-bateria-v22.md", "titulo": "Relatório 5: bateria completa na v22 (traits, acréscimos, compras da Série D, técnicos do computador)", "md": "# Kfoot 98 — Relatório 5: bateria completa na v22 (traits, acréscimos, compras da Série D, técnicos do computador)\n\nVersão testada: v22 (commit \"Melhorias #22\", branch `claude/melhorias-5-xt6u1f`). Só li o código e simulei; nada foi alterado. Scripts e resultados brutos em `scripts-05/` e `scripts-05/resultados/`. Comparação com o relatório 4 (v21).\n\nMargens de erro: ± é o erro padrão (≈ 2 × para o intervalo de 95%). Pontos por jogo = \"ppg\" (1 ppg a mais ≈ 38 pontos por temporada).\n\n## 0. Resumo (o que o KK precisa saber)\n\n1. **O campeonato continua equilibrado e nada quebrou.** Gols, mando, empates, correlação força × posição e variedade de campeões praticamente iguais à v21. A Série D agora tem mais gols (2,59 contra 2,42).\n2. **Os 14 traits são seguros, mas fracos demais para o jogador sentir.** O conjunto típico (2 a 4 por time) vale **+0,02 ppg** (≈ 0,8 ponto por temporada). O melhor trait sozinho (Matador) vale +0,016 ppg. Há muita margem para aumentar os efeitos sem desbalancear.\n3. **Dois traits quase não funcionam:** Salvador da pátria (o computador quase nunca coloca ninguém depois dos 75 minutos: 0,07 substituição por jogo) e Maestro/Líder/Coringa/Highlander/Gelo, que ficam abaixo de 0,01 ppg quando só um jogador os tem.\n4. **O sorteio dos traits é torto:** Gelo (19% de todos os traits) e Highlander (13%) dominam; Maestro, Salvador e Desarmador têm 3% cada. **45% dos Highlanders e 17% dos Gelos caem em goleiros**, onde quase não servem.\n5. **Acréscimos e prorrogação funcionam:** jogo dura 94,5 min em média (máx. 100 na liga), 6% dos gols saem depois dos 90 min; na Copa, 15% das voltas vão à prorrogação e 8,5% aos pênaltis.\n6. **Estrelas:** A 2,9, B 2,1, C 1,6, D 1,2 por time (todas as séries com pelo menos 1).\n7. **Compras na Série D:** um craque de ataque sozinho rende menos do que três reforços equilibrados baratos. **Os preços de ataque/meio são de 10 a 20 vezes menores do que os de goleiro/zagueiro/lateral/volante** para um ganho que é só 1,5 a 2 vezes maior (ponto novo, seção 4).\n8. **Os 6 pontos da v21 continuam em aberto para o KK decidir** (seção 7), com os números da v22.\n\n## 1. Campeonato no geral (3 mundos × 10 anos, 90.612 jogos de liga)\n\n| Medida | v21 | v22 |\n|---|---|---|\n| Gols por jogo (A / B / C / D) | 2,67 (2,81 / 2,74 / 2,54 / 2,42) | **2,74** (2,80 / 2,72 / 2,62 / 2,59) |\n| Casa / empate / fora | 42,2 / 23,0 / 34,9 | 41,9 / 23,4 / 34,8 |\n| 0×0 | 7,1% | 7,2% |\n| Goleadas (4+ gols) | — | 3,7% |\n| Correlação força inicial × posição final, Série A | 0,77 | 0,76 |\n| Campeão da A era o mais forte | 24% | 24% (top 3: 65%) |\n| Campeões diferentes da A (54 temporadas) | 10 | 9 (Flamengo 15, Palmeiras 12, Corinthians 9, Vasco 7, Cruzeiro 4, São Paulo 3...) |\n| ρ B / C / D | — | 0,81 / 0,67 / 0,91 |\n| Pontos do campeão / lanterna (A) | — | 82 / 18 |\n| Lotação média A / B / C / D | — | 61% / 46% / 34% / 25% |\n| Resultado financeiro por ano (A / B / C / D, R$ mil) | — | +1.948 / +722 / +350 / +113 |\n\nLeitura: a diferença de 10 pontos de overall entre os dois times dá 84% de vitória para o mais forte (e 4% para o mais fraco); 0 de diferença dá 41/28/32. A D tem ρ 0,91 (a mais previsível); a C é a mais aberta (0,67). O mundo de 25 anos sem jogadores humanos mantém o nível das séries estável (top14 A 71,7 a 75,6, D 48,1 a 51,8), sem inflação.\n\n## 2. O que muda o resultado: posição, atributos, tática (base 1,368 ppg, ±0,024)\n\n**+10 de overall em um titular (v21 entre parênteses):** CA +0,22 (+0,18), SA +0,19, VOL +0,14 (+0,14), MC +0,14 (+0,13), ALA +0,10 a +0,11 (+0,16), GOL +0,135 (+0,11), LD +0,10, ZAG +0,08 (+0,06), LE +0,06. **+10 nos 4 meias +0,59; nos 4 defensores +0,41; nos 2 atacantes +0,43.** Praticamente igual à v21. O atacante continua sendo o jogador individual que mais vale.\n\n**+10 em um atributo nos 11 titulares:** Finalização +0,31, Defesa +0,30, Passe +0,27, Drible +0,21, Ritmo +0,19, Físico +0,17 (v21: +0,29 / +0,28 / +0,30 / +0,23 / +0,18 / +0,17). Todos os atributos fazem diferença; Físico é o que menos.\n\n**Formato do overall igual:** atacante com CHU +12 e FIS compensando dá +0,18 ppg; defensor DEF +12 só +0,02; meias com PAS +12 +0,09 e com DRI +12 +0,10; time todo com RIT +12 +0,04 e FIS +12 −0,10. Ou seja, o overall esconde diferenças: finalização do atacante e passe/drible do meio rendem mais do que o overall indica; força física pura rende menos.\n\n**Goleiro:** elite (+15) +0,20; ruim (−20) −0,22. Qualquer jogador de linha no gol dá 0,51 a 0,57 ppg (a escalação errada é fortemente punida; a IA do jogo trata isso). Trocas erradas de posição custam muito: 4 atacantes na defesa 0,61; melhor goleiro no centroavante 1,00.\n\n**Formação × tática (24 combinações, 4.830 jogos cada):** amplitude 0,103 ppg (v21: 0,08). O topo é 3-4-3 defensivo 1,441 (destoa das demais; com ±0,02 por linha e 24 linhas, parte pode ser sorte) e o pior 4-3-3 ofensivo 1,338. As outras 22 combinações estão em 1,343 a 1,394. **Não há formação dominante, mas o ataque total (ofensivo) perde um pouco em quase todas (4-3-3, 4-2-3-1, 4-4-2, 4-5-1 ofensivos estão entre os 6 piores).**\n\n**Intervalo (6.000 jogos por linha):** resposta tática certa +0,10; resposta errada −0,03; formação pelo placar +0,15; sortear não muda nada. Igual à v21. Sinergia ≈ 0 (média −0,15%, p95 2,5%).\n\n**Habilidade do técnico-robô (N=40 por célula):** Aleatório 1,07 / Passivo 1,06 / Intuitivo 1,08 / Estudioso 1,10 / Expert 1,19 ppg. **Expert contra passivo: +0,13 ppg** (v21: +0,11). O estilo (10 estilos) tem amplitude 0,143, mas com N=40 isso está dentro do ruído (±0,07 por estilo).\n\n**Cansaço e moral:** stamina 90/80/70 dão 0,79 / 0,41 / 0,19 ppg (v21: 0,84 / 0,40 / 0,19). Inalterado, ver ponto 1 da seção 7. Moral 0 / 100: 0,92 / 1,64 contra 1,34 de base (±0,3 ppg, efeito grande e saudável). \"Sempre o melhor 11\" 0,31 contra 0,41 do automático.\n\n**Copa:** um time prestígio 90 contra 30 vence 85% (v21: 82%), 80 × 80 vence 38% e perde 36%. A copa dá mais chance de zebra que a liga (98% na liga para 90 × 30).\n\n## 3. Traits (os 14 novos)\n\n### 3.1 Como são distribuídos (20 mundos, 1.600 times)\n\n2 a 4 traits por time em todos os 1.600 times (média 2,97). 4.753 jogadores com trait em 38.400 (12%). Depois de 12 anos o mínimo continua 2, a média cai para 2,6 (aposentadorias).\n\n| Trait | Qtd | Parte do total | Observação |\n|---|---|---|---|\n| Gelo | 885 | 18,6% | 17% em goleiros |\n| Highlander | 598 | 12,6% | **45% em goleiros** |\n| Líder | 433 | 9,1% | 23% em goleiros |\n| Coringa | 430 | 9,0% | |\n| Cabeção | 419 | 8,8% | 76% em ZAG/VOL |\n| Prodígio | 382 | 8,0% | idade média 19,5, máx. 21 (nenhum com 22+ em 12 anos) |\n| Popstar | 283 | 6,0% | |\n| Catimbeiro | 256 | 5,4% | |\n| Batedor de faltas | 255 | 5,4% | |\n| Matador | 216 | 4,5% | 54% em CA |\n| Driblador | 166 | 3,5% | |\n| Desarmador | 149 | 3,1% | |\n| Salvador | 142 | 3,0% | |\n| Maestro | 139 | 2,9% | só MC (87) e MEI (52) |\n\nO goleiro absorve o que sobra: quase todos os traits têm peso 0 para o goleiro, então quando o sorteio cai nele só restam Gelo, Highlander, Líder e Prodígio. Resultado: goleiros com traits quase inúteis e atacantes com poucos traits úteis.\n\n### 3.2 Efeito de cada trait\n\nDois testes, 6.000 jogos pareados (mesmo time, com e sem trait, casa/fora alternado): (a) **um jogador** com o trait, (b) o trait em **todos** os jogadores das posições-alvo (mostra o limite superior).\n\n| Trait | O que mede | Em UM jogador (Δ ppg ±) | Em todos os alvos (Δ ppg ±) |\n|---|---|---|---|\n| Matador | gols dos atacantes | gols +0,021/jogo; **+0,016 ±0,003** | +0,063 gols; +0,042 ±0,010 |\n| Batedor de faltas | gols de falta | +0,006 gols; +0,004 ±0,002 | +0,049 gols; +0,025 ±0,011 |\n| Cabeção | gols de cabeça | +0,012; +0,009 ±0,004 | +0,069; +0,057 ±0,015 |\n| Driblador | passes dos ofensivos | −0,73 passes; +0,018 ±0,011 | −2,2 passes; +0,051 ±0,036 |\n| Catimbeiro | faltas do adversário | +0,03; +0,009 ±0,005 | +0,11; +0,014 ±0,016 |\n| Desarmador | desarmes | +0,08; +0,008 ±0,006 | +0,45; +0,021 ±0,021 |\n| Gelo | cartões | −0,068; +0,001 ±0,002 | −0,59; +0,010 ±0,009 |\n| Maestro | assistências dos meias | ≈ 0; +0,001 ±0,006 | +0,003; +0,027 ±0,016 |\n| Highlander | lesões do time | −0,002; −0,006 ±0,011 | −0,023; **+0,117 ±0,041** |\n| Líder | gols do time | ≈ 0 | ≈ 0 (−0,010 ±0,013) |\n| Coringa | gols do time | ≈ 0 | — (não afeta gols; vale por poder jogar em várias posições) |\n| Salvador | gols de quem entra aos 75+ | ≈ 0 | +0,001 |\n| Popstar / Prodígio | economia e progressão | não mede em jogo | só código |\n\n**Conjunto realista** (2 a 4 traits sorteados como o jogo faz, 8.000 jogos): **+0,020 ±0,009 ppg**, saldo +0,024 ±0,010. Menos de 1 ponto por temporada.\n\nLeituras:\n\n- **Matador** é o único que se destaca em gols: aumenta em 20% a chance de converter o cara a cara (+0,021 gols por jogo, cerca de +0,8 gol por temporada).\n- **Highlander** vale quase nada num jogador (+0,006) mas **+0,117 ppg quando todo o time tem**, porque a stamina cai 15% mais devagar e a curva de stamina da v21 é muito punitiva (ponto 1 da seção 7). Isso é um sinal de que o efeito de stamina é forte; um time de Highlanders seria visivelmente melhor.\n- **Salvador da pátria:** o computador só substitui aos 60/70/80. Em 400 jogos, o computador só colocou **0,07 jogadores por jogo depois dos 75 minutos** e 0,03 de ataque. Nos times do computador o trait praticamente nunca dispara. Só tem efeito para humano que substitui tarde, perdendo ou empatando.\n- **Líder:** age no moral no intervalo quando o time perde e como capitão (+6 de nota no sorteio); não aparece em gols. É um efeito de moral que não medi diretamente em campo.\n- **Maestro:** multiplica por 1,9 a chance do passe que deixa o atacante cara a cara, mas isso virou +0,001 ppg com um maestro: a chance de \"cara a cara\" é pequena e quase todos os gols dependem de outros fatores.\n- **Gelo/Catimbeiro/Desarmador:** mudam estatísticas (cartões, faltas, desarmes), mas não pontos. São de sabor, não de poder.\n- **Popstar e Prodígio** são de economia e progressão (patrocínio +4% de aceite por popstar até +12 pp, público +4% até +8%, treino/progressão ×1,5 até 21 anos). Só verifiquei no código e que o Prodígio perde a marca aos 22 (0 com 22+ em 12 anos). Não simulei o efeito financeiro.\n\n### 3.3 Margem para ajustar\n\nO balanceamento aguenta com folga efeitos 3 a 5 vezes maiores. Com um conjunto de 3 traits valendo +0,02 ppg, o time com 3 matadores no ataque ainda teria menos de +0,1 ppg. Sugestões de ajuste para o KK (nenhuma implementada): (a) goleiro não receber traits fora de uma lista própria (ex.: \"Pegador de pênaltis\", \"Paredão\"); (b) peso do sorteio mais parecido entre os traits; (c) subir Salvador (por exemplo, também para quem entra de qualquer minuto depois dos 60), Maestro e Líder; (d) o computador usar o banco depois dos 75 quando está perdendo.\n\n## 4. Acréscimos, prorrogação, estrelas e Copa sem humanos\n\n- **Duração:** média 94,5 min na liga (mínimo 92, p95 97, p99 98, máximo 100). 6,1% dos gols saem depois dos 90 min.\n- **Copa:** 316 voltas simuladas, 48 (15%) foram à prorrogação, 27 (8,5%) aos pênaltis. Nenhum jogo ficou sem vencedor. Mesmos números que o relatório 08 da outra thread.\n- **Estrelas (por time):** A 2,88 (2 a 4), B 2,14 (1 a 3), C 1,64 (1 a 2), D 1,21 (1 a 2).\n- **Tela:** relógio com acréscimo (`90+2'`, `90+3'`) e posse de bola aparecem na tela do jogo; a classificação, a tela de resultados da Copa sem humanos (\"Nenhum técnico humano joga nesta rodada...\", \"Pular para os resultados\") e o botão CONTINUAR funcionam; o aviso da diretoria (moral do técnico abaixo de 20) aparece e fecha. A tela \"Conversar com o grupo\" abre com tom (elogiar/motivar/cobrar) e escolha de quem falar. Zero erros no console.\n- **Determinismo:** idêntico entre jogo ao vivo, passo a passo e `simularDia`, com 1, 4 e 8 humanos (o teste mostrava \"diferente\" na primeira execução por um erro do meu script, que parava aos 90 minutos; corrigido e repetido: tudo idêntico).\n- Limitação do meu robô de tela: em 12 partidas seguidas ele não passa pelo dia de Copa sem humanos; 8 a 9 partidas de liga pela interface rodaram sem erro e a tela da Copa foi testada separadamente.\n\n## 5. Compras e treino nos times da Série D\n\n### 5.1 Compra de reforços (10 clubes iniciáveis × 3 mundos; Δ ppg do time com o reforço contra o mesmo time sem)\n\n| Posição | D | C | B | A |\n|---|---|---|---|---|\n| Média das 10 posições, contra clubes da D | +0,07 | +0,12 | +0,27 | +0,32 |\n| Média das 10 posições, contra clubes da B | +0,01 | +0,03 | +0,05 | +0,07 |\n| Preço médio pedido (R$ mil) | 97 | 255 | 918 | 5.460 |\n\n(v21: +0,03 / +0,10 / +0,18 / +0,27 contra D; +0,02 / +0,02 / +0,03 / +0,06 contra B. O ganho contra a D subiu, mais na B (+0,18 para +0,27). Não investiguei a causa: o motor de partida mudou (acréscimos, traits, estrelas) e a amostra é outra; a leitura qualitativa é a mesma.)\n\n**Preço por posição (origem B, R$ mil):** GOL 1.866, ZAG 2.500, LD 1.022, LE 1.105, VOL 2.069, MC 114, MEI 153, PD 106, PE 127, CA 123. Origem A: GOL 8.474, ZAG 11.721, LD 8.988, LE 11.760, VOL 11.235, MC 470, MEI 596, PD 447, PE 435, CA 479. O ganho (Δ ppg contra D) de origem B: GOL +0,40, ZAG +0,27, LD +0,30, VOL +0,32 contra MC +0,19, MEI +0,28, PD +0,18, PE +0,23, CA +0,19.\n\n**Ponto novo:** um zagueiro da B custa 20 vezes um centroavante da B, para um ganho só 1,4 vez maior. Um clube da D com R$ 450 mil só consegue comprar ataque/meio. É por isso que \"só atacantes\" é a estratégia de compra mais eficiente (próxima seção). Não olhei a fórmula de preço; o que vejo é que os jogadores de ataque e meio saem muito mais baratos para a mesma divisão de origem.\n\n### 5.2 Cenários de compra (30 compras por cenário × 3 mundos; Δ ppg contra D / contra B; custo médio)\n\n| Compra | Δ ppg vs D | Δ ppg vs B | Custo (R$ mil) |\n|---|---|---|---|\n| 1 craque CA da A (o melhor) | +0,36 ±0,04 | +0,03 ±0,01 | 679 |\n| 1 CA bom da A (10º) | +0,38 ±0,04 | +0,04 ±0,01 | 534 |\n| **1 CA da B (5º)** | +0,23 ±0,04 | +0,02 ±0,01 | **114** |\n| 1 GOL da A (o melhor) | +0,41 ±0,04 | +0,15 ±0,02 | 10.995 |\n| 3 equilibrados da B (ZAG, MC, CA) | +0,66 ±0,04 | +0,13 ±0,02 | 2.796 |\n| **3 de ataque da B (CA, PD, PE)** | **+0,71** ±0,04 | +0,10 ±0,02 | **344** |\n| 3 de defesa da B (GOL, ZAG, ZAG) | +0,84 ±0,04 | +0,25 ±0,02 | 7.176 |\n| 3 de meio da B (MC, MEI, VOL) | +0,73 ±0,04 | +0,16 ±0,02 | 2.504 |\n| **6 da C (uma por posição-chave)** | **+0,94** ±0,04 | +0,22 ±0,02 | 2.152 |\n| 2 craques da A (CA + MEI) | +0,56 ±0,04 | +0,09 ±0,02 | 1.448 |\n| **1 CA da A + 5 baratos da D** | **+0,93** ±0,04 | +0,22 ±0,02 | 2.261 |\n\nResposta às perguntas do KK:\n\n- **Comprar só um CA muito forte?** Ajuda (+0,36 contra a D), mas **menos que um CA da B barato (+0,23 por R$ 114 mil) em custo-benefício**, e perde para qualquer pacote de 3 ou mais reforços (+0,66 a +0,94). Um craque sozinho tem retorno decrescente (o 10º CA da A rende igual ao melhor).\n- **Comprar mais jogadores em posições diferentes, mais equilibrados?** É o que mais rende: 6 reforços da C (+0,94) ou 1 craque + 5 baratos (+0,93) superam 2 craques (+0,56). Contra a Série B o ganho dos pacotes é +0,22 ppg, que é o suficiente para brigar com ela mas não para dominá-la.\n- **Só defesa?** O melhor ganho absoluto (+0,84) é de defesa, mas custa R$ 7 milhões, fora do alcance da D (caixa médio R$ 444 mil). Dentro do orçamento da D, o melhor é ataque + meio.\n\n### 5.3 Campanhas do técnico-robô (30 por linha, 8 anos, 10 piores clubes da D)\n\n| Estratégia | Força 14 melhores | ppg 1º ano | Chegou à C / B / A | Caixa final (R$ mil) | Compras |\n|---|---|---|---|---|---|\n| Passivo | 46,6 → 40,0 | 0,78 | 0% / 0% / 0% | 224 | 0 |\n| Só treina (Formador) | 46,6 → 43,3 | 0,87 | 0% | 185 | 0 |\n| Só treina (Professor) | 46,6 → 41,6 | 0,83 | 0% | 330 | 0 |\n| Só compra | 46,6 → 42,4 | 1,15 | 0% | −75 | 6,8 |\n| **Compra + treina (Formador)** | 46,6 → **51,7** | **1,46** | **37% / 3% / 0%** | **−486** | 9,0 |\n| Só livres | 46,6 → 46,3 | 1,03 | 17% / 0% / 0% | 39 | 6,1 |\n| Compra + livres | → 44,2 | 1,08 | 10% | −242 | 8,2 |\n| Treina + livres | → 49,4 | 1,08 | 20% / 3% | 10 | 5,7 |\n| Compra + treina (Ofensivista) | → 44,2 | 1,17 | 7% | −203 | 7,9 |\n| Compra + treina (Retranqueiro) | → 45,1 | 1,19 | 13% | −270 | 7,9 |\n\n(v21: compra + treina Formador 50% C / 3% B, caixa −26; só livres 20% C.) Em campanhas de clubes da C (10 clubes por linha): compra + livres + treina chega à B em 97% e à A em 23% dos casos (passivo: 57% e 7%), com caixa final de R$ 1,7 mi contra R$ 6,0 mi do passivo.\n\n**O caixa negativo dos robôs é maior que na v21 (−486 contra −26 mil em 8 anos).** O meu robô comprou até ficar com caixa negativo; não verifiquei qual regra do jogo permite isso. É o ponto 2 da seção 7.\n\n### 5.4 Elencos montados à mão (20 campanhas por linha)\n\n| Elenco | ppg ano 1 | ppg ano 2 | Posição média anos 3+ |\n|---|---|---|---|\n| 1 Controle (4-4-2 equilibrado) | 0,81 | 0,76 | 16,9 |\n| 2 Ataque técnico (Fin/Drib/Ritmo, 4-3-3 ofensivo) | **1,20** | 0,83 | 13,9 |\n| 3 Muralha (Def/Fís, 4-5-1 defensivo) | 0,85 | 0,69 | 15,9 |\n| 4 Passadores (Passe/Drible, 4-2-3-1) | 0,98 | 0,83 | 14,4 |\n| 5 Desencontro (ataque técnico em 4-5-1 defensivo) | 1,03 | 0,72 | 16,3 |\n\nIgual à v21 (0,77 / 1,17 / 0,84 / 1,02 / 1,07). O elenco de ataque técnico continua sendo o mais forte (+0,39 sobre o controle) e a muralha só +0,04 (ponto 6).\n\n## 6. Técnicos do computador e compra pelo computador\n\n### 6.1 Perfis de técnico (resíduo de pontos por temporada contra o esperado pela força; 328 a 552 temporadas por perfil)\n\n| Perfil | Resíduo (pts/temporada) | ± |\n|---|---|---|\n| Professor | **+0,98** | 0,39 |\n| Formador | **+0,95** | 0,48 |\n| Ofensivista | −0,25 | 0,44 |\n| Estrategista | −0,25 | 0,51 |\n| Preparador | −0,77 | 0,50 |\n| Retranqueiro | −0,92 | 0,42 |\n\nv21: Formador +1,65, Ofensivista +0,06, Preparador −0,26, Estrategista −0,35, Retranqueiro −0,97, Professor −0,97. **O ranking mudou:** Professor foi de −0,97 para +0,98 (o erro é grande: ± 0,4 de cada lado, então a diferença entre Professor, Formador e o resto pode ser em parte ruído). A amplitude entre o melhor e o pior perfil é ≈ 1,9 ponto por temporada, **pequena** (5% da pontuação de um campeão). Os perfis ligados a treino (Professor, Formador) são os melhores, os defensivos (Retranqueiro, Preparador) os piores. Nenhum perfil é dominante.\n\n### 6.2 Compra simulada pelo computador (o jogo ainda não faz; simulei a política \"subida\": clube só compra mesmo nível ou abaixo, 24 temporadas, 80 clubes)\n\n| Medida | Sem compras | Com compras (\"subida\") |\n|---|---|---|\n| Compras por temporada | 0 | 112 |\n| Fluxo (24 anos): mesma divisão | — | D>D 613, C>C 689, B>B 765, A>A 476 |\n| Subindo de divisão | — | D>C 46, C>B 43, B>A 44, D>B 6, C>A 1 |\n| ρ força × posição A / B / C / D | 0,80 / 0,84 / 0,63 / 0,92 | 0,77 / 0,82 / 0,65 / 0,88 |\n| Campeões diferentes (24 anos) | 6 | 6 |\n| Força média ao fim (A / B / C / D) | 73,2 / 63,7 / 57,1 / 49,4 | 73,9 / 64,3 / 57,8 / 49,4 |\n| Caixa ao fim, A / B / C / D (R$ mil) | 20.618 / 7.310 / 2.658 / 957 | 20.265 / 6.743 / 2.940 / 1.101 |\n| Clubes com caixa negativo por ano | 0,5 | 0,5 |\n\nCom a política \"mesmo nível ou abaixo\": o campeonato fica ligeiramente mais aberto (ρ cai de 0,03 a 0,04), os clubes ficam um pouco mais fortes, o caixa não é afetado e a Série D não ganha força (clubes da D só compram outros da D). É a política que o relatório 4 recomendou (ponto 5), e continua sendo segura.\n\n## 7. Os 6 pontos da v21 (continuam em aberto para o KK decidir)\n\n1. **Cansaço punitivo.** Inalterado na v22: stamina 80 custa 0,93 ppg (0,41 contra 1,34); 70 custa 1,15; \"sempre o melhor 11\" 0,31 contra 0,41. O Highlander na v22 mostra a força disso (+0,117 ppg com o time inteiro). A escolha é do KK: manter, suavizar a curva (ex.: expoente 1,5) ou tornar o Highlander mais forte.\n2. **Caixa negativo dos robôs.** Pior que na v21 (−486 mil contra −26 mil em 8 anos para Compra + treina). O que o jogo faz com um clube de caixa negativo continua sem teste (limite de dívida, venda forçada, nada?). Precisa de decisão: bloquear compra acima do caixa, ou permitir com consequência.\n3. **Veteranos baratos da A dominam o mercado.** Inalterado: a lista \"Melhora para o meu time\" na tela continua mostrando goleiros de 32 a 37 anos da B por R$ 109 a 270 mil (Δ +20 a +24). É o desconto por idade.\n4. **Treino de jovens (Formador) como multiplicador.** Sob a lupa: Formador e Professor ficaram com resíduo parecido (+0,95 e +0,98 pts/temporada), ou seja, o Formador deixou de ser o outlier da v21 (+1,65). Mas \"compra + treina Formador\" ainda é a única campanha que chega à C com frequência (37%).\n5. **Computador não compra jogadores.** Continua sem comprar; a política \"mesmo nível ou abaixo\" foi simulada acima (seção 6.2) e é recomendada.\n6. **Elenco de ataque rende mais que o de defesa.** Inalterado (+0,39 contra +0,04 ppg no ano 1 dos elencos montados; +0,22 de um CA contra +0,08 de um ZAG com +10 de overall). Com o preço novo (5.1), a diferença de preço entre ataque e defesa aumenta o efeito na compra.\n\n**Ponto novo (7):** diferença de preço entre posições (seção 5.1) e **ponto novo (8):** o sorteio dos traits (seção 3.1), com 45% dos Highlanders em goleiros.\n\n## 8. Arquivos\n\n- `scripts-05/` (todos os scripts da v22, incluindo `t13.js`/`t13b.js` por trait, `t14.js` estrelas e acréscimos, `t15.js` cenários de compra, `t16.js` conjunto de traits, `t17.js` distribuição de traits) e `scripts-05/resultados/`.\n- Comparar com `relatorio-testes-04-v21.md` e `08-medicoes-melhorias-22.md` (medições da própria thread de código).\n"}, {"id": "relatorios/11-medicoes-melhorias-23.md", "titulo": "Medições da Melhorias #23 (v24)", "md": "# Kfoot 98 — Medições da Melhorias #23 (v24)\n\nMedições feitas com o próprio motor do jogo (simulações sem técnico humano e confrontos pareados). A lista de estilos de técnicos não está aqui: ela foi entregue pela thread Regras e Características.\n\n## 1. Stamina mais suave\n\nExpoente da curva de stamina: de 2 (v22) para 1,25. Força do jogador = 0,55 + 0,45 × (stamina/100)^expoente. Pontos por jogo de um time inteiro que começa o jogo com a stamina indicada, contra um time descansado de mesma força (1.200 pares, 2.400 jogos por linha):\n\n| Stamina | v22 (expoente 2) | 1,5 | **v24 (1,25)** | Linear (1,0) |\n|---|---|---|---|---|\n| 100 | 1,34 | 1,34 | 1,33 | 1,36 |\n| 90 | 0,79 | 0,93 | **0,95** | 1,01 |\n| 80 | 0,41 | 0,48 | **0,60** | 0,70 |\n| 70 | 0,19 | 0,26 | **0,35** | 0,42 |\n| 60 | 0,10 | 0,14 | **0,17** | 0,23 |\n\nContinua punitivo (time todo com 80 de stamina perde 55% dos pontos), mas bem menos extremo que antes. Se você ainda achar duro, o próximo passo seria a curva linear (80 → 0,70). O cansaço durante o jogo também conta, por isso as perdas são maiores do que a força isolada sugere.\n\n## 2. Highlander\n\n- Lesão: fator ×0,6 → **×0,45** (25% menos lesões que o Highlander da v22). Em 12.000 jogos pareados, as lesões por jogo do jogador foram de 0,4% sem a trait para 0,2% (v22) e 0,1% (v24); a diferença é pequena demais para medir com precisão nessa escala. A stamina cai ×0,85 como antes (stamina no fim do jogo 85,3 → 87,6).\n- Só nasce em jogadores de 30 anos ou mais.\n- **Ganho aos 30 anos**: 12% de chance para quem faz exatamente 30, jogou 15 jogos ou mais, não teve nenhuma lesão no ano, não tem outra trait e está em time com menos de 4 traits. Em 12 anos de simulação, **65 ganhos no total (3 a 8 por ano, em 80 clubes)**. Highlanders no mundo todo ficam entre 33 e 41, de cerca de 270 jogadores com trait (12% a 15%). Nada de excesso.\n\n## 3. Caixa negativo\n\n**Experimento forçado**: 80 clubes-temporada (10 jogos novos × 8 clubes de séries C e D), com o caixa preso em −R$ 30 mi o ano inteiro, com a penalidade e sem a penalidade (mesma semente):\n\n| | Com penalidade | Sem penalidade |\n|---|---|---|\n| Pontos por temporada | **42,9** | 51,4 |\n| Posição final média | 13,7º | 10,9º |\n| Moral média no fim | **37** | 67 |\n| Tamanho do elenco no fim | **18** | 23,8 |\n| Média dos 14 melhores | 50,1 | 52,9 |\n\nUm clube preso no negativo o ano todo perde **8,5 pontos por temporada** e cai quase 3 posições. A moral dos clubes do computador se estabiliza em torno de 37 (a recuperação automática de 12% rumo a 55 compensa parte dos −3 por jogo). Os leilões forçados vendem em média 6 jogadores no ano e o elenco desce até o mínimo de 18, onde para.\n\n**Frequência natural** (simulação de 12 anos sem técnico humano, tabela da seção 5): o negativo é raro: de 0 a 4 clubes por ano (a partir do 5º ano, quando os custos crescem), de 0 a 76 jogos no negativo por ano e de 0 a 15 leilões forçados, quase todos vendidos (com R$ 0 de preço inicial, quase sempre aparece comprador).\n\n**Humano** (teste no navegador): 1ª rodada negativa abre a carta da diretoria com a imagem; 4ª abre a carta dos jogadores furiosos; 5ª leiloa um dos 5 de menor moral e mostra o resultado numa carta; caixa positivo zera a contagem; moral média do elenco caiu de 70 para 67 na primeira rodada.\n\n## 4. Preço de mercado (idade e desempenho)\n\n**Idade**: o mesmo meia central de média 66, sem dados de temporada:\n\n| Idade | 17 | 21 | 25 | 29 | 33 | 37 | 39 |\n|---|---|---|---|---|---|---|---|\n| Preço antes (degraus) | 918 mil | 816 mil | 680 mil | 544 mil | 340 mil | 204 mil | 204 mil |\n| **Preço agora (curva suave)** | 963 mil | 884 mil | 721 mil | 544 mil | 306 mil | 163 mil | **116 mil** |\n\n**Desempenho** (jogo de teste, jogadores de 24 a 28 anos; fator = 1 + 0,12 × z):\n\n| Posição | Caso | Números na temporada | z | Preço antes → agora |\n|---|---|---|---|---|\n| Goleiro | melhor | 158 defesas, nota 7,61 (média 69) | +2,07 | 703 mil → **965 mil** |\n| Goleiro | pior | 50 defesas, nota 6,66 (média 56) | −2,07 | 154 mil → 138 mil |\n| Zagueiro | melhor | 137 desarmes, 2 gols (média 75) | +2,28 | 2,78 mi → **3,54 mi** |\n| Zagueiro | pior | 9 jogos, nota 5,81 (média 76) | −1,78 | 2,77 mi → 2,44 mi |\n| Lateral | melhor | 113 desarmes, 2 gols (média 63) | +2,31 | 477 mil → **682 mil** |\n| Volante | melhor | 17 gols, 139 desarmes (média 67) | +3,16 | 774 mil → **1,13 mi** |\n| Meia central | pior | 12 jogos, 0 gols, 0 assist. (média 68) | −1,75 | 724 mil → 637 mil |\n| Meia (MEI) | pior | 13 jogos, 0 gols (média 63) | −1,50 | 350 mil → 316 mil |\n| Ponta direita | melhor | 9 gols, 7 assist. (média 54) | +1,56 | 108 mil → 121 mil |\n| Centroavante | melhor | 19 gols, 9 assist. (média 72) | +2,86 | 1,25 mi → **1,63 mi** |\n| Centroavante | pior | 14 jogos, 0 gols (média 34) | −1,37 | 6 mil → 5 mil |\n\nO fator vai de 0,80 a 1,40, então o preço sobe no máximo 40% por um ano excelente e cai no máximo 20% por um ano ruim. A comparação é dentro da mesma posição e série, para um artilheiro da D não ser tratado como um da A.\n\n## 5. Compras do computador, base e aposentadoria (12 anos, 80 clubes, sem técnico humano)\n\n| Ano | Clubes no negativo | Jogos no negativo | Leilões forçados (vendidos) | Compras do computador | Gasto (R$ mi) | Aposentados | Base ao mercado | Idade média | 36+ anos | Média dos 14 melhores A / B / C / D |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1998 | 0 | 0 | 0 (0) | 98 | 174.1 | 15 | 24 | 25.9 | 16 | 75.5 / 63.8 / 56.6 / 50.0 |\n| 1999 | 0 | 0 | 0 (0) | 111 | 169.1 | 15 | 24 | 26.7 | 18 | 74.2 / 65.1 / 57.3 / 51.0 |\n| 2000 | 0 | 0 | 0 (0) | 129 | 346.1 | 20 | 24 | 27.4 | 21 | 75.4 / 64.2 / 58.0 / 51.1 |\n| 2001 | 0 | 0 | 0 (0) | 108 | 253.2 | 25 | 24 | 28.2 | 43 | 73.9 / 65.8 / 57.8 / 51.7 |\n| 2002 | 1 | 7 | 1 (1) | 108 | 276.9 | 51 | 41 | 28.9 | 83 | 74.9 / 64.6 / 58.2 / 51.4 |\n| 2003 | 2 | 16 | 3 (3) | 98 | 184.1 | 78 | 62 | 29.3 | 123 | 74.0 / 65.4 / 57.8 / 51.5 |\n| 2004 | 4 | 73 | 14 (14) | 105 | 365.1 | 107 | 86 | 29.5 | 158 | 74.4 / 64.6 / 57.9 / 50.5 |\n| 2005 | 3 | 76 | 15 (14) | 99 | 278.0 | 117 | 94 | 29.3 | 179 | 73.6 / 64.6 / 57.8 / 50.4 |\n| 2006 | 3 | 49 | 10 (8) | 106 | 283.0 | 150 | 120 | 29.0 | 206 | 73.4 / 64.3 / 57.2 / 50.1 |\n| 2007 | 3 | 9 | 2 (2) | 110 | 430.9 | 145 | 116 | 28.5 | 236 | 72.8 / 64.3 / 57.9 / 49.4 |\n| 2008 | 3 | 12 | 2 (2) | 115 | 314.1 | 171 | 137 | 27.9 | 248 | 72.3 / 64.7 / 57.9 / 49.6 |\n| 2009 | 3 | 25 | 5 (5) | 99 | 243.0 | 165 | 132 | 27.1 | 251 | 72.3 / 64.5 / 58.4 / 49.7 |\n\nCompras do computador: **98 a 129 por temporada** (a simulação do relatório 5 previa 112), quase todas dentro da mesma série; poucas descem a série (D→C, C→B, B→A, ou seja, o jogador sobe de série ao ser comprado de um clube de nível abaixo). Gasto de R$ 170 a 430 mi por ano no total (R$ 2,5 mi por compra). Poucos livres (0 a 9 por ano): os clubes preferem comprar de outros clubes.\n\n**Comparação com o jogo sem as novidades (v23), no 12º ano:** média dos 14 melhores A / B / C / D de 72,4 / 63,8 / 58,6 / 49,2 e idade média de 26,4, contra 72,3 / 64,5 / 58,4 / 49,7 e 27,1 na v24. **A força das séries não se deteriorou**; a idade média é 0,7 ano maior porque os veteranos só saem aos 40 (e, antes, pela chance reduzida), e os jovens da base são fracos nos primeiros anos.\n\n**Aposentadoria**: aos 40 é automático; antes disso (a partir dos 36) a chance é de 20% por ano de idade acima de 35 (computador) ou de 36 (humano). Chegam a 165 a 170 por ano no ritmo estável. Os garotos da base que vão ao mercado são 80% disso (mínimo de 24): 132 no 12º ano.\n\n## 6. Categorias de base\n\nGarotos que chegam ao mercado (24 no primeiro ano de simulação): média 25 (de 20 a 30), idades 15 a 19, salário R$ 400, 8 de 24 com Promessa (30%), potencial médio 59 (90% abaixo de 70).\n\nEvolução dos garotos em clubes (média de todos os que vivem em clubes, no fim da temporada):\n\n| Idade | 15 | 16 | 17 | 18 | 19 | 20 | 21 | 22 | 23 |\n|---|---|---|---|---|---|---|---|---|---|\n| Média | 32 | 35 | 38 | 42 | 45 | 53 | 58 | 59 | 61 |\n| Potencial médio | 60 | 58 | 59 | 60 | 60 | 60 | 60 | 60 | 61 |\n\nChegam perto do potencial por volta dos 22 anos. Para comparação, a mediana da Série D é 42 e os 10% piores têm média 28 ou menos: um garoto da base vira titular de time da D por volta dos 18 anos. Para virar titular da Série A (média 70+), é preciso um potencial de 75 ou mais, que é raro (menos de 5% no mercado, bem mais comum nos garotos criados por clubes grandes).\n\n## 7. Testes automáticos\n\nRegressão de interface (t13 a t33): todos passam. Os testes t14, t27 e t29 falharam na primeira rodada por tempo (CPU ocupada com as simulações) e porque os pop-ups da diretoria agora abrem 60 ms depois; ajustei a espera nos testes e passam. Novo teste t33: cartas do caixa negativo (imagem, 1ª, 4ª e 5ª rodada, zerar), leilão forçado, popup da Promessa (3 posições, botão só habilita com 3), promessa de goleiro, tags BASE e APOS, filtro \"Categorias de base\" no mercado e os dois sons de raiva sem erro.\n\n## 8. Pontos para discutir\n\n1. **Stamina**: 1,25 ficou bom para você ou prefere linear?\n2. **Aposentadoria antes dos 40**: mantive a chance de aposentar mais cedo (a partir dos 36). Se preferir só aos 40, o mundo envelhece demais (testei: no 12º ano há 660 jogadores de 36+ anos contra ≈ 250, e a média dos 14 melhores da Série A cai de 75,5 para 70,7).\n3. **Compras do computador** estão em 4% por clube e rodada (≈ 105 por ano). Dá para variar.\n4. **Moral do computador no negativo** fica em ~37 e o time perde 8,5 pontos por temporada; é bastante, mas só acontece em clubes realmente quebrados.\n"}, {"id": "relatorios/12-formacoes-e-estilos.md", "titulo": "Relatório 12: formações e estilos de jogo (Melhorias #24, versão 25)", "md": "# Kfoot 98 — Relatório 12: formações e estilos de jogo (Melhorias #24, versão 25)\n\nMedições feitas por simulação de partidas completas com elencos gerados pelo próprio jogo (prestígio 60). Cada célula é uma média de centenas de jogos; o erro típico de uma célula é ±0,03 ponto por jogo e o de uma linha ou coluna ±0,015. Pontos por jogo: 3 vitória, 1 empate. Contra um adversário médio, o resultado esperado é 1,35.\n\n## 1. O que entrou no jogo\n- **12 formações** no lugar das 6 antigas: 4-4-2, 4-4-2 Losango, 3-5-2, 4-3-3, 4-2-3-1, 4-1-4-1, 3-4-2-1, 4-3-2-1, 3-3-1-3, 4-2-4, 5-4-1 e 5-3-2. Jogos salvos com 4-5-1 ou 3-4-3 viram 4-1-4-1 e 3-3-1-3.\n- **10 estilos de jogo** no lugar dos 4 antigos: Posição (tiki-taka), Gegenpressing, Reativo (contra-ataque), Jogo Direto, Relacionismo, Retranca, Linha Alta, Corredores, Vertical e Saída Curta. Jogos salvos: ofensivo vira Vertical, equilibrado vira Posição, defensivo vira Retranca e contra vira Reativo.\n- **Estilo secundário** (opcional): a aba \"Estilos x Estilos\" da planilha virou a relação entre o principal e o secundário. O secundário entra com força de 25% a 70% conforme a relação (Sinergia forte 70%, Boa sinergia 60%, Compatível com tensão 45%, Situacional 35%, Conflito 25% a 30%) e os conflitos custam até 2% de ataque e de controle.\n- **Compatibilidade 1 a 5** (aba Matriz da planilha) aparece em cada botão de estilo para a formação escolhida. Ela escala o que o estilo dá e o que ele custa.\n- **Duelo de estilos**: o estilo de cada time rende mais ou menos conforme o estilo e a estrutura do adversário (pressão contra saída curta, linha alta contra bola nas costas, bloco baixo contra posse e cruzamentos etc.). Os humanos e o computador respondem no intervalo com a tabela de melhores respostas da seção 4.\n- **Campo desenhado**: cada estilo tem setas, zonas e linhas em cima do campo, e os jogadores sobem ou descem conforme o estilo. Imagens da internet não foram usadas (o desenho é feito no próprio jogo, sem direitos autorais).\n- **Dificuldade removida** da tela inicial; o jogo fica sempre no normal.\n\n## 2. Como a planilha virou regra\n- **Bônus e penalidade por combinação.** A faixa de % da aba \"Correlação detalhada\" (ex.: +7 a +10%) define o tamanho do bônus do estilo na formação; a faixa de penalidade define o custo. A nota de compatibilidade multiplica: o bônus vale ×0,4 (nota 1), ×0,7, ×0,9, ×1,0 e ×1,12 (nota 5); o custo vale ×1,35 (nota 1) até ×0,8 (nota 5).\n- **Teto de +15%** nas forças de ataque, defesa e controle (regra da planilha) e piso de −18%.\n- **Penalidade só quando o risco acontece**: bola nas costas só pesa contra atacante veloz; saída curta só custa contra quem pressiona; cruzamento só perde força contra bloco fechado; impedimento só aparece com linha alta; fadiga de gegenpressing só aparece no cansaço.\n- **Fôlego**: estilos de intensidade (Gegenpressing, Linha Alta, Vertical) rendem menos e custam mais com a stamina média do time abaixo de 70.\n- **Efeitos novos no motor**: chance de finalizar, qualidade da finalização, cruzamentos, jogo aéreo, impedimentos, gasto de energia, faltas e cartões, e contra-ataque.\n- **Encaixe do elenco**: cada estilo tem uma lista de posições e atributos que o fazem funcionar (ex.: Posição pede PAS e DRI nos meias e PAS nos defensores; Gegenpressing pede FIS, DEF e RIT; Linha Alta pede RIT e DEF nos zagueiros). Isso entra na sinergia (teto ±8%) e escala o bônus em até ±60%.\n\n## 3. Equilíbrio medido\nPontos por jogo de cada combinação contra combinações sorteadas (entre parênteses, a compatibilidade da planilha).\n\n| Formação | Posição | Gegenpressing | Reativo | Jogo Direto | Relacionismo | Retranca | Linha Alta | Corredores | Vertical | Saída Curta | média |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 4-4-2 | 1,33 (4) | 1,31 (4) | 1,47 (5) | 1,38 (5) | 1,31 (4) | 1,20 (3) | 1,34 (4) | 1,50 (4) | 1,43 (4) | 1,29 (3) | **1,36** |\n| 4-4-2L | 1,37 (5) | 1,38 (4) | 1,31 (4) | 1,30 (3) | 1,41 (5) | 1,30 (2) | 1,28 (2) | 1,30 (2) | 1,35 (4) | 1,38 (4) | **1,34** |\n| 3-5-2 | 1,32 (4) | 1,35 (4) | 1,43 (5) | 1,33 (5) | 1,43 (4) | 1,37 (5) | 1,34 (4) | 1,37 (4) | 1,42 (4) | 1,34 (4) | **1,37** |\n| 4-3-3 | 1,46 (5) | 1,30 (5) | 1,30 (4) | 1,38 (4) | 1,45 (4) | 1,18 (2) | 1,39 (5) | 1,40 (5) | 1,27 (5) | 1,33 (5) | **1,35** |\n| 4-2-3-1 | 1,45 (5) | 1,33 (5) | 1,36 (5) | 1,35 (4) | 1,35 (4) | 1,34 (4) | 1,42 (4) | 1,34 (4) | 1,32 (5) | 1,26 (5) | **1,35** |\n| 4-1-4-1 | 1,35 (5) | 1,40 (5) | 1,37 (4) | 1,33 (3) | 1,34 (4) | 1,28 (4) | 1,46 (5) | 1,40 (3) | 1,35 (4) | 1,42 (5) | **1,37** |\n| 3-4-2-1 | 1,39 (5) | 1,34 (5) | 1,41 (5) | 1,36 (4) | 1,38 (5) | 1,31 (4) | 1,37 (4) | 1,28 (4) | 1,36 (5) | 1,42 (5) | **1,36** |\n| 4-3-2-1 | 1,44 (5) | 1,32 (4) | 1,35 (4) | 1,33 (3) | 1,43 (5) | 1,35 (4) | 1,34 (4) | 1,37 (2) | 1,39 (4) | 1,41 (4) | **1,37** |\n| 3-3-1-3 | 1,39 (4) | 1,35 (5) | 1,22 (2) | 1,28 (4) | 1,40 (5) | 1,06 (1) | 1,38 (5) | 1,34 (4) | 1,41 (5) | 1,33 (3) | **1,32** |\n| 4-2-4 | 1,25 (2) | 1,31 (4) | 1,36 (4) | 1,42 (5) | 1,24 (3) | 1,17 (1) | 1,28 (2) | 1,42 (5) | 1,36 (5) | 1,35 (2) | **1,32** |\n| 5-4-1 | 1,39 (2) | 1,22 (2) | 1,37 (5) | 1,34 (4) | 1,28 (2) | 1,37 (5) | 1,31 (2) | 1,37 (3) | 1,31 (3) | 1,29 (2) | **1,33** |\n| 5-3-2 | 1,25 (3) | 1,38 (4) | 1,37 (5) | 1,35 (5) | 1,24 (3) | 1,38 (5) | 1,21 (3) | 1,39 (4) | 1,35 (4) | 1,34 (3) | **1,33** |\n| **média** | 1,37 | 1,33 | 1,36 | 1,35 | 1,35 | 1,28 | 1,34 | 1,37 | 1,36 | 1,35 | |\n\n- **Formações**: as médias ficam entre 1,32 e 1,37; nenhuma é \"a melhor\". O melhor estilo de cada formação rende entre 1,39 e 1,50.\n- **Estilos**: médias entre 1,33 e 1,37, com a Retranca em 1,28 (ela só vai bem nas formações de nota 5: 3-5-2, 5-4-1, 5-3-2). É o custo previsto pela planilha: quem joga retranca sem encaixe perde mais do que ganha.\n- **Compatibilidade funciona**: nota 5 → 1,38 ponto por jogo; nota 4 → 1,36; nota 3 → 1,30; nota 2 → 1,29; nota 1 → 1,12. Combinações de nota 1 (3-3-1-3 e 4-2-4 com Retranca) perdem de verdade.\n- As formações e os estilos foram calibrados em 5 rodadas de simulação com ajuste automático dos modificadores de ataque e defesa.\n\n## 4. Estilo contra estilo (quem responde a quem)\nPontos por jogo do estilo da linha contra o da coluna, com elencos iguais e cada lado na formação de nota 4 ou 5 (média dos dois lados do campo).\n\n| Estilo (linha) contra → | Posição | Gegenpressing | Reativo | Jogo Direto | Relacionismo | Retranca | Linha Alta | Corredores | Vertical | Saída Curta |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Posição | — | 1,26 | 1,39 | 1,34 | 1,33 | 1,34 | 1,35 | 1,44 | 1,36 | 1,38 |\n| Gegenpressing | 1,47 | — | 1,18 | 1,29 | 1,37 | 1,40 | 1,39 | 1,29 | 1,22 | 1,45 |\n| Reativo | 1,32 | 1,56 | — | 1,39 | 1,39 | 1,22 | 1,47 | 1,33 | 1,49 | 1,19 |\n| Jogo Direto | 1,38 | 1,46 | 1,35 | — | 1,41 | 1,32 | 1,45 | 1,38 | 1,39 | 1,30 |\n| Relacionismo | 1,39 | 1,34 | 1,35 | 1,34 | — | 1,40 | 1,38 | 1,34 | 1,36 | 1,40 |\n| Retranca | 1,35 | 1,28 | 1,46 | 1,36 | 1,28 | — | 1,29 | 1,39 | 1,34 | 1,33 |\n| Linha Alta | 1,39 | 1,34 | 1,26 | 1,30 | 1,34 | 1,41 | — | 1,43 | 1,31 | 1,49 |\n| Corredores | 1,27 | 1,45 | 1,38 | 1,38 | 1,41 | 1,31 | 1,29 | — | 1,39 | 1,27 |\n| Vertical | 1,37 | 1,52 | 1,25 | 1,34 | 1,39 | 1,36 | 1,43 | 1,37 | — | 1,41 |\n| Saída Curta | 1,32 | 1,25 | 1,52 | 1,42 | 1,30 | 1,34 | 1,22 | 1,47 | 1,32 | — |\n\nMelhores respostas (usadas pelo intervalo do jogo e pelo computador):\n\n| Adversário joga | Melhores respostas |\n|---|---|\n| Posição | Gegenpressing, Linha Alta |\n| Gegenpressing | Reativo, Vertical, Jogo Direto |\n| Reativo | Saída Curta, Retranca |\n| Jogo Direto | Saída Curta, Reativo |\n| Relacionismo | Jogo Direto, Corredores |\n| Retranca | Linha Alta, Relacionismo |\n| Linha Alta | Reativo, Jogo Direto, Vertical |\n| Corredores | Saída Curta, Posição, Linha Alta |\n| Vertical | Reativo, Jogo Direto |\n| Saída Curta | Linha Alta, Gegenpressing |\n\nO desenho que aparece é o da planilha: pressão alta vence saída curta e posse, bola longa e vertical passam por cima da pressão, reativo vence quem se expõe, bloco baixo neutraliza posse e cruzamento. A amplitude é de ±0,15 ponto por jogo nos confrontos mais fortes, então a escolha pesa mas não decide sozinha. No intervalo, trocar para uma boa resposta rende +3%, trocar para algo que o adversário anula custa −2% (mesma regra de antes) e o estilo secundário vale metade.\n\n## 5. Efeitos específicos medidos (formação de nota 4 ou 5, contra adversários variados)\n```\nestilo       ppg   gols  sofr  chutes posse  esc  stamFim  amar  imped.provocados(adv)\nposicao      1.24   1.27  1.27    10.0    53   2.9     80.8   1.00     0.00\ngegen        1.23   1.13  1.36    11.0    51   3.1     73.2   1.30     0.00\nreativo      1.32   1.27  1.17    10.6    48   2.8     80.9   1.25     0.00\ndireto       1.56   1.52  1.26    12.0    48   3.1     80.9   1.23     0.00\nrelac        1.31   1.38  1.48    10.6    52   3.0     80.9   1.15     0.00\nretranca     1.40   0.92  0.94     8.1    47   2.5     81.0   1.22     0.00\nlinhaalta    1.34   1.27  1.24    10.7    51   3.0     78.0   1.26     1.13\ncorredores   1.52   1.36  1.21    11.2    50   3.3     80.9   1.02     0.00\nvertical     1.36   1.37  1.36    12.0    49   3.4     80.7   1.17     0.00\nsaida        1.32   1.20  1.11    10.2    52   3.0     80.8   1.17     0.00\n```\n- **Gegenpressing** gasta ≈1,4× mais energia (stamina média final 73 contra 81 dos outros) e rende menos no segundo tempo. A planilha sugeria testar 1,5× a 2×; ficou em 1,5× no custo nominal.\n- **Linha Alta** provoca ≈1,1 impedimento por jogo no adversário e gasta ≈15% mais energia.\n- **Retranca** reduz os gols dos dois lados (0,92 a favor e 0,94 contra por jogo, contra ≈1,25 dos demais).\n- **Jogo Direto** e **Vertical** dão mais finalizações (12 por jogo contra 10 a 10,7 dos outros); **Corredores** e **Vertical** dão mais escanteios (3,3 e 3,4 contra 2,9 a 3,1).\n- O número de gols por jogo continua em 2,5 (1,24 para cada lado).\n\n## 6. Sugestões\n**Aplicar melhor bônus e penalidades**\n1. **Familiaridade 0 a 100** (já prevista na planilha, ainda não implementada): cada combinação de formação e estilo começa em 50 e sobe com jogos e treinos táticos; baixa familiaridade aumenta o custo do estilo e reduz o bônus (até −40%). Trocar muito de estilo derruba a familiaridade e o técnico Estrategista troca com menos custo.\n2. **Treino tático** como opção no treino: o time inteiro treina uma combinação por alguns jogos e ganha familiaridade em vez de atributos.\n3. **Instruções por jogador** (liberdade para avançar, marcação, cruzar ou driblar) usando os mesmos atributos que já medem o encaixe.\n4. **Penalidade de transição**: trocar de formação no intervalo custar alguns minutos de organização, como na planilha (\"não penalizar permanentemente\").\n5. **Mostrar depois do jogo** o que o estilo rendeu (impedimentos provocados, perdas na saída, escanteios), para o técnico entender o que funcionou.\n\n**Jogador certo no lugar certo**\n1. Hoje o encaixe do elenco usa posição e atributos (PAS, DRI, FIS, RIT, DEF, CHU). Uma próxima etapa é **papel por posição** (ex.: \"volante construtor\" x \"volante destruidor\", \"ala ofensivo\" x \"ala fechado\"), escolhido na tela e com atributo principal diferente.\n2. **Traits ligadas a estilos**: Maestro e Driblador ajudam Posição e Relacionismo; Cabeção e Matador ajudam Jogo Direto e Corredores; Desarmador e Highlander ajudam Gegenpressing e Retranca.\n3. **Altura e cabeceio** entrarem no encaixe de Jogo Direto e Corredores (hoje entram só pelo cabeceio dos finalizadores).\n\n**Adaptação entre humanos e computador**\n1. O computador já lê o último estilo do adversário (na escalação e no intervalo) com a mesma probabilidade de acerto do estilo do técnico. Uma melhoria é registrar para o humano **o que o adversário jogou nos últimos 3 jogos** na tela do próximo jogo.\n2. **Técnico com estilo** (próxima rodada): ligar cada estilo de técnico a famílias de estilos de jogo (Ofensivista: Vertical, Corredores, Gegenpressing, Direto; Retranqueiro: Retranca, Reativo, Linha Alta; Professor: Posição, Relacionismo, Saída Curta), o que já está feito de forma provisória na escolha do computador.\n3. Nova trait de técnico possível: \"Adaptável\" (acerta mais o intervalo) e \"Teimoso\" (nunca muda de estilo).\n\n## 7. Decisões que tomei sozinho\n- O estilo secundário é opcional; sem ele o jogo funciona como um estilo só.\n- Os estilos antigos viraram os mais parecidos nos jogos salvos (seção 1).\n- A tabela de melhores respostas vem da simulação, não da planilha.\n- Estilos de técnicos e traits de técnicos ficaram para a próxima rodada, como combinado.\n"}];

        out.push((ord ? '<ol>' : '<ul>') + it.join('') + (ord ? '</ol>' : '</ul>')); continue;
      }
      if (/^>/.test(l)) { const b = []; while (i < L.length && /^>/.test(L[i])) b.push(L[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inl(b.join(' ')) + '</blockquote>'); continue; }
      if (!l.trim()) { i++; continue; }
      const p = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s|---+\s*$|\||```|>|\s*([-*]|\d+\.)\s+)/.test(L[i])) p.push(L[i++]); out.push('<p>' + inl(p.join(' ')) + '</p>');
    }
    return out.join('\n');

  // popup da promessa: o técnico escolhe 3 posições da área de atuação do jogador
  K.promessaModal = function (g, a, depois) {
    const MK = BF.Mercado, c = g.porId.get(a.clube), p = c && c.elenco.find((x) => x.id === a.pid);
    if (!p || p.trait !== 'promessa') { depois(); return; }
    const area = MK.areaDe(p), sel = new Set([p.pos]), nomeArea = { D: 'defesa', M: 'meio-campo', A: 'ataque' }[PL.GRUPO[p.pos]];
    let ok = false;
    const botoes = h('div', { class: 'promopc' });
    const confirmar = h('button', { class: 'btn hot', id: 'prom-ok', disabled: sel.size !== 3, onclick: () => { ok = true; const r = MK.resolverPromessa(g, c, p, [...sel]); MK.noticia(g, p.nome + ' agora joga de ' + [p.pos].concat(p.alt || []).join(', ') + (r.novo ? ' e ganhou a característica ' + PL.TRAITS[r.novo].nome : '') + '.', 'treino'); m.fechar(); } }, 'Confirmar');
    const pinta = () => { botoes.replaceChildren(...area.map((pos) => h('button', { type: 'button', class: 'btn alt' + (sel.has(pos) ? ' on' : ''), 'aria-pressed': sel.has(pos) ? 'true' : 'false', onclick: () => { if (sel.has(pos)) sel.delete(pos); else if (sel.size < 3) sel.add(pos); pinta(); } }, pos + ' · ' + Math.round(PL.overallEm(p, pos))))); confirmar.disabled = sel.size !== 3; };
    const m = K.modal('Promessa desenvolvida', h('div', null,
      h('p', null, h('b', null, p.nome), ' se desenvolveu bem no clube! Concluiu o 3º treino e deixou de ser uma promessa.'),
      h('p', null, 'Escolha 3 posições de ', h('b', null, nomeArea), ' em que ele vai atuar (o número é a média dele em cada posição):'), botoes,
      h('p', { class: 'muted' }, 'Ele tem 40% de chance de ganhar uma nova característica.'),
      h('div', { class: 'actions' }, confirmar)), { aoFechar: () => { if (!ok && p.trait === 'promessa') MK.resolverPromessa(g, c, p, MK.melhoresDaArea(p)); depois(); } });
    pinta();
  };

  // avisos da diretoria e demissão
  K.avisosDiretoria = function () {
    const g = G.g, av = g.avisos.splice(0, g.avisos.length); if (!av.length) return;
    const dem = av.find((a) => a.tipo === 'demissao');
    if (dem) {
      const de = g.porId.get(dem.de), para = g.porId.get(dem.para);
      K.modal('Você foi demitido', h('div', { class: 'demissao' },
        h('p', null, 'A diretoria do ', h('b', null, de.nome), ' encerrou o seu contrato (' + dem.motivo + ').'),
        h('p', null, 'Você assume o ', h('b', null, para.nome), ' (' + K.DIV_NOME[para.div] + '), com a moral do técnico em 45. Boa sorte!'),
        h('div', { class: 'actions' }, h('button', { class: 'btn hot', id: 'dem-ok', onclick: () => { document.querySelector('.overlay').remove(); G.aba = 'plantel'; K.render(); } }, 'Começar no novo clube'))), {});
      return;
    }
    const fila = [], gerais = av.filter((a) => !a.tipo || (a.tipo !== 'caixa' && a.tipo !== 'promessa'));
    if (gerais.length) fila.push((depois) => { const m = K.modal('Diretoria', h('div', null, gerais.map((a) => h('p', null, a.texto)), h('div', { class: 'actions' }, h('button', { class: 'btn', id: 'dir-ok', onclick: () => m.fechar() }, 'Entendi'))), { aoFechar: depois }); });
    av.filter((a) => a.tipo === 'caixa').forEach((a) => fila.push((depois) => {
      const m = K.modal(a.titulo, h('div', { class: 'carta' }, h('img', { class: 'carta-img', src: K.IMG[a.img], alt: a.img === 'diretoria' ? 'Diretoria' : 'Jogadores revoltados' }), h('p', null, a.texto),
        h('div', { class: 'actions' }, h('button', { class: 'btn', id: 'carta-ok', onclick: () => m.fechar() }, 'Entendi'))), { aoFechar: depois });
    }));
    av.filter((a) => a.tipo === 'promessa').forEach((a) => fila.push((depois) => {
      if (a.gk) { const m = K.modal('Promessa desenvolvida', h('div', null, h('p', null, a.texto), h('div', { class: 'actions' }, h('button', { class: 'btn', id: 'prom-gk-ok', onclick: () => m.fechar() }, 'Entendi'))), { aoFechar: depois }); }
      else K.promessaModal(g, a, depois);
    }));
    const seguir = () => { const f = fila.shift(); if (f) setTimeout(() => f(seguir), 60); else if (K.render && !document.querySelector('.overlay')) K.renderKeep ? K.renderKeep() : null; };
    seguir();
  };
