os clubes* | *1,104* | *0,93* | *1,28* | *14,8* |\n\n(Erro padrão ≈ ±0,02 ppg por personalidade.)\n\n**Leitura:**\n- As escolhas **fazem diferença estatística**, mas pequena: o melhor técnico de teste ganha ~0,075 ppg a mais que a IA (~2,8 pontos por temporada, ~1 posição). O ofensivo e o equilibrado ficam no nível da IA (ou abaixo).\n- As diferenças mais visíveis são **no estilo**, não no resultado: o Kamikaze marca 1,01 gol/jogo e sofre 1,36; a Retranca marca 0,90 e sofre 1,15. Isso o jogador sente nos jogos, mas a classificação praticamente não registra.\n- A personalidade que mais ganha (Camaleão) é a que **lê o adversário**. Isso é bom: premia quem estuda o jogo. Mas o jogador só percebe se a interface mostrar o que o adversário vai fazer.\n- Mudança de tática no intervalo (Reativo) não ajudou (1,108 vs 1,085 do equilibrado puro; dentro do ruído).\n- A lotação média foi idêntica entre personalidades (8,5% a 8,7%), porque a diferença de resultados é pequena demais para a \"forma\" mexer no público.\n\n## 6. Estrutura do campeonato e do mundo (bônus: achados fora do pedido)\n\n- **Prestígio é fixo.** Em 72 temporadas, todos os campeões da Série A saíram de 8 clubes: Corinthians 21 (29%), Flamengo 14, São Paulo 13, Palmeiras 9, Grêmio 6, Vasco 4, Cruzeiro 3, Internacional 2. A correlação prestígio × pontos é 0,75–0,80 na Série A. A Copa do Brasil foi vencida por um time da Série A em 70 de 72 edições.\n- **O mundo envelhece sem reposição.** Só clubes humanos recebem juniores e só humanos perdem contrato (o computador renova sozinho). Simulei 25 anos sem humanos: idade média 25,8 → 47,8; overall dos 14 melhores de Série A 70,9 → 49,7 (D: 48,4 → 27,6). Os primeiros 5 anos são estáveis; depois cai ~1,5 ponto por ano. Não aparece em partidas curtas de teste, mas em campanhas de 10+ anos o jogo degrada.\n- **Disciplina:** 3,0 amarelos e 0,19 vermelhos por jogo, 0,27 lesões por jogo (~0,45 lesionados por clube em qualquer momento). Valores plausíveis.\n- **Gols por divisão:** A 3,1 · B 2,8 · C 2,7 · D 2,4. A Série A tem mais gols que as demais (efeito da média de qualidade mais alta); não é problema.\n\n## 7. Propostas priorizadas\n\n| # | Mudança | Impacto | Esforço | Recomendação |\n|---|---|---|---|---|\n| 1 | Corrigir o piso de 3% do público (exploração de preço) | Evita estratégia absurda em clubes humanos | Baixo | **Fazer** |\n| 2 | Reposição e aposentadoria de jogadores para o computador (juniores, retirada ~36–38) | Torna campanhas longas viáveis | Médio | **Fazer** |\n| 3 | Dar valor à stamina (recuperação mais lenta + IA troca em stamina \u003c 65) | Faz rodízio e substituição terem sentido | Baixo, mas exige ajuste fino | **Fazer, testando** |\n| 4 | Reequilibrar peso dos defensores e/ou preço de mercado por posição | Fecha a estratégia dominante de \"só atacante\" | Baixo/médio | **Fazer** |\n| 5 | Ajustar formações para que 4-3-3 e 3-4-3 não sejam inferiores (bônus de ataque ou penalidade menor no `ctl` das três melhores) | Mais variedade real de escolha | Baixo | **Fazer** |\n| 6 | Dar ações e consequências à moral (prêmio, conversa, demissão do técnico) | Tira a moral de \"painel\" e dá agência | Médio | **Discutir** |\n| 7 | Mostrar ao jogador o que o adversário vai fazer e o efeito de cada escolha (relatório tático pré e pós-jogo) | Faz a diferença de 0,1 ppg ser perceptível | Médio | **Discutir** |\n| 8 | Prestígio dinâmico (título, rebaixamento, Copa) | Mais variedade de campeões e demanda | Médio | **Discutir** |\n| 9 | Ferramentas de público para clube pequeno (campanha de sócios, jogo-evento) | Dá o que fazer com a bilheteria da Série D | Médio | **Discutir** |\n| 10 | Incluir saldo de gols/posição na forma que afeta o público | Realismo e recompensa de goleadas | Baixo | Opcional |\n| 11 | Alargar o efeito de táticas/formações (ex.: dobrar os modificadores) | Escolhas valem ~2 pontos de overall em vez de ~1 | Baixo | **Decisão de design** |\n\n## 8. Onde mais devemos testar\n\n1. **Mercado, contratos e treinamento**: compra/venda/leilão, renovação, salário vs valor, treino de atributos (`concluirTreino`), juniores. Não toquei nisso e há bastante dinheiro e progressão em jogo.\n2. **Campanhas longas com humano** (10+ anos): evolução de atributos, envelhecimento do próprio elenco, fluxo de caixa com compras, dificuldade de manter o clube.\n3. **Progressão de atributos** (`aplicarPosJogo`, `virarAno`): ritmo de crescimento de jovens, queda de veteranos, retorno decrescente.\n4. **Escalação manual** (fora de posição, `afinidade`): testei só a escalação automática; falta medir quanto custa colocar um jogador fora da posição e se compensa.\n5. **Copa do Brasil**: sorteio, mata-mata de 64 clubes, impacto de pênaltis (76% de acerto fixo), calendário apertado.\n6. **Jogo pela interface** (clique a clique): ergonomia das telas de tática, moral, finanças e se o jogador entende os efeitos. Meus testes foram no motor.\n7. **Multiplayer e determinismo**: confirmar que servidor e clientes chegam aos mesmos resultados com mesma semente, com os 10 técnicos humanos ao mesmo tempo.\n8. **Séries B e C** com humano: só testei Série D (é onde o humano começa), mas promoção/rebaixamento muda demanda e custos.\n\n## Apêndice — Scripts\n\nOs scripts que usei estão em `scripts/` (Node; carregam o `index.html` da branch e simulam o motor real): `exp1` baseline e finanças, `exp2` matrizes de tática/formação, `exp3` atributos, posições, stamina e moral, `exp4` lotação (fórmulas), `exp5` substituições, `exp6` grade 24×24, `exp7` dinâmica de moral, `exp8` técnicos humanos, `exp9` mundo em 25 anos, `exp10` preço de ingresso, `exp11` economia da Série D.\n"}, {"id": "relatorios/02-medicoes-melhorias-14-15.md", "titulo": "Medições das Melhorias #14 e #15", "md": "# Medições das Melhorias #14 e #15\n\nMedidas feitas com o motor real do jogo em Node, sem a tela, antes e depois de cada mudança. Os scripts ficam no laboratório de simulação do projeto.\n\n## Copa do Brasil: placares entre grandes e pequenos\n\nCada confronto são duas partidas (ida e volta) entre elencos gerados com o prestígio indicado, 400 confrontos por linha. \"Maior agregado\" é o maior número de gols de um dos lados somando as duas partidas.\n\n| Confronto (prestígio) | Antes: mediana / p90 / máximo | Depois: mediana / p90 / máximo | Favorito avança (depois) |\n|---|---|---|---|\n| 85 × 15 | 8 / 11 / 16 | 5 / 7 / 10 | 92% |\n| 85 × 30 | 6 / 10 / 14 | 4 / 7 / 9 | 85% |\n| 70 × 20 | 6 / 9 / 12 | 4 / 7 / 9 | 81% |\n| 60 × 40 | 4 / 6 / 9 | 3 / 5 / 8 | 58% |\n| 50 × 50 | 4 / 6 / 9 | 3 / 5 / 8 | 36% (casa) |\n\nO que mudou: nos jogos da Copa as forças de ataque, defesa e controle dos dois times se aproximam da média (fator 0,45), e o time que abre 2 ou mais gols poupa o jogo (menos ataques e chutes). A liga não foi alterada.\n\n## Lesões\n\n| Medida | Antes | Depois |\n|---|---|---|\n| Lesões por jogo (os dois times) | 0,28 | 0,14 |\n\nA chance agora depende da stamina do jogador: cansado se lesiona até cerca de 2,3 vezes mais que descansado.\n\n## Caixa inicial e o que ele compra\n\n| Série | Caixa mediano antes | Caixa mediano depois |\n|---|---|---|\n| A | R$ 13,8 mi | R$ 13,8 mi |\n| B | R$ 2,7 mi | R$ 3,6 mi |\n| C | R$ 600 mil | R$ 1,1 mi |\n| D | R$ 100 mil | R$ 540 mil |\n\nMelhor jogador comprável por um clube da Série D, medido pela média do jogador (os titulares da D têm média 54,7):\n\n| Caixa | Série C | Série B | Série A |\n|---|---|---|---|\n| R$ 100 mil | 58 | 58 | 60 |\n| R$ 540 mil | 60 | 67 | 72 |\n\n## Premiações e acesso/rebaixamento (20 temporadas, mundo só com computador)\n\n- Os prêmios somam cerca de R$ 21 mi por ano para os 80 clubes.\n- A média de overall por série (14 melhores) ficou estável nos primeiros anos: Série A 71 → 70, B 62 → 61, C 55, D 49 → 48.\n- Rodando 20 anos **sem** os bônus de atributo e **com** eles, os números foram praticamente iguais: jogadores com finalização 90 ou mais chegaram a 52 sem bônus e 59 com bônus no ano 20.\n\n### Problemas que já existiam no motor (com ou sem prêmios)\n\n1. Nos anos finais o overall médio dos times da Série A cai de 71 para cerca de 67 e depois se recupera.\n2. Jogadores com finalização 90+ vão aumentando ao longo dos anos.\n3. Alguns clubes do computador ficam com caixa negativo depois de uns 15 anos.\n4. O artilheiro de uma série chegava a 60–70 gols; reduzi a concentração das finalizações e hoje fica em 25–50.\n\n## Pênaltis e gols\n\n2,58 gols por jogo; cerca de 0,34 pênalti por jogo; conversão de 75% a 80%.\n"}, {"id": "relatorios/03-bateria-detalhada.md", "titulo": "Relatório 2: bateria detalhada de balanceamento", "md": "# Kfoot 98 — Relatório 2: bateria detalhada de balanceamento\n\nVersão testada: branch `claude/melhorias-5-xt6u1f`, jogo na versão 17 (commit `2defbbd`, já com os prêmios extras: melhor goleiro, revelação, garçom e melhor técnico). Nada foi alterado no código, nada foi enviado ao repositório e o artefato não foi republicado. Este relatório é só diagnóstico e proposta, para decidirmos juntos.\n\n## Como testei\n\nCarreguei o motor real do jogo em Node, sem a tela, e simulei em volume. Usei o mesmo código que roda no navegador, incluindo tática, formação, sinergia, leitura de intervalo, stamina dinâmica, moral, lesões, pênaltis, Copa nivelada, aposentadorias e premiações.\n\n| Bateria | Volume |\n|---|---|\n| Mundo inteiro (80 clubes, liga e Copa), 12 mundos de 10 temporadas | ~200 mil jogos de liga |\n| Goleiro e posições trocadas (atacante no gol etc.) | ~100 mil jogos |\n| ±10 de overall por posição e por atributo, atributos com mesmo overall | ~250 mil jogos |\n| Stamina inicial, moral, substituições, rodízio, intervalo | ~150 mil jogos |\n| Táticas (4×4), formações (6×6) e grade de 24 combinações | ~160 mil jogos |\n| 10 estilos de técnico humano, 240 temporadas de clube cada | ~400 mil jogos |\n| 5 níveis de habilidade em 10 clubes de todas as séries, 240 temporadas cada, mais campanhas de 3 anos | ~500 mil jogos |\n| Copa nivelada, moral ao longo da temporada, mundo de 25 anos | ~100 mil jogos |\n\nLeitura dos números: ppg é pontos por jogo (vitória 3, empate 1). Entre times idênticos o esperado é cerca de 1,35 a 1,40. O erro padrão típico é ±0,02 ppg nas baterias grandes, então diferenças menores que ~0,05 não se distinguem de sorte. GF e GC são gols feitos e sofridos por jogo.\n\nLimitações: testei o motor, não a interface. Os técnicos de teste não negociaram nada no mercado, não treinaram jogadores e escalaram automaticamente os 11 melhores. Isso significa que medi o efeito de formação, tática, intervalo e trocas, e não o efeito de montar elenco, que provavelmente é o principal caminho de evolução do jogador.\n\n---\n\n## Resumo em uma página\n\n1. **O motor já simula cada posição, e as trocas de posição punem de verdade.** Goleiro ruim sofre 23% mais gols. Um centroavante no gol sofre 61% mais gols (2,04 contra 1,27) e converte 48% dos chutes no alvo contra 34%. Quatro atacantes na defesa levam 2,28 gols por jogo e o time vale 0,58 ppg. O efeito existe e aponta na direção certa, mas é mais fraco do que seria no futebol: um jogador de linha no gol \"defende\" mais do que deveria.\n2. **O jogo é equilibrado no que importa, e tem caos suficiente.** 2,74 gols por jogo, mandante 40% / empate 24% / visitante 36%, 24% de jogos decididos por zero gols de diferença, 40% por um, 24% por dois. Um time 6 pontos de overall mais forte joga em casa e vence 59%, perde 19%.\n3. **A Série A é previsível demais.** A correlação entre força inicial e posição final é 0,87. O campeão foi o time mais forte em 38% das temporadas e esteve entre os 3 mais fortes em 74%. Em 120 temporadas só 8 clubes foram campeões e o Corinthians ganhou 35%.\n4. **Atributos, stamina e moral afetam o jogo, e isso é forte.** Moral de 0 para 100 vale 0,56 ppg. Stamina inicial 80 em vez de 100 custa 0,31 ppg. Cada ponto de overall do time vale ~0,085 ppg. Mas os atributos não são iguais: chute (CHU) e defesa (DEF) pesam muito, enquanto ritmo (RIT), físico (FIS), passe (PAS) e drible (DRI) quase não mudam o resultado, mesmo com overall igual.\n5. **As escolhas do técnico humano quase não aparecem no resultado.** Entre os 10 estilos de teste, a diferença do melhor ao pior foi 0,09 ppg (3,5 pontos por temporada). Um técnico que sorteia formação e tática a cada jogo fica no topo do ranking. Entre 5 níveis de habilidade (do aleatório ao expert) a diferença foi de 0,05 a 0,07 ppg. O clube sorteado muda o ppg de 0,65 a 1,80. Ou seja, a dificuldade é decidida pelo sorteio do clube, não pelo que o jogador faz.\n6. **A leitura de intervalo foi anulada pelo computador.** Se o computador não reagisse, a resposta tática certa no intervalo valeria +0,13 ppg e a errada −0,10. Como o computador responde à mudança do humano em 60% das vezes (sempre depois dele), a resposta certa do humano vale zero.\n7. **A sinergia não é neutra.** Com elencos normais ela já dá +4% a +6% de defesa para quase toda combinação com defesa forte e +5% de controle para 4-2-3-1 e 3-5-2, no limite de 6%. O humano que \"monta o time certo\" não tem para onde crescer, e quem não monta nada ganha o mesmo bônus.\n8. **Pontos já corrigidos desde o relatório 1:** o mundo não envelhece mais (25 anos estáveis, idade média ~25 e overall da Série A perto de 67,5), a Copa nivelada funciona, o público dos clubes pequenos subiu (Série D 25%), e a recuperação de stamina agora cria desgaste real em sequências de jogos.\n\n---\n\n## 1. O jogo é rodado posição por posição?\n\nO minuto a minuto funciona assim: define-se quem tem a bola (controle dos meias, ataque e defesa), se há uma finalização (ataque contra a defesa do rival) e, na finalização, quem chuta (atacantes ficam com 64% dos chutes, meias 31%, defensores 5%), quem marca (zagueiro ou volante, pesado pela DEF) e o goleiro (DEF e overall no gol). Também há faltas, cartões, lesões, pênaltis e passes.\n\n### 1.1 Gols, chutes e passes por setor (200 mil jogos)\n\n| Indicador | Atacantes | Meias | Defensores |\n|---|---|---|---|\n| Gols | 65% | 29% | 6% |\n| Chutes | 64% | 31% | 5% |\n| Assistências | 13% | 57% | 30% |\n| Desarmes | 0% | 31% | 69% |\n\nGols e chutes estão realistas. **Assistências não:** defensores dão 30% e atacantes só 13%, porque o passador é sorteado entre todos pesado por PAS e os defensores têm muitos passes. Em um jogo real, atacantes e meias dão a maioria das assistências. Os atacantes nunca fazem desarme, o que também é uma simplificação.\n\n### 1.2 Quem está no gol\n\nTeste: mesmo elenco, 4-4-2 equilibrado contra time igual (6 mil jogos por linha). A linha base tem 1,27 gols sofridos por jogo e 34% de conversão dos chutes no alvo.\n\n| Quem joga no gol | GC por jogo | Conversão no alvo | ppg |\n|---|---|---|---|\n| Goleiro titular normal | 1,27 | 34% | 1,35 |\n| Goleiro ruim (todos os atributos −20) | 1,56 | 40% | 1,15 |\n| Goleiro ruim só em DEF (−25) | 1,55 | 40% | 1,17 |\n| Goleiro elite (+15) | 1,05 | 29% | 1,52 |\n| Melhor zagueiro no gol | 1,67 | 39% | 1,09 |\n| Melhor volante no gol | 1,66 | 39% | 1,09 |\n| Melhor meia (MEI) no gol | 1,96 | 47% | 0,94 |\n| Melhor centroavante no gol | 2,04 | 48% | 0,86 |\n| Jogador de linha com menor DEF no gol | 2,10 | 51% | 0,86 |\n\nConclusão: o que você pediu funciona. Um atacante no gol sofre bem mais gols, principalmente se a defesa dele é ruim: +61% contra o goleiro normal e +65% com o menor DEF. A DEF do goleiro sozinha já explica quase todo o efeito (−25 de DEF = 1,55 gols). O ponto fraco é de realismo: no futebol um atacante no gol tomaria bem mais, perto de 3 gols por jogo, e aqui o limite parece ser a faixa de probabilidades do chute (14% a 58% de gol). Também sofre-se mais chutes (10,4 para 11,6 por jogo), o que mostra que a defesa em volta reage à troca.\n\n### 1.3 Outras posições trocadas\n\n| Troca | GF | GC | ppg |\n|---|---|---|---|\n| Base | 1,26 | 1,27 | 1,35 |\n| Melhor goleiro de centroavante | 0,87 | 1,38 | 0,96 |\n| Melhor zagueiro de centroavante | 0,99 | 1,31 | 1,12 |\n| Dois melhores zagueiros nos dois ataques | 0,77 | 1,40 | 0,86 |\n| Melhor centroavante de zagueiro | 1,19 | 1,49 | 1,14 |\n| Dois centroavantes de zagueiros | 1,12 | 1,72 | 0,93 |\n| Três atacantes no meio | 0,88 | 1,61 | 0,82 |\n| Quatro atacantes na defesa | 1,05 | 2,28 | 0,58 |\n| Lateral esquerdo de zagueiro | 1,21 | 1,37 | 1,23 |\n\nO efeito de jogar fora de posição aparece nos gols a favor e contra, nos chutes sofridos e no ppg, e é maior quanto mais distante a posição. Isso é coerente com o que você pediu.\n\n### 1.4 Valor de cada posição (+10 e −10 de overall em um jogador)\n\n| Posição | +10 | −10 |\n|---|---|---|\n| Goleiro | +0,135 | −0,10 |\n| Zagueiro (cada) | +0,05 a +0,06 | −0,02 |\n| Lateral (cada) | +0,04 | −0,02 |\n| Volante | +0,12 | −0,08 |\n| Meia central | +0,10 | −0,06 |\n| Ala (cada) | +0,09 a +0,10 | −0,06 |\n| Centroavante | +0,16 | −0,12 |\n| Segundo atacante | +0,13 | |\n\nHouve melhora desde o relatório 1 (zagueiro de +0,03 para +0,05), mas defensores e laterais ainda valem pelo menos metade de um volante ou ala e cerca de um terço de um centroavante. O mercado cobra o mesmo por overall igual em qualquer posição, então o jogador esperto continua pagando menos por defesa do que o jogo recompensa em ataque.\n\n### 1.5 O que a posição \"cobra\" do jogador\n\nOs quatro números acima juntos sugerem uma lógica clara: o gol é decidido em três pontos (quem chuta, quem marca, goleiro), e os setores de defesa pesam pela média, não pela soma. Isso é um desenho aceitável, mas explica por que atacantes e goleiros são sempre prioridade de compra.\n\n---\n\n## 2. Atributos\n\n### 2.1 Efeito de cada atributo nos 11 titulares\n\n| Atributo | +10 | −10 | O que muda |\n|---|---|---|---|\n| CHU (chute) | +0,29 | −0,25 | GF de 1,26 para 1,60 |\n| DEF (defesa) | +0,32 | −0,23 | GC de 1,27 para 0,94 |\n| PAS (passe) | +0,14 | −0,07 | pouco |\n| DRI (drible) | +0,14 | −0,08 | pouco |\n| FIS (físico) | +0,09 | −0,08 | stamina |\n| RIT (ritmo) | +0,04 | −0,07 | quase nada |\n| Todos | +0,84 | −0,80 | |\n\n### 2.2 O atributo importa além do overall?\n\nTeste: manter o overall do jogador e deslocar um atributo para cima (compensando no físico). Se só o overall importasse, o resultado não mudaria.\n\n| Mudança com overall igual | Δ ppg |\n|---|---|\n| Atacantes: CHU +12 | +0,21 |\n| Atacantes: CHU −12 | −0,13 |\n| Defensores: DEF +12 | +0,08 |\n| Defensores: DEF −12 | −0,07 |\n| Goleiro: DEF +12 | +0,06 |\n| Goleiro: DEF −12 | −0,05 |\n| Meias: PAS +12 | +0,05 |\n| Meias: DRI +12 | +0,05 |\n| Time todo: FIS +12 | +0,03 |\n| Time todo: RIT +12 | −0,015 |\n\nOu seja, a composição dos atributos importa, principalmente CHU para atacantes. É bom para o jogador sentir a escolha (ele pode preferir um atacante de chute forte). O problema é que RIT, FIS, PAS e DRI são quase decorativos: o jogador não nota diferença quando escolhe um jogador rápido, passador ou driblador. Nenhum deles tem uma função própria visível no jogo.\n\n---\n\n## 3. Stamina\n\nRegras atuais: perda por jogo (26 − FIS×0,13), +10% se ofensivo, −5% se defensivo, ajustada pela idade. Recuperação por exponencial de ~16% do que falta por dia. Força multiplicada por 0,70 + 0,30 × stamina/100. Quem entra do banco ganha \"pernas frescas\" (+7% nos primeiros 25 minutos).\n\n| Medida | Resultado |\n|---|---|\n| Stamina dos titulares no apito inicial, mundo todo | média 88,9; percentil 10 = 81; percentil 90 = 98 |\n| Time que joga a cada 3 e 4 dias (30 jogos), escalação automática | média ~77 depois do 1º jogo |\n| Mesmo time, sempre o melhor 11 ignorando o cansaço | média ~70 |\n| Efeito de começar com stamina menor (todo o time) | 90: −0,16 · 80: −0,31 · 70: −0,44 · 60: −0,58 · 50: −0,70 |\n| Rodízio automático contra \"sempre o melhor 11\" | +0,05 ppg (1,02 contra 0,97; no limite do ruído) |\n| 3 trocas por cansaço aos 60' | +0,034 ppg (1,361 contra 1,327; no limite do ruído) |\n| Trocas por jogo da IA | 0,16 (quase só lesões) |\n\nAvaliação: **melhorou muito**. A recuperação nova faz a stamina cair de 100 para ~77 numa sequência de jogos, e isso custa ~0,3 ppg de forma real, então o jogador passa a ter motivo para rodar elenco e usar o banco. O que ainda falta é recompensa visível: o ganho de rodar o elenco (+0,05) e de trocar três jogadores (+0,03) é pequeno perto do custo de ignorar o cansaço (−0,3). Em outras palavras, o jogo avisa o problema mas a solução rende pouco. O limiar de troca da IA (stamina \u003c 65) quase nunca dispara.\n\n## 4. Moral\n\nRegras atuais: multiplicador de força de 0,95 (moral 0) a 1,05 (moral 100). A moral muda a cada jogo em (nota − 6,3) × 5; reserva que entra ganha +3 e perde só metade se for mal (piso ~40); reserva parado desce 1 por jogo e para em ~40. A moral do técnico muda ±8 por resultado.\n\n| Moral do time (adversário a 65) | ppg |\n|---|---|\n| 0 | 1,01 |\n| 25 | 1,13 |\n| 45 | 1,28 |\n| 65 (base) | 1,34 |\n| 85 | 1,44 |\n| 100 | 1,57 |\n\nMoral vale 0,56 ppg do mínimo ao máximo, mais que stamina e quase tanto quanto +6 de overall. Dinâmica ao longo da temporada (Série A, média dos 14 melhores, da rodada 6 à 36):\n\n| Terço final da tabela | Moral dos jogadores | Moral do técnico |\n|---|---|---|\n| 1º terço | 65 → 68 | 84 → 89 |\n| 2º terço | 61 → 56 | 57 → 56 |\n| Último terço | 61 → 42 | 61 → 27 |\n\nNa Série D, o último terço termina com moral de técnico em 13 e de jogadores em 41. Os pisos novos evitaram o poço sem fundo dos reservas (agora a média deles é 46, antes 43), mas o último terço continua afundando 20 pontos de moral em uma temporada, o que equivale a −0,2 ppg: um efeito \"bola de neve\" que o jogador humano não tem como reverter. A moral do técnico continua só como painel: não há demissão nem efeito direto além de ±1 de moral por jogo no elenco humano.\n\n---\n\n## 5. Táticas, formações e intervalo\n\n### 5.1 Táticas (linha contra coluna, times idênticos, 4-4-2)\n\n| | Ofensivo | Equilibrado | Defensivo | Contra |\n|---|---|---|---|---|\n| Ofensivo | 1,36 | 1,41 | 1,40 | 1,25 |\n| Equilibrado | 1,40 | 1,44 | 1,43 | 1,46 |\n| Defensivo | 1,40 | 1,41 | 1,38 | 1,48 |\n| Contra | 1,39 | 1,29 | 1,25 | 1,36 |\n\nMédia por tática: equilibrado 1,43, defensivo 1,42, ofensivo 1,35, contra 1,32. Gols por jogo: ofensivo 2,56, equilibrado 2,47, defensivo 2,23, contra 2,22. O \"pedra-papel-tesoura\" quase sumiu: a única resposta clara é equilibrado ou defensivo contra \"contra\". A tática ofensiva já não domina, mas a \"contra\" é a pior em quase todas as formações.\n\n### 5.2 Grade de 24 combinações (todos contra todos, 4.830 jogos cada)\n\nMelhores: 3-4-3 defensivo (1,418), 3-4-3 ofensivo (1,404), 3-4-3 equilibrado (1,402), 4-3-3 equilibrado (1,401). Piores: 4-4-2 contra (1,258), 4-5-1 contra (1,291), 3-5-2 contra (1,297), 4-2-3-1 contra (1,299).\n\n| Formação (média das 4 táticas) | ppg |\n|---|---|\n| 3-4-3 | 1,398 |\n| 4-3-3 | 1,373 |\n| 4-2-3-1 | 1,366 |\n| 3-5-2 | 1,347 |\n| 4-5-1 | 1,327 |\n| 4-4-2 | 1,322 |\n\nA amplitude entre a melhor e a pior combinação é 0,16 ppg, ou seja, ~2 pontos de overall. O ranking inverteu em relação ao relatório 1 (agora as formações ofensivas lideram e as defensivas ficam atrás). A diferença é pequena e cada combinação tem um custo, que é o que o desenho pedia. O 4-4-2, que é o padrão do jogo, é a pior formação média.\n\n### 5.3 A sinergia não é neutra\n\nA sinergia mede a especialização do XI. A conta diz que deveria ser neutra, mas com elencos normais ela dá bônus fixos por combinação:\n\n| Combinação | Bônus que o time ganha sem fazer nada |\n|---|---|\n| Defensivo, 4-5-1 / 3-5-2 / 3-4-3 | defesa +6% (limite) |\n| Equilibrado, 4-5-1 / 3-5-2 / 3-4-3 | defesa +5,8% a +6% |\n| Equilibrado ou ofensivo, 4-4-2 | defesa +1,7% a +4% |\n| 4-2-3-1 e 3-5-2 (qualquer tática) | controle +5% |\n| Ofensivo, 3-4-3 | ataque −1,6% |\n\nOs defensores já nascem com DEF alta e o ataque com CHU alto (perfil por posição). Então \"defesa acima da média do time\" é verdade para quase todo elenco. Como o teto é 6%, quem monta um time especializado de propósito não ganha mais que quem não montou nada. O jogador não recebe nenhum sinal de que a escolha dos jogadores certos para a tática funciona.\n\n### 5.4 Intervalo\n\nTeste: o time humano começa com equilibrado contra uma tática sorteada e muda no intervalo (900 jogos por linha).\n\n| Política no intervalo | Computador não reage | Computador reage (60%) |\n|---|---|---|\n| Nada | 1,36 | 1,32 |\n| Resposta tática certa | 1,49 (+0,13) | 1,28 |\n| Resposta certa + formação pelo placar | 1,44 | 1,30 |\n| Resposta errada | 1,27 (−0,10) | 1,28 |\n| Sorteia tática e formação | 1,34 | 1,31 |\n\nA leitura de intervalo foi desenhada para ser valiosa: +3% para a resposta certa e −2% para a errada. Só que o computador responde depois do humano, vendo a nova tática, e acerta em 60% dos casos. Resultado prático: acertar a leitura não rende mais do que não fazer nada. No jogo o humano vê \"a tática X é a resposta certa\" e depois o computador a anula, o que passa a sensação de que a escolha não conta.\n\n### 5.5 Copa nivelada\n\nFunciona como desenhado (jogo nivelado em 45% dentro do confronto):\n\n| Confronto (prestígio) | Liga: forte vence | Copa: forte vence |\n|---|---|---|\n| 80 contra 80 | 39% | 39% |\n| 70 contra 40 | 70% | 57% |\n| 90 contra 30 | 90% | 73% |\n| 60 contra 20 | 80% | 65% |\n\n---\n\n## 6. Técnicos humanos de teste\n\n### 6.1 Dez estilos (clubes da Série D, 240 temporadas de clube por estilo)\n\n| Estilo | ppg | GF | GC | Posição média |\n|---|---|---|---|---|\n| G Camaleão (adapta ao prestígio do rival) | 1,111 | 0,99 | 1,33 | 14,4 |\n| I Aleatório (sorteia formação e tática todo jogo) | 1,103 | 1,00 | 1,36 | 14,5 |\n| F Kamikaze (3-4-3 ofensivo) | 1,097 | 1,12 | 1,51 | 14,7 |\n| D Retranca (4-5-1 defensivo) | 1,090 | 0,90 | 1,25 | 14,7 |\n| J Mandante ofensivo, visitante retranca | 1,089 | 1,02 | 1,38 | 14,7 |\n| H Leitor (4-2-3-1, lê o rival no intervalo) | 1,074 | 0,99 | 1,38 | 15,0 |\n| C Equilibrado (4-4-2) | 1,071 | 1,01 | 1,43 | 15,0 |\n| A Ofensivo (4-3-3) | 1,059 | 1,10 | 1,54 | 15,1 |\n| E Controlador (3-5-2) | 1,056 | 1,00 | 1,41 | 15,1 |\n| B Contra-ataque (4-5-1) | 1,019 | 0,88 | 1,32 | 15,6 |\n\nAmplitude: 0,09 ppg (3,5 pontos por temporada, ~1 posição). O estilo se vê nos gols (Kamikaze faz 1,12 e sofre 1,51; Retranca faz 0,90 e sofre 1,25), mas não na classificação, e o sorteio aleatório fica à frente de seis estilos \"pensados\".\n\n### 6.2 Cinco níveis de habilidade em 10 clubes de todas as séries\n\nClubes: dois por faixa (Série A topo e base, B, C, D). Cada nível passou por cada clube; 240 temporadas de clube por nível.\n\n| Nível | ppg | Títulos / acessos / rebaixamentos por 100 temporadas |\n|---|---|---|\n| 1 Aleatório | 1,149 | 1,7 / 5,8 / 24,6 |\n| 2 Passivo (4-4-2 equilibrado) | 1,135 | 1,7 / 4,2 / 26,3 |\n| 3 Intuitivo (ataca se é maior, fecha se é menor) | 1,163 | 1,3 / 4,2 / 21,3 |\n| 4 Estudioso (resposta tática ao adversário) | 1,165 | 2,5 / 4,6 / 27,1 |\n| 5 Expert (nível 4 mais intervalo e trocas por cansaço) | 1,203 | 1,3 / 6,7 / 21,7 |\n\nEm campanhas de 3 anos (270 temporadas por nível), o expert fica em 1,06 e o aleatório em 1,00, ou seja, cerca de 0,06 ppg (2,3 pontos por temporada). Já o clube importa muito mais:\n\n| Clube | ppg (média dos 5 níveis) |\n|---|---|\n| São Paulo (Série A, topo) | 1,77 |\n| Comercial-MS (Série D, forte) | 1,49 |\n| São Caetano (Série C) | 1,38 |\n| Marília (Série D) | 1,17 |\n| Coritiba (Série A, base) | 1,03 |\n| Ceilândia (Série D, fraco) | 0,91 |\n| Paraná (Série A, mais fraco) | 0,69 |\n\n### 6.3 Leitura de dificuldade\n\n- **Piso e teto da habilidade são baixos.** Um técnico que não sabe nada de tática perde só ~0,06 ppg para um expert. Isso evita o jogo ficar impossível para quem erra, mas tira o sentimento de domínio de quem estuda.\n- **A dificuldade é o sorteio.** Um clube de Série D fraco rebaixa-se ou luta contra o rebaixamento (~25% de rebaixamento por temporada para qualquer nível), enquanto um forte vive no meio da tabela. O que o jogador faz nas 38 rodadas muda a posição final em cerca de 1 lugar.\n- **O jogo só ficará \"nem fácil nem difícil\" se as alavancas que mudam o time (mercado, treino, base, finanças) valerem mais que as táticas.** Não consegui medir isso porque os técnicos de teste não usaram o mercado. É a próxima bateria (ver seção 9).\n\n---\n\n## 7. Caos, previsibilidade e economia\n\n### 7.1 Chance de vitória por diferença de força do XI (casa menos fora, em pontos de overall efetivo)\n\n| Diferença | Casa vence | Empate | Visitante vence | Saldo médio |\n|---|---|---|---|---|\n| −12 | 11% | 19% | 70% | −1,27 |\n| −8 | 18% | 23% | 59% | −0,83 |\n| −4 | 28% | 26% | 46% | −0,35 |\n| 0 | 39% | 26% | 35% | +0,09 |\n| +4 | 52% | 24% | 24% | +0,56 |\n| +8 | 66% | 20% | 14% | +1,07 |\n| +12 | 75% | 16% | 8% | +1,53 |\n| +16 | 85% | 11% | 4% | +2,02 |\n\nA curva é suave: mesmo um time muito superior perde ou empata 15% a 25% das vezes. O mando de campo vale cerca de 1 ponto de overall (a 0 de diferença o mandante vence 39% e o visitante 35%). Isso é um bom nível de caos para um jogo de gestão, perto do futebol real.\n\n### 7.2 Temporada de liga\n\n| Série | Correlação força × posição final | Campeão era o mais forte | Campeão no top 3 | Pontos campeão / lanterna |\n|---|---|---|---|---|\n| A | 0,87 | 38% | 74% | 85 / 21 |\n| B | 0,69 | 38% | 71% | 79 / 26 |\n| C | 0,58 | 35% | 61% | 77 / 29 |\n| D | 0,84 | 28% | 60% | 83 / 21 |\n\nA Série A e a D são previsíveis. Os rebaixados na A são, em média, o 17º mais forte de 20. Isso se deve ao tamanho da diferença de força entre clubes (a A vai de 99 a 59 de prestígio). Em 120 temporadas de Série A, os campeões foram: Corinthians 42, Vasco 23, Flamengo 19, Palmeiras 17, São Paulo 12, Cruzeiro 3, Internacional 3, Botafogo 1.\n\n### 7.3 Outros números do motor\n\n| Indicador | Valor |\n|---|---|\n| Gols por jogo (A / B / C / D) | 2,80 / 2,76 / 2,72 / 2,59 |\n| Margem de vitória: 0 / 1 / 2 / 3 / 4+ gols | 24% / 40% / 24% / 9% / 3% |\n| 0×0 | 6,8% |\n| Jogos com 7 gols ou mais | 2,2% |\n| Chutes por jogo (total / no alvo) | 21,4 / 8,0 |\n| Amarelos / vermelhos por jogo | 3,08 / 0,19 |\n| Lesões por jogo | 0,14 (antes 0,27) |\n| Pênaltis (lances) por jogo | 0,30 |\n| Lotação média (A / B / C / D) | 58% / 49% / 36% / 25% |\n| Jogos lotados (A) | 7% |\n\n### 7.4 Economia e mundo longo\n\n- Resultado anual médio sem intervenção (milhares de R$): A +4.490, B +1.406, C +542, D +172. Caixa após 10 anos: A 34 milhões, D 1,6 milhão. O dinheiro só acumula, porque os clubes do computador não gastam: não há despesa que freie essa inflação.\n- Prêmios entram como 0,85 milhão por clube na A e 45 mil na D por ano, perto de 20% do resultado em D.\n- Mundo de 25 anos: estável. Overall dos 14 melhores da A oscila em 67 a 68, idade média cai para ~25 após as aposentadorias e reposições. Há uma deflação suave inicial (de 71 para ~67 nos primeiros 8 anos) e depois estabiliza.\n- Prestígio dinâmico funciona: foi de 5 a 99 em 10 anos, sem explosão.\n\n---\n\n## 8. Propostas de melhoria (para discutir)\n\nCada item diz o porquê, a proposta e o risco. Estão ordenados por impacto no \"o jogador sente que a escolha dele conta\".\n\n1. **Intervalo que conta.** Hoje o computador anula a resposta do humano. Proposta: o computador reage antes do humano (com base na tática do 1º tempo, sem ver a mudança do humano), ou reage no máximo a cada 3 jogos, ou só 25% das vezes. Efeito esperado: resposta certa volta a valer cerca de +0,10 ppg. Risco baixo.\n2. **Dar uma função própria a RIT, FIS, PAS e DRI.** Hoje só entram nos pesos do overall. Ideias: RIT decide contra-ataques e atacantes que vencem corrida; PAS aumenta a chance de a jogada virar chute (e assistência de verdade); DRI dribla o marcador e gera pênalti e falta; FIS decide disputas e resistência à lesão. Efeito: o jogador vê diferença quando escolhe o jogador rápido, passador ou driblador.\n3. **Fazer a sinergia premiar a escolha.** Subtrair o bônus médio dos elencos normais (ou normalizar pelo clube) e aumentar o teto, para que só quem especializa o time de propósito ganhe bônus. Hoje todos ganham +4% de defesa de graça.\n4. **Reforçar o goleiro e o jogador de linha no gol.** Aplicar uma penalidade explícita de defesa para quem não é goleiro (por exemplo, defesa x0,4), de modo que um atacante no gol sofra perto de 3 gols por jogo. Hoje a conversão sobe de 34% para 48%, o que vale menos que o desejado.\n5. **Tornar a escalação mais visível.** Mostrar na tela de escalação o impacto de cada troca em ataque, defesa e controle (já existe parte na média do campo); mostrar o efeito de cada atributo no jogo.\n6. **Assistências realistas.** Peso do passador por setor (meias 55%, atacantes 35%, defensores 10%).\n7. **Tornar o expert mais recompensado e o iniciante menos punido.** O intervalo e as trocas são as alavancas diretas; ampliar o ganho de pernas frescas (de +7% para +10% e por 30 minutos) e fazer a IA trocar com limiar maior (stamina \u003c 75).\n8. **Reduzir a bola de neve da moral.** Dar ao humano uma ação de moral (prêmio por vitória, conversa, folga) e usar mais a moral do técnico: abaixo de 20 por 8 jogos a diretoria avisa; abaixo de 10, demite.\n9. **Previsibilidade da Série A.** Aproximar o piso de força dos grandes e dos pequenos (hoje o campeão é o mais forte em 38% das vezes) ou aumentar a variância de forma do dia (hoje ±3%).\n10. **Economia com sumidouro.** Os clubes do computador devem gastar (compra de jogadores, obras) ou ter custo fixo proporcional ao caixa; senão o dinheiro só cresce.\n11. **Novas posições e papéis.** Atacantes participando de desarmes, laterais com perfil ofensivo ou defensivo, capitão e batedor de falta e pênalti, que dão mais identidade aos jogadores.\n12. **Ranking de dificuldade.** Mostrar no sorteio a previsão de dificuldade do clube (por exemplo, \"mais fraco que 80% da série\") e oferecer níveis de dificuldade que alterem o fator de dia inspirado, a reação do computador e o caixa inicial.\n\n## 9. Onde ainda devemos testar\n\n1. **Mercado, treino e base com um técnico bot.** Falta medir se comprar, vender, renovar e treinar bem muda o ppg de um clube ao longo de 5 a 10 anos. É onde o jogador mais deve sentir evolução, e aqui eu não medi.\n2. **Interface.** Se a tela mostra as informações que dão as escolhas (efeito de atributo, leitura de intervalo, sinergia) e se o jogador entende. Posso rodar um teste automatizado no navegador.\n3. **Preço do ingresso e lotação depois das mudanças.** Reteste do piso de 3% (a exploração do relatório 1) e do efeito do preço em cada série.\n4. **Sinergia e atributos com elencos montados à mão** (mesmo overall, perfis diferentes) em campanhas de 5 anos.\n5. **Copa do Brasil com humano**, incluindo pênaltis com escolha de batedor.\n6. **Multiplayer e determinismo** com vários humanos ao mesmo tempo.\n\n## Apêndice\n\nScripts em `scripts-02/` (Node; carregam o `index.html` da branch e rodam o motor real): `w1.js` mundo e caos, `p1.js` posições, goleiro e atributos, `s2.js` rodízio, intervalo e sinergia, `w2.js` estilos e níveis de técnico, `cup.js` Copa, `exp3/5/6/7/9.js` stamina, moral, trocas, grade e mundo longo.\n"}, {"id": "relatorios/04-medicoes-melhorias-16.md", "titulo": "Medições da Melhorias #16: atributos, Série A, sorteio de força e técnicos do computador", "md": "# Medições da Melhorias #16: atributos, Série A, sorteio de força e técnicos do computador\n\nMedidas feitas com o motor real do jogo em Node, sem a tela, antes (versão 18, publicada) e depois (esta versão). \"Antes\" e \"depois\" usam as mesmas sementes. O erro padrão de cada saldo de gols abaixo é de cerca de ±0,05.\n\n## 1. O que cada atributo faz agora\n\nTeste: o mesmo time joga contra o mesmo adversário duas vezes, uma normal e outra com **+12 em um atributo de todos os jogadores de linha**. A tabela mostra o ganho no saldo de gols por jogo, 1500 jogos por linha.\n\n| Atributo | Ganho antes | Ganho depois | Chutes a mais por jogo (antes → depois) | Faltas sofridas pelo adversário a mais (antes → depois) |\n|---|---|---|---|---|\n| Ritmo | +0,04 | **+0,25** | +0,38 → +0,93 | −0,03 → +0,16 |\n| Finalização (antes \"Chute\") | +0,44 | **+0,45** | +0,92 → +0,94 | +0,07 → +0,36 |\n| Passe | +0,21 | **+0,37** | +0,54 → **+1,93** | +0,13 → +0,33 |\n| Drible | +0,21 | **+0,32** | +0,76 → +1,39 | +0,13 → **+0,90** |\n| Defesa | +0,28 | +0,26 | (defesa pesa igual) | (igual) |\n| Físico | +0,12 | **+0,21** | +0,60 → +0,54 | +0,13 → +0,21 |\n\nComo cada um passou a funcionar:\n\n- **Finalização** (renomeado de Chute, vale também para o cabeceio): é o principal atributo do chute (70%, com 15% de ritmo e 15% de drible), converte bem mais com o bom finalizador, e o cabeceio usa finalização, altura e físico.\n- **Passe**: o índice de passe do time (goleiro, zagueiros, laterais e meias) aumenta os lances que chegam ao ataque (+1,9 finalizações por jogo com +12 de passe) e também o controle de bola. O melhor passador bate os escanteios, e quanto melhor o passe, mais cabeçadas.\n- **Drible**: em cada ataque o driblador enfrenta o marcador. Quem leva a pior faz falta (macetador faz mais), e a falta vira pênalti se for na área (atacante 24%, meia 11%, zagueiro 2%) ou cobrança direta perto da área. Quem ganha o duelo cria finalização melhor.\n- **Ritmo**: entra na qualidade do chute em jogada (15%), faz o marcador chegar antes no desarme e pesa nos contra-ataques (diferença de ritmo entre os times aumenta as finalizações).\n- **Físico**: cansa menos (perda de stamina por jogo vai de 26 com Físico 30 para 11 com Físico 99), recupera mais rápido entre os jogos e se lesiona bem menos (risco entre 0,5× e 1,6×), e ajuda no cabeceio.\n\n## 2. Estatísticas por jogo (jogos entre times de prestígio sorteado de 40 a 90)\n\n| Medida | Antes | Depois |\n|---|---|---|\n| Gols por jogo | 2,58 | 2,67 |\n| Finalizações (chutes) por jogo | 20,6 | 22,0 |\n| Chutes no gol | 7,5 | 9,2 |\n| Escanteios por jogo | não existia | **5,95** |\n| Gols de cabeça por jogo | não existia | **0,37** |\n| Gols de falta direta por jogo | não existia | **0,21** |\n| Pênaltis convertidos por jogo | 0,20 | 0,27 |\n| Faltas por jogo | 22,7 | 21,1 |\n| Lesões por jogo (2 times) | 0,127 | 0,103 |\n| Vitória casa / empate / vitória fora | 39% / 23% / 38% | 44% / 19% / 37% |\n| Assistências por gol | 0,55 | 0,64 |\n\nQuem dá o passe do gol: **meias 55%, atacantes 34%, defensores 11%, goleiro ~0%** (antes os meias concentravam a grande maioria). Os gols saem 52% dos atacantes, 34% dos meias e 14% dos defensores.\n\n## 3. Atributos fora do padrão da posição e goleiro batedor\n\n- Cada jogador nasce com mais variação nos atributos, e 16% têm uma especialidade fora do padrão (+8 a +18 em um atributo qualquer, por exemplo zagueiro driblador ou atacante que desarma) e 6% um ponto fraco.\n- Cada jogador tem um atributo novo, **Bola parada** (visível na ficha), que acompanha finalização e passe mas com bastante acaso. 10% dos goleiros nascem batedores de falta (estilo Rogério Ceni) e 7% dos jogadores de linha são especialistas.\n- Teste do goleiro batedor: time com goleiro de bola parada 90 (os demais limitados a 60) faz **0,075 gol de falta por jogo** contra **0,036** com um goleiro comum, o dobro.\n- O técnico escolhe o capitão e os batedores na Escalação (automático por padrão), e a tela mostra a sinergia da escalação e o índice de saída de bola.\n\n## 4. Jogador de linha no gol\n\nGols sofridos por jogo: goleiro de verdade 1,04 e **centroavante no gol 2,58** (antes: 1,27 e 2,12). O jogador de linha no gol agora é bem pior do que antes, mas não é absurdo.\n\n## 5. Série A mais nivelada\n\n12 temporadas de Série A completas (20 clubes, ida e volta), correlação entre a força do elenco (média dos 14 melhores) e os pontos:\n\n| Medida | Antes | Depois |\n|---|---|---|\n| Correlação força × pontos | 0,88 | **0,72** |\n| Pontos do último ao primeiro (uma temporada) | 17 a 88 | 32 a 76 |\n| Média de pontos do campeão | 81,8 | 73,5 |\n| Campeões diferentes em 12 temporadas | 4 clubes (Corinthians 5, São Paulo 4) | **7 clubes** (São Paulo 4, Palmeiras 2, Vasco 2 e mais quatro) |\n\nComo: o elenco inicial dos clubes da A é comprimido para a média (fator 0,35), há menos estrelas na A e a sinergia foi normalizada.\n\n## 6. Sinergia normalizada e leitura do intervalo\n\n- A sinergia de cada combinação tática × formação agora é medida contra elencos reais escalados pela escalação automática. Em 60 elencos aleatórios, a média de cada uma das 24 combinações ficou entre −0,7% e 0,0% (antes cada combinação tinha um viés próprio). O teto passou de ±6% para ±8%.\n- No intervalo, a leitura compara a nova tática com a que o adversário **jogou no 1º tempo**. O computador não \"desfaz\" mais a resposta certa do humano. O acerto do técnico do computador no intervalo depende da personalidade dele e da dificuldade (veja abaixo).\n\n## 7. Sorteio de força dos clubes de entrada\n\nEm 40 jogos novos: os 10 sorteáveis seguem sendo os mais fracos da D (overlap pequeno com os outros 10), mas quem é o mais forte e o mais fraco muda a cada jogo. **Cada um dos 10 foi o mais forte pelo menos 1 vez, e cada um foi o mais fraco pelo menos 1 vez.** Média dos 14 melhores: sorteáveis de 41,8 a 52,8 e os outros 10 da D de 46,4 a 54,5.\n\n## 8. Técnicos do computador\n\nCada clube nasce com um técnico de uma de 6 personalidades, que define quem ele manda para o treino, qual tática prefere e o quanto lê o jogo no intervalo:\n\n| Personalidade | Treina | Tática preferida | Leitura no intervalo |\n|---|---|---|---|\n| Formador | jovens até 23 anos, no ponto fraco | equilibrada | 55% |\n| Ofensivista | finalização, drible e ritmo de atacantes e meias | ofensiva (40% dos jogos) | 50% |\n| Retranqueiro | defesa e físico de defensores, volantes e goleiros | defensiva/contra (40%) | 55% |\n| Preparador físico | físico e ritmo de qualquer posição | sem preferência | 55% |\n| Professor | passe e drible de meias, atacantes e laterais | equilibrada (30%) | 70% |\n| Estrategista | quase não treina | sem preferência | 80% |\n\nO computador só coloca no treino quem **não** está entre os 11 do próximo jogo (os que o perfil permite do banco: Formador e Professor). Respeita as regras do humano (até 3 treinando, cooldown, 3 treinos seguidos). O técnico humano vê o perfil do técnico adversário na ficha do clube.\n\nEfeito em 16 temporadas de mundos sem humano (2 mundos × 8 anos):\n\n| Personalidade | Resíduo de pontos por temporada (ajustado pela força no início) | Ganho médio de atributo por temporada |\n|---|---|---|\n| Estrategista | **+1,7** | +0,19 |\n| Ofensivista | +0,5 | +0,23 |\n| Retranqueiro | +0,1 | +0,15 |\n| Formador | −0,2 | +0,30 |\n| Professor | −0,3 | +0,29 |\n| Preparador físico | −0,8 | +0,20 |\n\nAs diferenças são pequenas (cerca de um ponto por temporada), o que é o desejado: personalidade muda o jeito do clube, não decide campeonato. Esta medição foi feita numa versão um pouco anterior à calibragem final do treino do computador.\n\n## 9. Outras checagens\n\n- **Copa do Brasil** (400 confrontos por linha, 85 × 15): maior agregado mediana 5, p90 9, máximo 12 (antes desta rodada 5 / 7 / 10); favorito avança 96%. As diferenças individuais de atributo também são comprimidas nos jogos da Copa (as de força de equipe já eram).\n- **Mundo de 14 anos** (80 clubes, sem humano): média dos 14 melhores estável por divisão (A ≈ 72–74, B ≈ 62–63, C ≈ 55–57, D ≈ 48–49). O caixa médio da A sobe devagar (de 18 para 26 milhões em 13 anos), e o sumidouro de caixa do computador investe perto de R$ 85 milhões por ano em CT e base (20% do caixa acima de 2 folhas anuais). Poucos clubes (2 a 4 em 80) ficam com caixa negativo depois de 12 anos, como já acontecia.\n- **Inflação de atributos**: continua existindo e ficou maior que na versão 18. Jogadores com Finalização ≥ 90 depois de 13 anos: **33 contra 16 antes**, efeito da variação maior nos atributos e das premiações. Para segurar, a premiação passou a dar menos pontos a quem já tem atributo alto (nada acima de 87 e menos chance acima de 72) e o computador não treina atributo acima de 80. Se continuar subindo, a próxima ação é limitar a evolução por idade.\n- **Diretoria**: a moral do técnico abaixo de 20 gera aviso; 12 jogos seguidos abaixo de 20 com o clube na zona de rebaixamento demite o técnico (opção desligável no início do jogo), que assume um clube pior. Com 6 técnicos passivos (sem mexer na escalação) por 1 temporada, 2 a 3 foram demitidos, e quem joga de verdade deve ficar bem abaixo disso.\n\n## 10. Status das propostas do Relatório 2\n\n1. Leitura do intervalo contra a tática do 1º tempo: feito.\n2. Efeito real de ritmo, físico, passe e drible: feito (seção 1).\n3. Sinergia normalizada: feito.\n4. Jogador de linha no gol: feito.\n5. Escalação mostra a sinergia e os papéis: feito.\n6. Assistências realistas: feito.\n7. Pernas frescas (+10% por 30 min) e substituição automática antes (stamina \u003c 75): feito.\n8. Moral: conversa com o elenco, prêmio por vitória, aviso e demissão da diretoria: feito.\n9. Série A mais nivelada: feito.\n10. Sumidouro de caixa dos clubes do computador: feito.\n11. Capitão e batedores de falta, pênalti e escanteio: feito.\n12. Dificuldade (Fácil, Normal, Difícil) e força dos clubes sorteáveis escondida: feito.\n"}, {"id": "relatorios/05-bateria-melhorias-16.md", "titulo": "Relatório 3: reteste completo da v19 (Melhorias #16), compra de reforços e treino", "md": "# Kfoot 98 — Relatório 3: reteste completo da v19 (Melhorias #16), compra de reforços e treino\n\nVersão testada: branch `claude/melhorias-5-xt6u1f`, commit 5652ddf (Melhorias #16). Nada foi alterado no código, nada foi enviado ao repositório e o artefato não foi republicado. Este documento é diagnóstico e proposta, para decidirmos juntos antes de implementar.\n\nMétodo: o mesmo do relatório 2. Carreguei o motor real do `index.html` em Node (sem a tela), usei elencos clonados, mando trocado, sementes comuns e rodízio de estratégias. Erros padrão aparecem como ±. Scripts e resultados brutos em `scripts-03/`. Medidas da outra thread (`04-medicoes-melhorias-16.md`) foram conferidas por medições próprias, e a coluna \"bate?\" abaixo diz onde concordo.\n\n---\n\n## Resumo em uma página\n\n1. **As melhorias do relatório 2 funcionam.** Intervalo agora vale (+0,09 ppg para a resposta certa, contra ~0 antes), sinergia ficou neutra (média −0,2% a 0,0%), atacante no gol sofre 2,6 gols por jogo (antes 2,0), Série A menos previsível, assistências realistas, Copa continua nivelada, atributos têm função própria.\n2. **Passe, drible e ritmo deixaram de ser decorativos.** +10 em todos os titulares: Finalização +0,32 ppg, Passe +0,30, Defesa +0,30, Drible +0,25, Ritmo +0,25, Físico +0,13 (relatório 2: 0,29 / 0,14 / 0,32 / 0,14 / 0,04 / 0,09). Físico segue o mais fraco.\n3. **O que mais muda o resultado do técnico humano é o mercado, e muito.** Um robô humano num dos 10 piores clubes da D que só joga (4-4-2 fixo) faz 0,79 ppg e nunca sai da D em 8 anos. O mesmo clube comprando reforços, contratando livres e treinando jovens faz 1,73 ppg, sobe para a C em 93% das campanhas e para a B em 60%. Os clubes das Séries B e C com o mesmo robô chegam à Série A em 67% das campanhas (contra 3% parado). Hoje o mercado vale mais do que tática, atributo e moral somados.\n4. **Os preços são baratos demais para o caixa.** Um centroavante médio da Série B custa R$ 102 mil (mais ~30% de multa) e o caixa de um clube da D tem R$ 440 mil. Um time inteiro da B (10 posições) custa R$ 3,6 mi, mas três reforços da B (R$ 0,9 mi) já dão +0,39 ppg contra a D.\n5. **O computador não compra jogadores e nunca treinou/negociou entre si.** Só compra do humano (quando ele põe à venda). Simulei o computador comprando: reduz um pouco a previsibilidade e o ganho é pequeno (ρ da A de 0,83 para 0,77), mas esvazia o caixa da D em 45%.\n6. **A Copa tem um furo: pênaltis são sorteio puro (50% para qualquer time)**, sem influência de goleiro, batedor, stamina ou escolha do humano. A escolha de batedor existe só nos pênaltis durante o jogo.\n7. **Três desequilíbrios novos:** (a) elenco de ataque técnico (Fin/Drib/Rit) rende +0,5 ppg a mais que o elenco \"normal\" de mesmo overall, enquanto elenco de defesa/físico rende −0,08: o overall (Média) engana; (b) a formação 3-4-3 é melhor que todas as outras em qualquer tática (1,44 contra 1,31 a 1,40) e 3-5-2/4-2-3-1 ficam atrás; (c) os gols caíram nas divisões baixas (D 1,84, C 1,99, B 2,39 por jogo; antes 2,59 / 2,72 / 2,76) e 0×0 foi de 7% para 11%.\n8. **Interface:** passou sem nenhum erro de JavaScript em compra pela tela, treino, escalação e 12 partidas jogadas pelo navegador. **Multiplayer e determinismo:** resultado idêntico entre execuções com 1, 4 e 8 humanos, e idêntico entre o caminho \"ao vivo\" da tela e a simulação rápida.\n9. **O preço do ingresso agora é fixo**, o que fecha a exploração do piso de 3% (nenhum clube chega ao piso).\n\n---\n\n## 1. Reteste do relatório 2\n\n### 1.1 Gols por setor (90 mil jogos de liga em mundos de 6 anos)\n\n| Indicador | Atacantes | Meias | Defensores | Goleiro | Antes (A / M / D) |\n|---|---|---|---|---|---|\n| Gols | 56% | 30% | 13% | 1% | 65 / 29 / 6 |\n| Chutes | 58% | 31% | 11% | 0% | 64 / 31 / 5 |\n| Assistências | 47% | 43% | 10% | 0% | 13 / 57 / 30 |\n| Desarmes | 0% | 31% | 69% | 0% | 0 / 31 / 69 |\n\nAssistências ficaram realistas (a thread de melhorias reporta meias 55 / atacantes 34; no meu mundo completo saiu 43 / 47, diferença de método, mesma direção). Gols de defensores dobraram (13%), por causa de escanteios e faltas. Bate com a medição da outra thread.\n\n### 1.2 Quem está no gol (1.500 jogos por linha, ppg base 1,32)\n\n| Quem joga no gol | Gols sofridos | Conversão no alvo | ppg |\n|---|---|---|---|\n| Goleiro titular | 1,17 | 28% | 1,32 |\n| Goleiro ruim (todos −20) | 1,49 | 34% | 1,12 |\n| Goleiro elite (+15) | 0,94 | 23% | 1,51 |\n| Melhor zagueiro no gol | 2,50 | 56% | 0,60 |\n| Melhor volante no gol | 2,47 | 57% | 0,60 |\n| Melhor meia no gol | 2,60 | 60% | 0,53 |\n| Centroavante no gol | 2,63 | 60% | 0,51 |\n| Jogador de linha com menor DEF | 2,69 | 61% | 0,49 |\n\nAntes: centroavante no gol sofria 2,04. Agora 2,63 (+29%). Corrigido. A diferença entre um goleiro ruim e um elite é 0,39 ppg, o que dá ao humano um motivo claro para investir no goleiro.\n\n### 1.3 Valor de cada posição (+10 de overall em um jogador, ppg sobre a base)\n\n| Posição | Antes | Agora (ppg ±0,024) |\n|---|---|---|\n| Goleiro | +0,135 | +0,12 / +0,14 |\n| Zagueiro | +0,05 | +0,09 |\n| Lateral | +0,04 | +0,10 |\n| Volante | +0,12 | +0,17 / +0,12 |\n| Meia central | +0,10 | +0,15 / +0,21 |\n| Ala | +0,09 | +0,17 a +0,22 |\n| Centroavante | +0,16 | +0,24 / +0,25 |\n| Segundo atacante | — | +0,24 / +0,27 |\n| 4 defensores de uma vez | — | +0,34 / +0,38 |\n| 4 meias de uma vez | — | +0,58 / +0,69 |\n| 2 atacantes de uma vez | — | +0,35 / +0,50 |\n\nTodas as posições pesam mais do que antes e o meio-campo continua sendo o setor mais valioso (4 meias valem quase o dobro de 4 defensores). Defensor ainda é a posição mais barata de \"esquecer\", o que já era um ponto fraco do relatório 2 (ver proposta 5).\n\n### 1.4 Jogador fora de posição (ppg base 1,32)\n\n| Situação | ppg |\n|---|---|\n| Melhor goleiro de centroavante | 1,02 |\n| Melhor goleiro de zagueiro | 1,18 |\n| Melhor centroavante de zagueiro | 1,14 |\n| Melhor zagueiro de centroavante | 1,14 |\n| 2 centroavantes de zagueiros | 0,93 |\n| 2 zagueiros de atacantes | 0,96 |\n| 3 atacantes no meio | 0,77 |\n| Lateral esquerdo de zagueiro | 1,29 |\n\nA penalidade por posição errada continua forte e coerente (lateral de zagueiro quase não perde, atacante no meio perde muito).\n\n### 1.5 Atributos\n\n+10 nos 11 titulares (ppg sobre base 1,32, ±0,024): Finalização 1,64 (+0,32), Passe 1,62 (+0,30), Defesa 1,62 (+0,30), Ritmo 1,57 (+0,25), Drible 1,57 (+0,25), Físico 1,45 (+0,13). Todos os atributos −10: Defesa 1,03 e Finalização 1,11 são os que mais doem.\n\nTeste de \"atributo além do overall\" (mesmo overall, perfil diferente):\n\n| Perfil | ppg | Diferença |\n|---|---|---|\n| Atacantes com Finalização +12 | 1,51 | +0,19 |\n| Atacantes com Finalização −12 | 1,24 | −0,08 |\n| Meias/alas/volantes com Passe +12 | 1,54 | +0,22 |\n| Meias com Drible +12 | 1,47 | +0,15 |\n| Time todo com Ritmo +12 (Físico compensa) | 1,44 | +0,12 |\n| Time todo com Físico +12 (Ritmo compensa) | 1,17 | **−0,15** |\n| Zagueiros/laterais com Defesa +12 | 1,37 | +0,05 |\n| Goleiro com Defesa +12 | 1,38 | +0,06 |\n\nPasse, Drible e Ritmo agora aparecem no resultado. O Físico é o ponto que sobra: um time \"forte fisicamente\" com o mesmo overall rende menos (−0,15), porque o overall paga pelo Físico mais do que o jogo devolve. Defesa de zagueiro ainda rende pouco por ponto (+0,05).\n\n### 1.6 Stamina e moral (1.500 jogos por linha)\n\n| Condição | ppg (base 1,38) |\n|---|---|\n| Stamina inicial 90 | 1,13 (−0,24) |\n| Stamina inicial 80 | 0,94 (−0,44) |\n| Stamina inicial 60 | 0,56 (−0,82) |\n| Moral 0 | 0,99 |\n| Moral 45 | 1,23 |\n| Moral 65 (base) | 1,38 |\n| Moral 85 | 1,49 |\n| Moral 100 | 1,61 |\n\nMoral de 0 a 100 vale 0,62 ppg (antes 0,56). Stamina inicial 80 custa 0,44 ppg (antes 0,31): o Físico agora reduz o desgaste, então o cansaço pesa mais para quem tem Físico baixo. Rodízio: \"sempre o melhor 11\" 0,763 ppg contra 0,844 do automático do jogo (+0,08 ±0,017). Trocas por cansaço: nenhuma política muda mais que +0,03 ppg (a melhor foi \"três aos 60 minutos\", +0,026; resto igual à IA), então a troca como decisão ainda vale pouco.\n\nMoral por tabela (mundo sem humano, 6 rodadas): o terço de baixo da tabela perde moral continuamente (Série A: 62 → 48; moral do técnico 62 → 32; Série D: 62 → 49, técnico 33 → 11) enquanto o terço de cima sobe (65 → 70 / 75). A espiral continua e é o motivo da conversa/prêmio/demissão da v19, que só o humano usa. Sugiro medir em um relatório futuro se o humano consegue sair dela.\n\n### 1.7 Táticas, formações e grade de 24 combinações (4.830 jogos por célula)\n\n| Formação | Ofensivo | Equilibrado | Defensivo | Contra |\n|---|---|---|---|---|\n| 3-4-3 | 1,432 | **1,477** | 1,457 | 1,385 |\n| 4-4-2 | 1,384 | 1,450 | 1,401 | 1,348 |\n| 4-3-3 | 1,383 | 1,378 | 1,395 | 1,334 |\n| 4-5-1 | 1,336 | 1,364 | 1,393 | 1,350 |\n| 4-2-3-1 | 1,301 | 1,328 | 1,344 | 1,295 |\n| 3-5-2 | 1,313 | 1,344 | 1,328 | **1,261** |\n\nAmplitude 0,22 ppg (antes 0,16). Por formação: 3-4-3 1,438, 4-4-2 1,396, 4-3-3 1,372, 4-5-1 1,361, 4-2-3-1 1,317, 3-5-2 1,311. Por tática: equilibrado 1,390, defensivo 1,386, ofensivo 1,358, contra 1,329. O 3-4-3 é melhor que qualquer outra formação em todas as táticas: sobrou uma estratégia dominante. Antes o 4-4-2 era a pior; agora o 4-4-2 é a segunda melhor. \"Contra\" continua a pior tática.\n\nSinergia (24 combinações, elencos automáticos): média −0,23% (ataque), 0,00% (defesa), +0,02% (controle), p95 do módulo 2,1%, máximo 5,9%. Neutra. Corrigido.\n\n### 1.8 Intervalo (900 jogos por linha, computador reagindo com a personalidade dele)\n\n| Política | ppg | Ajuste médio |\n|---|---|---|\n| Nada | 1,303 | 0% |\n| Resposta tática certa | 1,392 (+0,09) | +3,0% |\n| Resposta certa + formação pelo placar | 1,373 (+0,07) | +4,1% |\n| Resposta errada | 1,257 (−0,05) | −2,0% |\n| Perdendo recua, ganhando ataca | 1,249 (−0,05) | −0,9% |\n| Sorteia tática e formação | 1,274 (−0,03) | +0,4% |\n\nCorrigido: a resposta certa vale cerca de +0,09 ppg com o computador reagindo, e errar punir −0,05. O valor é menor que os +0,13 do cenário sem reação do relatório 2, mas existe.\n\n### 1.9 Dez estilos e cinco níveis de habilidade (campanhas de 1 ano, clubes da D)\n\nEstilos: do melhor (aleatório, 1,040) ao pior (contra-ataque, 0,941): amplitude 0,10 ppg (3,8 pontos por temporada; relatório 2: 0,09). Níveis de habilidade: aleatório 1,169, passivo 1,169, intuitivo 1,167, estudioso 1,055, expert 1,184. Ou seja, o nível de habilidade tático ainda não aparece (0,015 ppg do passivo ao expert, dentro do erro). O \"estudioso\" cai porque usa 4-2-3-1, uma das duas piores formações. Confirmada a conclusão do relatório 2: **escolha tática sozinha não decide a campanha**.\n\n### 1.10 Caos, previsibilidade e economia (90 mil jogos, 18 mundos-ano)\n\n- Gols por jogo: A 2,76, B 2,39, C 1,99, D 1,84 (total 2,28). Antes: 2,80 / 2,76 / 2,72 / 2,59 (2,74). **Os gols caíram bastante nas divisões baixas.** 0×0 foi de 6,8% para 11,3%; 7 gols ou mais de 2,2% para 1,0%; goleadas de 4+ gols 3,0% (igual).\n- A queda vem da finalização: equipes iguais de prestígio 15 convertem 8,8% dos chutes em gol, as de prestígio 90 convertem 11,8%, com o mesmo número de chutes (21).\n- Mandante 40,2% / empate 25,7% / visitante 34,0% (antes 40 / 24 / 36).\n- Chance de vitória por diferença de força: a curva é suave como antes (diferença +8: 73% casa, 19% empate, 8% fora).\n- Série A: ρ(força, posição final) 0,77 (antes 0,87), campeão era o mais forte em 41% (antes 38%), top 3 em 67% (antes 74%). **Campeões em 54 temporadas: Corinthians 14, Flamengo 12, Vasco 8, São Paulo 6, Palmeiras 4, Cruzeiro 3, Vitória 3, Grêmio 2, Atlético-MG 1, Internacional 1** (10 clubes; antes 8 em 120 e Corinthians 35%; agora 26%). Melhor, mas Corinthians e Flamengo ainda ganham 48%.\n- Séries B / C / D: ρ 0,86 / 0,64 / 0,88; campeão da B é o mais forte em 74% das vezes (muito previsível), na C 46%, na D 39%.\n- Lotação média A / B / C / D: 61% / 45% / 34% / 25% (antes 58 / 49 / 36 / 25). Jogos lotados na A: 7%.\n- Resultado anual médio (R$ mil): A +3.484, B +1.125, C +474, D +146 (antes +4.490 / +1.406 / +542 / +172). Caixa médio ao fim de 6 anos: A 20 mi, B 6,6 mi, C 2,4 mi, D 0,9 mi. O caixa da A acumula menos que no relatório 2 (20 mi em 6 anos; lá 34 mi em 10 anos, horizontes diferentes, então só indica a direção).\n- Mundo de 25 anos sem humano: força dos 14 melhores estável (A 72 a 75, D 47,5 a 50,4), B sobe de 62 para 66 e C de 55 para 61 ao longo dos 25 anos (leve inflação nas divisões do meio). Idade média 25 a 29.\n\n### 1.11 Copa do Brasil (nivelada, 600 confrontos por linha)\n\n| Confronto | Liga: forte vence | Copa: forte vence | Antes (Copa) |\n|---|---|---|---|\n| 80 × 80 | 36% | 38% | 39% |\n| 70 × 40 | 80% | 63% | 57% |\n| 90 × 30 | 98% | 81% | 73% |\n| 60 × 20 | 87% | 69% | 65% |\n\nA Copa continua mais aberta que a liga, mas menos que antes: o favorito agora vence 81% (era 73%) no 90 × 30. A outra thread relata favorito avançando em 96% nos 85 × 15, coerente.\n\n---\n\n## 2. Testes novos do passo 9\n\n### 2.1 Compra de reforços por clube da D (a pergunta do KK)\n\nMundos novos (3 a 6), 10 clubes sorteáveis da D como compradores, 4-3-3 equilibrado, adversários de D e de B, 2.520 a 840 jogos por linha, mesmas sementes antes e depois. O reforço é o titular de uma posição de um clube da divisão de origem (um bom titular: terço superior entre os melhores de cada clube).\n\n**Resumo por origem (média das 10 posições):**\n\n| Origem do reforço | Ganho de média do clube | Preço médio pedido | Δ ppg contra D | Δ ppg contra B |\n|---|---|---|---|---|\n| Série D | +3,7 | R$ 51 mil | +0,04 | +0,03 |\n| Série C | +9,7 | R$ 115 mil | +0,08 | +0,03 |\n| Série B | +17,2 | R$ 363 mil | +0,15 | +0,05 |\n| Série A | +29,3 | R$ 2,26 mi | +0,25 | +0,08 |\n\nCaixa médio dos compradores: R$ 444 mil. Uma só contratação da B quase sempre cabe; do A nunca.\n\n**Por posição (Δ ppg contra a D, reforço da Série B):** Goleiro +0,21, Centroavante +0,27, Meia ofensivo (MEI) +0,21, Meia central +0,18, Ponta direita +0,14, Ponta esquerda +0,12, Lateral esquerdo +0,14, Lateral direito +0,10, Zagueiro +0,09, Volante +0,06. Os mais rentáveis por real são centroavante, ponta e meia (custam R$ 70 a 130 mil na B), e o goleiro é o único defensivo que rende. Zagueiro e volante rendem pouco e custam o dobro ou mais.\n\n**Por característica (reforço da B, Δ ppg contra a D):**\n\n| Posição | Melhor média | Finalização | Ritmo | Físico | Drible | Passe | Defesa |\n|---|---|---|---|---|---|---|---|\n| Centroavante | +0,23 | +0,26 | +0,15 | +0,20 | +0,25 | +0,20 | — |\n| Meia ofensivo | +0,28 | +0,28 | +0,37 | — | +0,23 | +0,38 | — |\n| Zagueiro | +0,20 | — | — | +0,18 | — | +0,20 | +0,23 |\n| Goleiro | +0,20 | — | — | — | — | +0,27 | **+0,37** |\n\nEscolher pelo atributo certo vale mais que pela média: goleiro com Defesa alta rende +0,37 (contra +0,20 de um goleiro de média parecida), meia com Passe +0,38 e centroavante com Finalização +0,26. Contra adversários da B os ganhos caem para um quarto (D vs B é salto grande).\n\n**Pacotes (Δ ppg contra D / contra B):**\n\n| Pacote | Série C | Série B | Série A | Custo B |\n|---|---|---|---|---|\n| 1 centroavante | +0,07 / +0,02 | +0,19 / +0,07 | +0,21 / +0,12 | R$ 109 mil |\n| 3 (CA, MEI, ZAG) | +0,26 / +0,12 | +0,39 / +0,17 | +0,73 / +0,33 | R$ 908 mil |\n| 6 (CA, PD, MEI, VOL, ZAG, GOL) | +0,61 / +0,25 | +0,94 / +0,50 | +1,39 / +0,93 | R$ 2,0 mi |\n| 10 (um por posição) | +1,01 / +0,43 | +1,45 / +0,90 | +1,81 / +2,10 | R$ 3,6 mi |\n\nSeis reforços da B dão +0,94 ppg contra os da D: um time que era de meio de tabela passa a campeão. Os ganhos somam quase linearmente.\n\n**Leitura:** um centroavante da B para um clube da D já se paga em pontos, mas não \"quebra\" o jogo (+0,2 ppg, 8 pontos por temporada). O problema é o conjunto: o preço baixo permite comprar vários, e o ganho soma.\n\n### 2.2 Campanhas de técnico-robô com mercado e treino (8 anos, 10 clubes da D no mesmo mundo, estratégias em rodízio, 30 campanhas por linha)\n\nO robô compra até 3 jogadores por janela (início da temporada e rodada 20) com 60% do caixa, escolhe o maior ganho de média por posição, contrata livres melhores que o titular, renova os 20 melhores, e treina como o técnico do computador (perfil do computador aplicado ao humano). Sempre 4-3-3 equilibrado. Clubes: os 10 piores da D (prestígio 8 a 20).\n\n| Estratégia | Força dos 14 melhores (início → fim) | ppg no 1º ano | Chegou à C / B / A | Caixa final | Compras |\n|---|---|---|---|---|---|\n| Passivo (não faz nada) | 45,4 → 39,3 | 0,79 | 0% / 0% / 0% | R$ 591 mil | 0 |\n| Só treina (Formador) | 45,4 → 43,1 | 0,80 | 3% / 0% / 0% | R$ 545 mil | 0 |\n| Só treina (Professor) | 45,4 → 41,2 | 0,87 | 0% / 0% / 0% | R$ 589 mil | 0 |\n| Só livres | 45,4 → 46,3 | 1,27 | 40% / 7% / 0% | R$ 830 mil | 9,6 livres |\n| Livres + treino Formador | 45,4 → 48,5 | 1,19 | 47% / 3% / 0% | R$ 607 mil | 8,1 |\n| Compra (sem livres) | 45,4 → 44,3 | 1,33 | 23% / 7% / 0% | R$ 154 mil | 12,4 |\n| Compra + livres | 45,4 → 46,9 | 1,24 | 27% / 10% / 0% | R$ 146 mil | 15,6 |\n| Compra + livres + treino Ofensivista | 45,4 → 46,7 | 1,27 | 30% / 3% / 0% | R$ 93 mil | 14,8 |\n| Compra + livres + treino Retranqueiro | 45,4 → 48,6 | 1,32 | 53% / 13% / 0% | R$ 169 mil | 15,5 |\n| **Compra + livres + treino Formador** | 45,4 → **55,3** | **1,73** | **93% / 60% / 0%** | R$ 361 mil | 19,5 |\n\nSéries B e C (10 clubes do meio da tabela, 6 anos, 30 campanhas por linha): passivo 1,15 ppg, chega à A em **3%**; compra + livres + treino Formador, 1,96 ppg e chega à A em **67%** (à B em 100%), gastando R$ 9,3 mi.\n\nLeituras:\n\n- **O jogador passivo perde força todo ano** (45,4 → 39,3 em 8 anos, −6): sem repor, o elenco envelhece e o mercado de contratos esvazia o time. Mesmo \"só treinar\" ajuda só um pouco (+4).\n- **Livres são quase de graça** (R$ 14 mil de luvas em média) e dão 40% de chance de sair da D. Isso é um achado: os 40 livres do mercado são de nível D a B (36 a 56) e o humano pode contratar quantos quiser.\n- A combinação que decide é comprar + treinar jovens. Sozinha, nenhuma das duas alavancas leva à Série B. Juntas levam 60% dos clubes à B e todos os clubes da B à A. Os 3 treinos de personalidade (ofensivista, retranqueiro, formador) não têm o mesmo efeito: o Formador, que treina quem tem até 23 anos e inclui o banco, vale muito mais.\n- Nenhuma campanha chegou à Série A saindo da D em 8 anos (0%): o teto da progressão para quem começa na D é a Série B, o que parece saudável (a Libertadores fica distante), mas o caminho C→B→A abre rápido para quem tem dinheiro.\n- Resposta à pergunta \"isso faz diferença?\": faz **muito**. Em termos de ppg, o conjunto do mercado vale +0,9 (D) e +0,8 (B/C), mais do que qualquer escolha tática (0,1), moral (0,6 no extremo) ou atributo isolado.\n\n### 2.3 E se o computador comprasse? (mundo sem humano, 3 mundos × 8 anos por política)\n\nO jogo hoje **não** faz isso (o computador só compra jogadores que o humano coloca à venda ou leiloa; `transferir` é chamado só em venda/leilão/compra do humano). Implementei no teste uma política de compra para todos os clubes do computador (duas janelas por ano, até 35% do caixa livre, 2 compras por janela, ganho mínimo de 5 pontos de média no slot).\n\n| Política | Compras por temporada | ρ força×posição (A / B / C / D) | Campeões da A em 24 temporadas | Força A / B / C / D no ano 8 | Caixa D no ano 8 | Clubes com caixa negativo |\n|---|---|---|---|---|---|---|\n| Nenhuma (como hoje) | 0 | 0,83 / 0,86 / 0,60 / 0,88 | 6 clubes (Corinthians 8) | 72,2 / 61,9 / 55,8 / 48,6 | R$ 1,04 mi | 0,7 |\n| Ambiciosa (qualquer divisão) | 187 | 0,77 / 0,82 / 0,62 / 0,88 | 7 (Corinthians 10) | 72,6 / 64,2 / 57,8 / 49,7 | R$ 0,58 mi | 1,3 |\n| Só mesmo nível ou abaixo | 192 | 0,77 / 0,80 / 0,59 / 0,83 | 8 (Corinthians 10) | 72,9 / 63,7 / 56,9 / 48,8 | R$ 1,02 mi | 0,7 |\n\nFluxo na política ambiciosa: 608 jogadores da A foram para a B, 241 da B para a D, 400 da B para a C, 298 da C para a D, 216 da B para a A. Ou seja, clubes pequenos de fato compram \"acima do peso\" (a pedido do KK), mas o efeito sobre o equilíbrio é pequeno: a Série A fica um pouco menos previsível, as divisões de baixo sobem 1 a 2 pontos de força, o caixa da D cai 45% (política ambiciosa) e a quantidade de clubes quebrados quase dobra (de 0,7 para 1,3). A política \"mesmo nível ou abaixo\" dá o mesmo ganho de equilíbrio sem quebrar o caixa. **Recomendo esta.**\n\n### 2.4 Técnicos do computador (6 personalidades, 4 mundos × 8 anos, resíduo de pontos por temporada ajustado por força e divisão)\n\n| Personalidade | Resíduo de pontos | ±EP |\n|---|---|---|\n| Professor | +1,13 | 0,43 |\n| Estrategista | +0,21 | 0,43 |\n| Formador | +0,07 | 0,39 |\n| Ofensivista | +0,03 | 0,52 |\n| Preparador físico | −0,35 | 0,47 |\n| Retranqueiro | −1,44 | 0,46 |\n\nAmplitude de 2,6 pontos por temporada: personalidade muda o jeito do clube, não o título. Para comparar com a outra thread (Estrategista +1,7, Retranqueiro +0,1), meus números divergem em ordem de grandeza (as duas amostras têm erro de ~0,4), então vale ver como incerteza. O computador mantém em média 60 jogadores treinando ao mesmo tempo no mundo (0,75 por clube).\n\n### 2.5 Interface (navegador Chromium, 12 partidas jogadas pela tela)\n\nFluxo completo: tela inicial → configuração → sorteio → \"Ver plantel\" → mercado (filtros por origem e média, \"só o que cabe no caixa\") → compra de um zagueiro da Série C pela tela → mercado de livres → escalação (3-5-2 ofensivo chega ao motor) → treino (escolha de jogos e tipo, ganho estimado exibido) → 12 jogos pela tela com pausa, \"pular para o fim\", resumo e \"continuar\".\n\n- Erros de JavaScript no console: **zero**.\n- Compra pela tela altera elenco (+1) e caixa (−R$ 230 mil neste caso) exatamente como esperado.\n- Observações: a aba Finanças diz \"o preço do ingresso é fixo\" e não permite ajuste; a aba Escalação mostra capitão e batedores (automático por padrão), sinergia e o texto \"No jogo: controle do meio −1%\"; o mercado lista na primeira linha estrelas da Série A que o clube não tem como pagar (ordem padrão por média, podia ser por \"cabe no caixa\").\n- Em uma execução anterior, a partida não terminou por 5 minutos porque o computador estava sobrecarregado (várias simulações no mesmo núcleo); com carga normal cada jogo leva ~3 s.\n\n### 2.6 Preço do ingresso e lotação\n\nO ingresso agora é fixo (média da divisão), de modo que a exploração do piso de 3% sumiu. Mesmo assim, medi no motor:\n\n| Divisão | Lotação no preço padrão | Preço que maximiza a renda | Renda ótima / padrão | Piso de 3% ativo |\n|---|---|---|---|---|\n| A | 61% | R$ 10 (padrão 15) | 1,12 | 0 de 20 clubes |\n| B | 44% | R$ 5 (padrão 9) | 1,16 | 0 |\n| C | 32% | R$ 3 (padrão 6) | 1,21 | 0 |\n| D | 25% | R$ 2 (padrão 4) | 1,20 | 0 |\n\nSe o preço voltar a ser ajustável: a elasticidade (−1,3) faz o preço ótimo ser o mínimo até o estádio quase lotar, então a regra é sempre \"baixe o preço até encher\" e a renda ótima fica 12 a 21% acima do padrão. Fatores de lotação para um clube da B: forma −1 → ×0,65; forma +1 → ×1,35; clássico → ×1,25; preço +25% → ×0,75; preço −25% → ×1,45. A mensagem \"ampliar o estádio não traz público novo\" aparece em clubes que não lotam.\n\n### 2.7 Sinergia e atributos com elencos montados à mão (10 clubes da D, 3 anos, mesma média, 5 estilos em rodízio, 20 temporadas-clube por estilo no 1º ano)\n\n| Elenco e tática | ppg 1º ano | ppg em 3 anos | Posição média | Fase média da Copa |\n|---|---|---|---|---|\n| 1 Controle (sem modificar, 4-4-2 equilibrado) | 0,91 | 0,77 | 15,8 | 0,30 |\n| **2 Ataque técnico (Fin/Drib/Ritmo +14 em atacantes e meias, 4-3-3 ofensivo)** | **1,42** | **1,05** | **9,0** | **0,50** |\n| 3 Muralha (Def/Fís +14 em defesa, goleiro e volantes, 4-5-1 defensivo) | 0,83 | 0,76 | 17,4 | 0,23 |\n| 4 Passadores (Passe/Drible +14 em meias, laterais, zagueiros e goleiro, 4-2-3-1) | 1,09 | 0,90 | 13,9 | 0,40 |\n| 5 Desencontro (ataque técnico jogando 4-5-1 defensivo) | 1,17 | 0,85 | 13,2 | 0,37 |\n\nTudo com o mesmo overall. **Montar um time de ataque técnico vale +0,5 ppg (≈ 19 pontos por temporada, 6 posições na tabela). Montar uma muralha vale 0 (−0,08).** O desencontro (ataque técnico com tática defensiva) ainda ganha de controle, ou seja, o atributo pesa mais que a combinação com a tática, o que torna a sinergia (±8%) quase irrelevante frente ao perfil dos jogadores. Isso é bom para quem escolhe jogadores, mas deixa ofensivos muito mais valiosos que defensivos.\n\n### 2.8 Copa do Brasil com humano\n\n- Os confrontos de ida e volta e a \"nivelação\" funcionam como no relatório 2.\n- **Pênaltis na decisão do confronto** (`penaltis(rng)` no motor): 5 cobranças de 76% para cada lado, mais morte súbita, **sem usar jogador nenhum**. Em 20.000 confrontos empatados no agregado, o time \"forte\" avançou em **50,1%**. Não há influência de goleiro, batedor, stamina, moral ou escolha do técnico. A escolha do batedor que aparece na partida só existe para pênaltis durante o jogo.\n- Em um mundo de 8 clubes humanos, a profundidade na Copa acompanhou a força do elenco (tabela 2.7: fase média 0,23 a 0,50).\n\n### 2.9 Multiplayer e determinismo (2 anos, 1, 4 e 8 técnicos humanos, mesmo conjunto de decisões)\n\n| Humanos | ao vivo × ao vivo | ao vivo × passo a passo (como a tela) | ao vivo × simulação rápida | outra semente | Jogos com humano | Entre dois humanos |\n|---|---|---|---|---|---|---|\n| 1 | idêntico | idêntico | idêntico | diferente | 80 | 0 |\n| 4 | idêntico | idêntico | idêntico | diferente | 302 | 24 |\n| 8 | idêntico | idêntico | idêntico | diferente | 534 | 116 |\n\nCom 10 humanos na D: 40 jogos entre dois humanos observados, cada um com a formação e a tática escolhidas independentemente. Sem divergência.\n\n### 2.10 Séries B e C com humano\n\nVer 2.2 (segunda tabela). Os clubes do meio da tabela da B e C começam com ppg ~1,15 passivo e 1,96 com mercado + treino. Resultado: com dinheiro (R$ 2 a 7 mi) as Séries B e C são muito mais fáceis de dominar que a D. Clubes B (Ceará, Goiás, Bragantino, Figueirense, Atlético-GO) e C (Londrina, Mogi Mirim, Volta Redonda, Confiança, Operário-MS) foram os usados.\n\n---\n\n## 3. Conferência das medições da outra thread\n\n| Afirmação (04-medicoes) | Minha medição | Bate? |\n|---|---|---|\n| Atributos: ganhos de saldo por atributo +12 (Rit +0,25, Fin +0,45, Pas +0,37, Dri +0,32, Def +0,26, Fís +0,21) | +10 nos 11: Fin +0,32, Pas +0,30, Def +0,30, Rit +0,25, Dri +0,25, Fís +0,13 (ppg, não saldo) | Sim, mesma ordem |\n| Gols por jogo 2,67 (clubes de prestígio 40 a 90) | 2,28 na liga completa (D 1,84) | Parcial: a média da liga é menor por causa das divisões baixas |\n| Centroavante no gol 2,58 | 2,63 | Sim |\n| Série A ρ 0,72, 7 campeões em 12 temporadas | ρ 0,77, 10 clubes em 54 temporadas | Sim (amostra diferente) |\n| Sinergia entre −0,7% e 0,0% | −0,23% / 0,00% / +0,02% | Sim |\n| Lotação 61/45/34/25 | idem | Sim |\n| Copa favorito avança 96% (85×15) | forte vence 81% (90×30 em jogo único) | Coerente |\n| Inflação de Finalização ≥ 90 maior (33 contra 16) | Não medi atributo por atributo. A força dos 14 melhores em 25 anos ficou estável (A 72 a 75) | Não verificado |\n| Efeito de personalidades de técnico (Estrategista +1,7 etc.) | Professor +1,1, Retranqueiro −1,4, resto ~0 (EP ±0,45) | Ordem de grandeza igual, ranking diferente |\n\n---\n\n## 4. Propostas de melhoria (para discutir)\n\nOrdem por impacto percebido pelo jogador.\n\n1. **Calibrar o mercado.** Hoje mercado + livres + treino de jovens valem +0,8 a +0,9 ppg, mais que todo o resto. Opções, em ordem de risco: (a) preço pedido subir com a média (hoje R$ 102 mil por um centroavante de 56 na B, com caixa de R$ 440 mil); (b) limitar compras por janela (por exemplo 2) e janelas fechadas fora de datas; (c) contrato de livres com salário proporcional à média (hoje luvas ≈ R$ 14 mil); (d) limite de gasto proporcional à receita anual. Meta: uma campanha ativa na D sobe uma divisão em ~3 anos, não em 1.\n2. **Livres melhores só com custo real.** Os 40 livres são de nível D a B e quase de graça. Ou reduzir o nível, ou exigir salário mensal que pese na folha.\n3. **Pênaltis da Copa com jogadores.** Usar finalização do batedor, defesa do goleiro e stamina, e deixar o humano escolher a ordem dos 5 batedores (a tela já tem o componente). Hoje é uma moeda.\n4. **Computador comprando e vendendo entre si**, com a política \"mesmo nível ou abaixo\" (mais equilíbrio na A sem esvaziar o caixa da D). Se quiser também que clubes da D comprem da B (o exemplo do KK), precisa de um teto de gasto por temporada, senão o caixa da D cai 45%.\n5. **Recalibrar o overall (Média) contra o efeito real dos atributos.** Físico vale menos no jogo do que no overall (time de Físico +12 rende −0,15) e defesa/físico de defensores rende pouco por ponto. Hoje um elenco de ataque técnico vale +0,5 ppg sobre um de mesmo overall e o de defesa 0. Ajustar PESOS para que os dois caminhos tenham retorno parecido (mais retorno para zagueiros e laterais).\n6. **Formação 3-4-3 dominante.** Reduzir seu modificador (FORM_MOD) e elevar 3-5-2 e 4-2-3-1, que ficam 0,12 ppg atrás, para que a escolha de formação tenha custo e benefício reais. Revisar também \"contra\", a pior tática em todas as formações.\n7. **Gols nas divisões baixas.** A D marca 1,84 por jogo e tem 15% de 0×0 em clubes de prestígio 15. Subir a conversão de chutes de times fracos (por exemplo, base de conversão com piso maior) ou diminuir a vantagem do goleiro na D.\n8. **A Série B é decidida pela força inicial** (campeão = mais forte em 74%). Aplicar na B a mesma compressão aplicada à A.\n9. **Espiral de moral em times de baixo.** A espiral continua no terço de baixo da tabela (moral do técnico 33 → 11 na D). O computador não tem a conversa/prêmio do humano, então a desvantagem é estrutural para o computador; um piso de moral por fase ajudaria a manter clubes de baixo competitivos.\n10. **Troca por cansaço ainda vale pouco** (+0,03 ppg no melhor caso). Ampliar o ganho das pernas frescas ou o custo da fadiga acumulada para o humano sentir valor na substituição.\n11. **Ordenação do mercado** por padrão: \"cabe no caixa\" ligado ou ordenar por custo-benefício. Hoje a primeira tela só mostra estrelas inalcançáveis.\n12. **Física de Físico**: já que Físico agora reduz lesões e cansaço, mostrar na ficha o efeito (por exemplo, \"risco de lesão ×0,7\").\n\n## 5. O que ainda não foi testado\n\n- Inflação de atributos individual (Finalização ≥ 90) por 13 anos, como reporta a outra thread.\n- Humano reagindo à espiral de moral com conversa e prêmio por vitória (medir a recuperação).\n- Efeito da aposta (bicho) e das campanhas de sócios na lotação e na moral.\n- Demissão pela diretoria com técnicos humanos jogando normalmente (só foi testado com a opção desligada).\n- Leilão de jogadores do humano e propostas de compra do computador a jogadores à venda.\n- Teste de interface em tela pequena e com som.\n\n## Apêndice\n\nScripts em `scripts-03/` (Node; carregam o `index.html` da branch): `w1.js` mundo e caos, `p1.js` posições/goleiro/atributos, `s2.js` rodízio, intervalo e sinergia, `w2.js` estilos e níveis, `cup.js` Copa, `exp3/5/6/7/9.js` stamina, moral, trocas, grade e mundo longo, `t1.js` compra de reforços, `t2.js` campanhas do robô comprador/treinador (DIV=BC para B/C), `t7.js` computador comprando, `t8.js` elencos montados à mão, `t10.js` técnicos do computador, `t6.js` determinismo/multiplayer, `e_preco.js` ingresso e lotação, `pen.js` pênaltis da Copa, `ui*.js` teste de navegador (Playwright). Resultados brutos em `scripts-03/resultados/`.\n"}, {"id": "relatorios/06-medicoes-melhorias-17.md", "titulo": "Medições da Melhorias #17: pênaltis, posições, mercado, equilíbrio de formações e táticas", "md": "# Medições da Melhorias #17: pênaltis, posições, mercado, equilíbrio de formações e táticas\n\nMedidas feitas com o motor real do jogo em Node, sem a tela, antes (versão 20, publicada) e depois (esta versão, 21). \"Antes\" e \"depois\" usam as mesmas sementes sempre que possível. Os erros padrão estão ao lado dos números quando importam. Os scripts ficam na pasta `scripts-17` do projeto (`pen16.js`, `shoot16.js`, `alt16.js`, `price16.js`, `div16.js`, `eq16.js`, `eqrep.js`, `f16.js`, `tuneform.js`, `tunetat.js`, `sub16.js`, `moral16.js`, `style16.js`, `w16.js`).\n\n## 1. Pênaltis: batedor, goleiro, moral, cansaço e mando\n\nOs pênaltis do jogo e as disputas da Copa passam pelo mesmo cálculo. Considera, do batedor: finalização e bola parada, stamina e moral; do goleiro: defesa, stamina e moral. O mando entra para os dois lados: o time de casa ganha um empurrão pequeno, o de fora sofre um fator negativo maior. O peso do mando é reduzido quando a moral individual e a do time estão altas (batedor de fora com moral e time em baixa tem a pior penalidade; o goleiro de moral baixa, com time de moral baixa e jogando fora, soma os três fatores contra ele).\n\nTaxa de gol por cobrança (40 mil cobranças por linha; batedor 70 de finalização contra goleiro 70, moral 60, stamina 100, quando não dito o contrário):\n\n| Situação | Gol |\n|---|---|\n| Referência, sem mando | 76,8% |\n| Batedor em casa | 79,4% |\n| Batedor fora | 74,7% |\n| Batedor fora, moral dele e do time 20 | 71,5% |\n| Batedor fora, moral dele e do time 90 | 77,4% |\n| Batedor em casa, moral 20 / moral 90 | 76,3% / 81,9% |\n| Goleiro fora (batedor em casa), moral dele e do time 20 / 90 | 81,5% / 78,0% |\n| Goleiro em casa (batedor fora), moral 20 / 90 | 77,0% / 73,0% |\n| Finalização do batedor 40 / 70 / 95 | 72,4% / 79,5% / 84,8% |\n| Defesa do goleiro 40 / 70 / 95 | 83,6% / 79,8% / 76,1% |\n| Stamina do batedor 100 / 50 / 20 | 79,5% / 77,6% / 76,6% |\n| Stamina do goleiro 100 / 50 / 20 | 79,2% / 79,8% / 80,5% |\n| Pior cenário (batedor fraco, fora, moral 20, stamina 40 contra goleiro forte em casa) | 60,8% |\n| Melhor cenário (batedor forte em casa, moral 90, contra goleiro fraco, fora, moral 20) | 90,6% |\n\nA taxa média nos jogos continua perto de 75% a 77%. Disputa de pênaltis da Copa (3 mil disputas por linha; o time da volta joga em casa, os batedores são os 10 melhores de linha e o melhor goleiro):\n\n| Situação | Vence o mandante |\n|---|---|\n| Times iguais, moral 65 | 58,4% |\n| Visitante com moral 90 e mandante com 30 | 45,2% |\n| Visitante com moral 30 e mandante com 90 | 71,0% |\n| Visitante bem melhor (80 × 45) | 50,7% |\n| Visitante bem pior (45 × 80) | 68,5% |\n\nAntes era uma
