<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Kfoot 98</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Kfoot 98 — layout: moldura de "placar eletrônico de estádio": cabeçalho fino com passos, conteúdo em painéis planos, tabelas densas estilo Brasfoot */
:root {
  --bg: #e6ece4; --panel: #f6f8f2; --panel2: #eaf0e6; --ink: #13241a; --muted: #566a5c; --line: #c3d0c1;
  --accent: #0b6e3f; --accent-ink: #ffffff; --hot: #e8ab00; --hot-ink: #1d1500;
  --st-verde: #2fa84f; --st-vclaro: #9ccc3c; --st-amarelo: #e6c200; --st-laranja: #ec8a1c; --st-vermelho: #d63a2f;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
    --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
  --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
h3 { font-family: var(--display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* barra superior com passos */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand b { background: var(--hot); color: var(--hot-ink); padding: 0 6px; margin-left: 4px; font-weight: 400; }
.steps { display: flex; gap: 6px; margin-left: auto; list-style: none; padding: 0; margin-block: 0; flex-wrap: wrap; }
.steps li { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 3px 9px; border: 1px solid var(--line); }
.steps li.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.ok { color: var(--ink); }

/* botões */
.btn { appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 11px 22px; font-family: var(--display); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: transform .08s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.alt { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: var(--hot-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* tela 1 */
.hero { position: relative; overflow: hidden; background: #0f2f1c; color: #eef6ea; border-bottom: 4px solid var(--hot); }
.hero svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.hero .wrap { position: relative; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; padding-block: clamp(48px, 12vw, 120px); }
.logo { font-family: var(--display); line-height: .86; text-transform: uppercase; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.logo .k { font-size: clamp(88px, 22vw, 220px); letter-spacing: .01em; }
.logo .y { font-size: clamp(88px, 22vw, 220px); background: var(--hot); color: #1d1500; padding: 0 .09em; }
.hero .lead { max-width: 34ch; font-size: clamp(19px, 2.6vw, 26px); line-height: 1.3; }
.hero .btn { border-color: var(--hot); background: var(--hot); color: #1d1500; font-size: 22px; padding: 14px 30px; }
.hero small { opacity: .7; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.ticker { background: var(--panel); border-bottom: 1px solid var(--line); }
.ticker .wrap { display: flex; gap: 8px 28px; flex-wrap: wrap; padding-block: 14px; font-size: 15px; }
.ticker span b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-right: 6px; color: var(--accent); }

/* telas 2-5 */
.page { padding-block: 28px 8px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 8px; }
.head p { max-width: 70ch; color: var(--muted); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.rule { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rule b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; }
.rule span { font-size: 15px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); margin-top: 4px; align-self: flex-start; }
.seg button { appearance: none; background: transparent; border: 0; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.divs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.div { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.div > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); gap: 8px; }
.div ol { list-style: none; margin: 0; padding: 0; counter-reset: c; }
.div li { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; border-bottom: 1px dotted var(--line); font-size: 15px; counter-increment: c; }
.div li::before { content: counter(c); width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.div li .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.div li .uf { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.div li.sorteavel { background: color-mix(in srgb, var(--hot) 22%, transparent); font-weight: 600; }
.div li.bloq { color: var(--muted); }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.hot { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.slot { border: 1px dashed var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); min-width: 0; }
.slot.me { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--panel2); }
.slot label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.slot input { padding: 10px 12px; border: 2px solid var(--line); background: var(--panel); font-size: 18px; width: 100%; min-width: 0; }
.slot input:focus-visible { border-color: var(--accent); outline-offset: 0; }
.err { color: #c0322a; font-weight: 600; min-height: 1.4em; }
:root[data-theme="dark"] .err { color: #ff7a6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff7a6e; } }

.draw { background: #0f2f1c; color: #eef6ea; border: 1px solid var(--line); padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-left: 6px solid var(--hot); }
.draw .big { font-family: var(--display); font-size: clamp(34px, 8vw, 68px); line-height: 1; text-transform: uppercase; min-height: 1.1em; overflow-wrap: anywhere; }
.draw .big.rolling { opacity: .75; }

.assign { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.club { background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--hot); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.club .who { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.club .nm { font-family: var(--display); font-size: 36px; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* plantel */
.strip { display: flex; flex-wrap: wrap; gap: 6px 26px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.strip div { display: flex; flex-direction: column; min-width: 0; }
.strip small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.strip b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs span { padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); }
.tabs span.on { background: var(--accent); color: var(--accent-ink); }
.tabs span.soon::after { content: " · em breve"; font-family: var(--body); font-size: 11px; text-transform: none; letter-spacing: 0; }
.plantel { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .plantel { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; font-weight: 700; }
th.sorted { color: var(--ink); box-shadow: inset 0 -3px var(--hot); }
td.l, th.l { text-align: left; }
td.nm { font-weight: 600; position: sticky; left: 0; background: var(--panel); }
tr.sep td { background: var(--panel2); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); text-align: left; }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover td, tbody tr[data-id]:hover td.nm { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.sel td, tr.sel td.nm { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
td.pos { font-weight: 700; }
.tit { display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 6px; }
.ovr { font-weight: 800; }
.hi { color: var(--accent); font-weight: 700; }
.lo { color: var(--muted); }
.bar { display: inline-block; width: 56px; height: 9px; background: var(--line); vertical-align: middle; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; }
.c-verde { background: var(--st-verde); } .c-verde-claro { background: var(--st-vclaro); } .c-amarelo { background: var(--st-amarelo); } .c-laranja { background: var(--st-laranja); } .c-vermelho { background: var(--st-vermelho); }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
@media (max-width: 960px) { .panel { position: static; } }
.panel .pn { font-family: var(--display); font-size: 28px; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; }
.attr { display: grid; grid-template-columns: 38px 1fr 28px; gap: 8px; align-items: center; font-size: 14px; }
.attr .bar { width: 100%; height: 10px; }
.attr .bar i { background: var(--accent); }
.attr b { text-align: right; }
.fit { display: flex; gap: 6px; flex-wrap: wrap; }
.fit span { border: 1px solid var(--line); padding: 2px 8px; font-size: 14px; }
.fit span b { margin-left: 4px; }
.footnote { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* ---------- tooltip ---------- */
.tooltip { position: fixed; z-index: 50; display: none; max-width: 260px; padding: 8px 10px; background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1.35; pointer-events: none; font-weight: 400; text-transform: none; letter-spacing: 0; box-shadow: 0 4px 14px rgb(0 0 0 / .3); }
[data-tip] { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
th[data-tip] { text-decoration: none; }

/* ---------- casa do jogo: cabeçalho, status, abas ---------- */
.gamehead { display: flex; gap: 16px 28px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.gamehead .head { min-width: 0; flex: 1 1 260px; }
.status { flex: 0 1 460px; min-width: min(100%, 300px); background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--hot); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 15px; }
.srow small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.srow > span, .srow > b { display: flex; flex-direction: column; min-width: 0; }
.srow small.muted { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
.ult { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.rl small { font-size: 12px; }
i.res { font-style: normal; font-weight: 800; width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 12px; color: #fff; flex: none; align-self: center; }
i.res.rV { background: var(--st-verde); } i.res.rE { background: #7d8a80; } i.res.rD { background: var(--st-vermelho); }
.status .btn { align-self: flex-start; font-size: 16px; padding: 8px 18px; }
.tabbtn { appearance: none; border: 0; background: transparent; padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); cursor: pointer; }
.tabbtn:hover { color: var(--ink); }
.tabbtn.on { background: var(--accent); color: var(--accent-ink); }
.tabs .soon { padding: 7px 16px; }
.btn.sm { font-size: 15px; padding: 7px 14px; }

/* plantel */
.plantelwrap { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.barpct { display: inline-flex; align-items: center; gap: 8px; }
.barpct b { font-size: 14px; min-width: 3.2ch; text-align: right; }
.bar.mini { width: 100%; height: 5px; display: block; }
.bad { color: #c0322a; font-weight: 700; } .warn { color: #a56d00; font-weight: 700; }
:root[data-theme="dark"] .bad { color: #ff7a6e; } :root[data-theme="dark"] .warn { color: var(--hot); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bad { color: #ff7a6e; } :root:not([data-theme="light"]) .warn { color: var(--hot); } }
.panel .media { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.panel .media b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.attrn { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 0; }
.attrn span { font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.attrn b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.meters { display: flex; flex-direction: column; gap: 8px; }
.meters > div { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.meters .bar { width: 100%; flex: 1; }
.meters .barpct { width: 100%; }
.meters .barpct .bar { width: auto; flex: 1; }

/* ---------- tabela ---------- */
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.subtabs .tabbtn { border: 1px solid var(--line); font-size: 15px; padding: 5px 14px; }
.subtabs .tabbtn.on { border-color: var(--accent); }
.ligabox { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .ligabox { grid-template-columns: minmax(0, 1fr); } }
table.liga td.z { color: var(--muted); font-size: 13px; width: 2.4em; }
table.liga tr.z-sobe td.z { box-shadow: inset 4px 0 var(--st-verde); }
table.liga tr.z-desce td.z { box-shadow: inset 4px 0 var(--st-vermelho); }
table.liga tr.meu td, table.liga tr.meu td.nm { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
.rodadas { display: flex; flex-direction: column; gap: 12px; }
.rodada, .jdiv { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.rodada h3, .jdiv h3 { font-size: 16px; margin-bottom: 6px; }
.rodada ul, .jdiv ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rodada li, .jdiv li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); font-size: 14px; align-items: baseline; }
.rodada .tc, .jdiv .tc { text-align: right; overflow-wrap: anywhere; } .rodada .tf, .jdiv .tf { overflow-wrap: anywhere; }
.pl { text-align: center; min-width: 3.6em; }
li.meu { background: color-mix(in srgb, var(--hot) 28%, transparent); font-weight: 700; }
.sw { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; } .sw.sobe { background: var(--st-verde); } .sw.desce { background: var(--st-vermelho); }
.ligalado { display: flex; flex-direction: column; gap: 10px; }
.campeao { font-size: 18px; }
.faseCopa { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
table.copa tr.meu td { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
td.venc { font-weight: 800; color: var(--accent); }

/* ---------- escalação ---------- */
.escwrap { display: flex; flex-direction: column; gap: 12px; }
.esccontrols { display: flex; gap: 14px 28px; flex-wrap: wrap; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.esccontrols > div { display: flex; flex-direction: column; gap: 4px; }
.esccontrols .seg { margin-top: 0; }
.escmsg { min-height: 1.4em; color: var(--muted); }
.escgrid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .escgrid { grid-template-columns: minmax(0, 1fr); } }
.campocol { display: flex; flex-direction: column; gap: 6px; }
.campo { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 82vh; background: repeating-linear-gradient(180deg, #1f6b3a 0 12.5%, #1b6035 12.5% 25%); color: rgb(255 255 255 / .55); border: 2px solid #0f3a21; }
.campo .linhas { position: absolute; inset: 0; }
.chip { position: absolute; transform: translate(-50%, -50%); width: 19.5%; min-width: 62px; background: #f5f8f1; color: #13241a; border: 2px solid #13241a; padding: 3px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; text-align: center; line-height: 1.1; font-size: 13px; }
.chip .cs { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #0b6e3f; } .chip .cs em { font-style: normal; color: #b45309; }
.chip b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cv { font-size: 12px; font-variant-numeric: tabular-nums; color: #3c4d41; }
.chip.fora { border-color: #d9780f; background: #fff3e2; }
.chip.sel { outline: 3px solid var(--hot); outline-offset: 1px; background: #fff6cc; }
.chip .bar { background: #c3d0c1; }
.lista { max-height: 82vh; overflow: auto; }
.lista tbody tr { cursor: pointer; }
.lista tbody tr:hover td { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.tit-row td { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
tr.indisp td { opacity: .55; }

/* ---------- jogo ao vivo ---------- */

.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; max-height: 360px; overflow: auto; }

.etag { font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 1px 6px; flex: none; background: var(--panel2); border: 1px solid var(--line); }
.etag.gol { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .etag.am { background: #f2c200; color: #1d1500; border-color: #f2c200; } .etag.vm { background: var(--st-vermelho); color: #fff; border-color: var(--st-vermelho); } .etag.les { background: var(--st-laranja); color: #1d1000; border-color: var(--st-laranja); }
.ev.gol { font-weight: 700; }
.joutros { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.jtit { font-size: 18px; }

@keyframes flash { 0% { background: var(--hot); color: var(--hot-ink); } 100% { background: transparent; } }
.subpanel { border: 2px solid var(--hot); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--panel2); }
.subtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.subtop .seg { margin-top: 0; }

i.cartao { display: inline-block; width: 9px; height: 13px; margin-left: 5px; vertical-align: middle; } i.cartao.am { background: #f2c200; } i.cartao.vm { background: var(--st-vermelho); }

/* ---------- resumo ---------- */
.resgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

.strow2 span:first-child { text-align: right; font-weight: 700; } .strow2 span:last-child { font-weight: 700; } .strow2 small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; text-align: center; }
.copainfo { font-size: 18px; }
.nota { display: inline-block; min-width: 3.2em; padding: 1px 6px; font-weight: 800; color: #fff; }
.nota.n-alta { background: #1f8a43; } .nota.n-boa { background: #5d9c2f; } .nota.n-media { background: #8a8f87; } .nota.n-baixa { background: #c0392b; }

/* ======== rodada 3: cores dos clubes, bandeiras, estrelas, ações, modais, moral do técnico ======== */
.escudo { display: inline-block; width: 14px; height: 14px; border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); flex: none; vertical-align: -2px; border-radius: 3px 3px 7px 7px; }

.panel .pn { display: flex; align-items: center; flex-wrap: wrap; }

.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid var(--line); padding-top: 12px; }

.kv .venda, td.venda { color: #8a5a00; font-weight: 700; } :root[data-theme="dark"] .kv .venda, :root[data-theme="dark"] td.venda { color: var(--hot); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kv .venda, :root:not([data-theme="light"]) td.venda { color: var(--hot); } }
td.treino, .kv .treino { color: var(--accent); font-weight: 700; }
.noticias { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--hot); padding: 8px 14px; }
.noticias h3 { font-size: 15px; margin-bottom: 4px; }
.noticias ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.noticias li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }

.rodape { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-end; }
.rodape > .footnote { flex: 1 1 280px; align-self: flex-start; }
.moraltec { flex: 0 1 380px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: min(100%, 300px); }
.mt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.mt-chart svg { width: 100%; height: auto; display: block; overflow: visible; }

.mt-chart .t { fill: var(--muted); font-size: 11px; font-family: var(--body); font-variant-numeric: tabular-nums; }

.mt-chart .r { font-size: 12px; font-weight: 800; font-family: var(--body); } .mt-chart .rV { fill: var(--accent); } .mt-chart .rD { fill: #c0392b; } .mt-chart .rE { fill: var(--muted); }
:root[data-theme="dark"] .mt-chart .rD { fill: #ff7a6e; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mt-chart .rD { fill: #ff7a6e; } }

/* janela modal */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgb(5 18 10 / .6); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; overflow: auto; }

.modal header h3 { font-size: 22px; overflow-wrap: anywhere; }
.modal .x { appearance: none; background: transparent; border: 0; font-size: 30px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 6px; }
.mbody { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* escalação: cartões do campo */

@media (max-width: 860px) { .escgrid { grid-template-columns: minmax(0, 1fr); } .cartao-jog { min-width: 64px; } .chip .cnome { font-size: 10px; } }

/* substituições: tabela com stamina e moral */

/* ======== rodada 4: emblemas, cores do clube no plantel, visão de clube, jogo ======== */
.escudo { width: 22px; height: 23px; border: 0; border-radius: 0; background: none !important; display: inline-flex; vertical-align: middle; flex: none; line-height: 0; }

/* jogo */

/* ======== melhorias 5: bingo, multi técnicos, finanças, resumo clicável ======== */
.strip .sub { font-size: 13px; color: var(--muted); font-weight: 400; display: block; }

// Gerador pseudo-aleatório com semente (mulberry32): mesma semente = mesmo campeonato.
// Essencial para o multiplayer: servidor e clientes chegam aos mesmos resultados.
(function (root) {
  function create(seed) {

    '4-4-2': ['GOL', 'LD', 'ZAG', 'ZAG', 'LE', 'VOL', 'MC', 'ALA', 'ALA', 'CA', 'SA'],
    '4-5-1': ['GOL', 'LD', 'ZAG', 'ZAG', 'LE', 'VOL', 'VOL', 'MC', 'MEI', 'ALA', 'CA'],
    '3-5-2': ['GOL', 'ZAG', 'ZAG', 'LIB', 'ALA', 'VOL', 'VOL', 'MEI', 'ALA', 'CA', 'SA'],

  // efeito de cada formação sobre as forças do time (±5%); o 4-4-2 é a referência. Cada uma tem um custo: nenhuma é "melhor em tudo".
  const FORM_MOD = {
    '4-3-3': { atk: 1.023, def: 0.937, ctl: 1.016 }, '4-2-3-1': { atk: 0.965, def: 0.995, ctl: 0.986 }, '4-4-2': { atk: 1, def: 1, ctl: 0.994 },

  // Qual tática é a melhor resposta a qual (pedra-papel-tesoura, medido por simulação)
  const CONTRA = { ofensivo: ['contra'], equilibrado: ['ofensivo'], defensivo: ['ofensivo'], contra: ['defensivo', 'equilibrado'] };
  // tática: ofensivo/equilibrado/defensivo
  // Táticas (pedra-papel-tesoura, calibradas por tools/balance.js):

  const TATICA = {
    ofensivo: { atk: 1.142, def: 0.994, tempo: 1.08, faltas: 1.10, abertura: 1, fecha: 0, comp: 1, contraK: 0 },
    equilibrado: { atk: 1.0, def: 1.0, tempo: 1.0, faltas: 1.0, abertura: 0, fecha: 0, comp: 1, contraK: 0 },
    defensivo: { atk: 0.934, def: 1.036, tempo: 0.92, faltas: 1.0, abertura: -1, fecha: 0.02, comp: 0.8, contraK: 0 },
    contra: { atk: 1.009, def: 1.071, tempo: 0.88, faltas: 1.0, abertura: -0.5, fecha: 0, comp: 0.88, contraK: 0.17 },
  };
  const CFG = {
    ataquesPorMinuto: 0.56, mandante: 1.07, expoControle: 2.2,
    maxSubs: 3,            // 1998: 3 substituições (configurável para 5 no modo "moderno")
    staminaMin: 0.55,      // multiplicador de força com stamina 0 (1.00 com stamina 100); a curva é quadrática (cansado perde bem mais)
    baixoChute: 0.04, baixoAlvo: 0.02, baixoGol: 0.02,   // nível do jogo abaixo de 72: mais chances, mais chutes no gol e mais gols
    freshB: 0.15, freshD: 40, staminaExp: 2,   // bônus de quem entra, duração (min) e curvatura da perda de força com a stamina
    faltaBase: 0.125, amareloPorFalta: 0.105, vermelhoDireto: 0.0005, lesaoPorJogadorMin: 0.000062,
  };

  const mStam = (s) => CFG.staminaMin + (1 - CFG.staminaMin) * Math.pow(s / 100, CFG.staminaExp);
  const mMoral = (m) => 0.95 + 0.10 * (m / 100);
  const forca = (j) => j.base * mStam(j.p.stamina) * mMoral(j.p.moral) * (j.fresco || 1);

  // time = { nome, elenco[], formacao, tatica, titulares[ids em ordem dos slots], banco[ids], mando:boolean }
  const capNota = (j) => P().overall(j.p) + (Math.min(j.p.idade, 34) - 24) * 0.8 + (j.p.moral - 60) * 0.1;
  function montar(time, rng) {
    const slots = FORMACOES[time.formacao];

    const campo = time.titulares.map((id, i) => {
      const p = porId.get(id);

    const capAuto = campo.filter((j) => j.slot !== 'GOL').sort((x, y) => capNota(y) - capNota(x))[0];
    const capId = (campo.find((j) => j.p.id === time.capitao) || capAuto || { p: {} }).p.id;
    return { capId, time, slots, campo, banco: time.banco.map((id) => porId.get(id)), subs: 0, maxSubs: time.maxSubs || CFG.maxSubs, todos: new Map(campo.map((j) => [j.p.id, j])), gols: 0, rng };
  }
  function novo(p, slot) {
    return { p, slot, base: P().ovrNoSlot(p, slot), nota: 6.0, g: 0, ast: 0, desarmes: 0, passes: 0, defesas: 0, faltas: 0, amarelos: 0, expulso: false, lesionado: false, minutos: 0, entrou: 0, saiu: null, chutes: 0, noGol: 0, fresco: 1 };
  }

  // Sinergia: a tática e a formação rendem mais quando os jogadores certos estão nos lugares certos.
  // Mede a ESPECIALIZAÇÃO do XI (atributo do papel acima da média do próprio time), então é neutra para quem não monta nada de especial.
  const A6 = ['RIT', 'CHU', 'PAS', 'DRI', 'DEF', 'FIS'];
  // referência: sinergia média de elencos aleatórios para cada tática × formação (calculada uma vez); o que conta é o quanto o XI foge dessa média
  const SIN_BASE = {}; let SIN_CLUBES = null;
  function sinBase(tatica, formacao) {
    const k = tatica + '|' + formacao; if (SIN_BASE[k]) return SIN_BASE[k];
    if (!SIN_CLUBES) { const rng = bf.RNG.create(424242), usados = new Set(); SIN_CLUBES = Array.from({ length: 24 }, (_, i) => ({ id: 'sb' + i, elenco: P().gerarElenco(rng, { prestigio: 60, div: 'D', id: 'sb' + i }, usados) })); }
    const acc = { atk: 0, def: 0, ctl: 0 }, N = SIN_CLUBES.length;
    for (const c of SIN_CLUBES) {   // elencos reais gerados pelo jogo, escalados pela escalação automática: é isso que o computador e o técnico "médio" colocam em campo
      const t = bf.Season.escalarAuto(c, formacao, tatica, 3), s = montar(t, bf.RNG.create(1)), o = sinergiaBruta(s);

  }
  function sinergia(side) {
    const o = sinergiaBruta(side), b = sinBase(side.time.tatica, side.time.formacao), c = (x) => Math.max(-0.08, Math.min(0.08, x));
    return { atk: c(o.atk - b.atk), def: c(o.def - b.def), ctl: c(o.ctl - b.ctl) };
  }
  function sinergiaBruta(side) {
    const campo = side.campo.filter((j) => j.slot !== 'GOL'), nul = { atk: 0, def: 0, ctl: 0 };
    if (campo.length < 8) return nul;
    const mt = campo.reduce((x, j) => x + A6.reduce((y, k) => y + j.p.attr[k], 0) / 6, 0) / campo.length;
    const rel = (sl, at) => { const l = campo.filter((j) => sl.includes(j.slot)); if (!l.length) return 0; return (l.reduce((x, j) => x + at.reduce((y, k) => y + j.p.attr[k], 0) / at.length, 0) / l.length - mt) / 100; };
    const gr = (g, at) => rel(campo.filter((j) => P().GRUPO[j.slot] === g).map((j) => j.slot), at);
    const o = { atk: 0, def: 0, ctl: 0 }, K = 0.4, KF = 0.45;
    switch (side.time.tatica) {
      case 'ofensivo': o.atk += K * gr('A', ['CHU', 'DRI']); o.ctl += K * 0.5 * gr('M', ['PAS', 'DRI']); break;
      case 'defensivo': o.def += K * gr('D', ['DEF', 'FIS']); o.ctl += K * 0.3 * gr('M', ['DEF', 'FIS']); break;
      case 'contra': o.atk += K * gr('A', ['RIT', 'CHU']); o.def += K * 0.5 * gr('D', ['DEF', 'FIS']); break;
      default: o.ctl += K * 0.7 * gr('M', ['PAS', 'DRI']); o.def += K * 0.5 * gr('D', ['DEF']); o.atk += K * 0.5 * gr('A', ['CHU']);
    }
    switch (side.time.formacao) {
      case '4-3-3': o.atk += KF * rel(['PD', 'PE'], ['RIT', 'DRI']); break;                                   // pontas rápidos e driblador es
      case '4-2-3-1': o.ctl += KF * rel(['MEI'], ['PAS', 'DRI']) + 0.5 * KF * rel(['VOL'], ['DEF', 'PAS']); break;   // camisa 10 e volantes de saída
      case '4-4-2': o.atk += KF * 0.7 * rel(['CA', 'SA'], ['CHU']); o.def += KF * 0.5 * rel(['LD', 'LE'], ['DEF', 'FIS']); break;
      case '4-5-1': o.def += KF * rel(['VOL'], ['DEF', 'FIS']); o.atk += KF * 0.7 * rel(['CA'], ['CHU', 'FIS']); break;
      case '3-5-2': o.ctl += KF * rel(['ALA'], ['FIS', 'RIT']); o.def += KF * 0.7 * rel(['LIB', 'ZAG'], ['DEF']); break;   // alas que cobrem o campo todo
      case '3-4-3': o.atk += KF * rel(['PD', 'PE', 'CA'], ['CHU', 'RIT']); o.def += KF * 0.5 * rel(['ZAG', 'LIB'], ['DEF']); break;
    }
    return o;
  }

  // Ajuste de intervalo: mudanças bem pensadas no 2º tempo rendem bônus (até +5%); mudanças ruins custam.
  const ofensiv = (f) => { const sl = FORMACOES[f]; return sl.filter((x) => P().GRUPO[x] === 'A').length - 0.5 * sl.filter((x) => P().GRUPO[x] === 'D').length; };
  function leitura(m, lado) {
    const s = m.S[lado], o = m.S[1 - lado], itens = []; let b = 0;
    if (!s.h1) return { b: 0, itens };
    const oT = o.h1 ? o.h1.tatica : o.time.tatica, mudouT = s.time.tatica !== s.h1.tatica, mudouF = s.time.formacao !== s.h1.formacao, d = s.h1.dif;
    if (mudouT) {
      if ((CONTRA[oT] || []).includes(s.time.tatica)) { b += 0.03; itens.push(['bom', 'A tática ' + s.time.tatica + ' é a resposta certa ao ' + oT + ' que o adversário jogou no 1º tempo (+3%).']); }
      else if ((CONTRA[s.time.tatica] || []).includes(oT)) { b -= 0.02; itens.push(['ruim', 'O adversário (' + oT + ') anula a nova tática (−2%).']); }
      else itens.push(['neutro', 'Troca de tática sem vantagem clara sobre o ' + oT + ' do adversário.']);
    }
    if (mudouF) {
      const di = ofensiv(s.time.formacao) - ofensiv(s.h1.formacao);
      if (d < 0 && di > 0) { b += 0.02; itens.push(['bom', 'Perdendo, você avançou o time com o ' + s.time.formacao + ' (+2%).']); }
      else if (d > 0 && di < 0) { b += 0.02; itens.push(['bom', 'Ganhando, você fechou o time com o ' + s.time.formacao + ' (+2%).']); }
      else if ((d < 0 && di < 0) || (d > 0 && di > 0)) { b -= 0.015; itens.push(['ruim', d < 0 ? 'Perdendo, o ' + s.time.formacao + ' recuou o time (−1,5%).' : 'Ganhando, o ' + s.time.formacao + ' expõe o time (−1,5%).']); }
      else itens.push(['neutro', 'Mudança de formação para o ' + s.time.formacao + ' sem efeito claro no placar atual.']);
    }
    return { b: Math.max(-0.03, Math.min(0.05, b)), itens };
  }
  // O computador também lê o jogo no intervalo (acerta 60% das vezes): responde ao adversário
  function iaIntervalo(m, lado) {
    const s = m.S[lado], o = m.S[1 - lado]; if (!s.h1 || m.min !== 45) return;
    const rs = m.rng ? m.rng.next() : Math.random(), ac = s.time.iaAcerto != null ? s.time.iaAcerto : 0.6;
    if (rs < ac) { const alvo = (CONTRA[o.h1 ? o.h1.tatica : o.time.tatica] || [])[0]; if (alvo && alvo !== s.time.tatica) { s.time.tatica = alvo; } }
    recalcular(m);
  }

  function forcas(side, adv) {
    const t = TATICA[side.time.tatica], fm0 = FORM_MOD[side.time.formacao] || { atk: 1, def: 1, ctl: 1 }, sn = sinergia(side), ai = 1 + (side.ajusteInt || 0);
    const fm = { atk: fm0.atk * (1 + sn.atk) * ai, def: fm0.def * (1 + sn.def) * ai, ctl: fm0.ctl * (1 + sn.ctl) * (1 + (side.ajusteInt || 0) / 2) };
    const fd = side.formaDia === undefined ? (side.formaDia = 1 + side.rng.gauss() * 0.03) : side.formaDia; // 'dia inspirado' ±3%
    const por = { G: [], D: [], M: [], A: [] };
    side.campo.forEach((j) => por[P().GRUPO[j.slot]].push(forca(j)));
    const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 30;
    // faltando jogadores (expulsão) diminui a média de forma natural: soma/11 em vez de média
    const n = side.campo.length / 11;
    const ataque = (0.60 * avg(por.A) + 0.30 * avg(por.M) + 0.10 * avg(por.D)) * t.atk * fm.atk * n * fd;
    const defesa = (0.76 * avg(por.D) + 0.08 * avg(por.M) + 0.16 * avg(por.G)) * t.def * fm.def * n * fd;
    const controle = (0.60 * avg(por.M) + 0.20 * avg(por.A) + 0.20 * avg(por.D)) * fm.ctl * n;
    const gk = por.G.length ? por.G[0] : 20;
    const cap = side.campo.find((j) => j.p.id === side.capId), capK = cap ? 1.004 + 0.008 * Math.max(-1, Math.min(1, (cap.p.moral - 60) / 40)) : 1;
    const pas = idxPas(side), rit = idxRit(side);
    return { ataque: ataque * capK, defesa: defesa * capK, controle: controle * capK * (1 + (pas - 52) * 0.0012) * (side.time.mando ? CFG.mandante : 1), gk, t, pas, rit };
  }

  // passe: a bola só chega ao ataque se a saída de jogo for boa (goleiro, zagueiros, laterais e meias contam)
  const PASW = { G: 0.5, D: 1, M: 2, A: 0.8 }, LATERAIS = ['LD', 'LE', 'ALA', 'PD', 'PE'];
  function idxPas(side) { let s = 0, w = 0; for (const j of side.campo) { const k = PASW[P().GRUPO[j.slot]] * (LATERAIS.includes(j.slot) ? 1.3 : 1); s += j.p.attr.PAS * mStam(j.p.stamina) * k; w += k; } return w ? s / w : 50; }
  function idxRit(side) { let s = 0, w = 0; for (const j of side.campo) { if (j.slot === 'GOL') continue; const k = P().GRUPO[j.slot] === 'D' ? 0.7 : 1; s += j.p.attr.RIT * mStam(j.p.stamina) * k; w += k; } return w ? s / w : 50; }
  const GR = (j) => P().GRUPO[j.slot];
  const efM = (j) => mStam(j.p.stamina) * mMoral(j.p.moral);
  const cabDe = (j) => j.p.attr.CHU * 0.55 + j.p.attr.FIS * 0.2 + ((j.p.altura || 178) - 165) * 0.8;   // cabeceio: finalização + impulsão + altura
  const cobrNota = (j) => P().cobrDe(j.p) * efM(j);
  const gkEf = (gkj) => { if (!gkj) return 20; const v = gkj.p.attr.DEF * 0.6 * efM(gkj) + gkj.base * 0.4; return gkj.p.pos === 'GOL' ? v : v * 0.2; };   // jogador de linha no gol toma de tudo
  const kcDe = (m) => (m.nivela ? Math.max(0.3, 1 - m.nivela * 1.2) : 1);

  // uma finalização. tipo: 'bola' (jogada), 'cabeca' (cruzamento/escanteio) ou 'falta' (cobrança direta). Devolve { gol, noGol }.
  const BASE_FIN = { bola: [0.41, 0.31], cabeca: [0.385, 0.30], falta: [0.42, 0.085] };
  function chutar(m, a, atk, ass, ef, mEff, tipo, ev, min, extra) {
    const { S, rng, stats } = m, A = S[a], D = S[1 - a], gkj = D.campo.find((j) => j.slot === 'GOL'), gkE0 = gkEf(gkj), fora = gkj && gkj.p.pos !== 'GOL', [b1, b2] = BASE_FIN[tipo];
    const kc = kcDe(m), gkE = 50 + (gkE0 - 50) * kc;   // Copa do Brasil: as diferenças individuais valem menos
    ef = 50 + (ef - 50) * 1.6 * kc; mEff = 50 + (mEff - 50) * kc; // finalização pesa mais: o bom finalizador converte bem mais
    stats[a].chutes++; atk.chutes++;
    const bx = tipo === 'falta' ? 0 : (m.baixo || 0), noGol = rng.chance(P().clamp(b1 + (ef - 50) * 0.004 - (mEff - 50) * 0.0042 + CFG.baixoAlvo * bx, 0.16, 0.66));
    if (noGol) { stats[a].no_gol++; atk.noGol++; }
    const pGol = P().clamp(b2 + (ef - gkE) * 0.0032 * (fora ? 1.7 : 1) + CFG.baixoGol * bx, 0.14 - (tipo === 'falta' ? 0.10 : 0), fora ? 0.80 : 0.58);
    if (noGol && rng.chance(pGol)) {
      A.gols++; atk.g++; atk.p.gols++;
      let as = null; if (ass && ass !== atk && (tipo !== 'bola' || rng.chance(0.72))) { ass.ast++; as = ass; }
      ev(min, 'gol', a, atk, { assist: as && as.p.nome, placar: [S[0].gols, S[1].gols], cabeca: tipo === 'cabeca' || undefined, falta: tipo === 'falta' || undefined, ...extra });
      return { gol: true, noGol };
    }
    if (noGol && gkj) gkj.defesas++;
    return { gol: false, noGol };
  }
  // bola aérea na área (escanteio ou falta lateral): batedor de bom passe → mais cabeçadas; o melhor de cabeça finaliza
  function bolaAerea(m, a, tk, ev, min, origem) {
    const { S, rng } = m, A = S[a], D = S[1 - a];
    const q = tk.p.attr.PAS * efM(tk), pCab = P().clamp(0.24 + (q - 55) * 0.0045, 0.08, 0.42);
    if (!rng.chance(pCab)) return;
    const hd = sorteia(A, rng, ['A', 'D', 'M'], (j) => (j === tk ? 0 : Math.pow(Math.max(cabDe(j) * efM(j), 5), 2) * { A: 2.2, D: 1.5, M: 0.6 }[GR(j)]));
    const mk = sorteia(D, rng, ['D', 'M'], (j) => Math.pow(Math.max(cabDe(j), 5), 1.5) * (GR(j) === 'D' ? 3 : 1));
    chutar(m, a, hd, tk, cabDe(hd) * efM(hd), cabDe(mk) * efM(mk) * 0.9, 'cabeca', ev, min, { origem, cobrador: tk.p.nome });
  }
  function escanteio(m, a, ev, min) {
    const A = m.S[a]; m.stats[a].escanteios++;
    const cand = A.campo.filter((j) => j.slot !== 'GOL'); if (!cand.length) return;
    const tk = A.time.batedorEsc && cand.find((j) => j.p.id === A.time.batedorEsc) || m.rng.weighted(cand, (j) => Math.pow(j.p.attr.PAS * efM(j), 3));   // quem passa melhor bate
    bolaAerea(m, a, tk, ev, min, 'escanteio');
  }
  function cobrarFalta(m, a, ev, min) {
    const A = m.S[a], cand = A.campo;
    const tk = cand.find((j) => j.p.id === A.time.batedor) || cand.slice().sort((x, y) => cobrNota(y) - cobrNota(x))[0];
    chutar(m, a, tk, null, cobrNota(tk), 50, 'falta', ev, min);
  }
  // falta cometida: cartões (capitão acalma o time)
  function cometerFalta(m, lado, fj, min, ev, k) {
    const { S, rng, stats } = m, S1 = S[lado];
    fj.faltas++; stats[lado].faltas++;
    const calma = S1.campo.some((j) => j.p.id === S1.capId) ? 0.85 : 1;
    const pc = CFG.amareloPorFalta * k * P().DISC_CARTAO[fj.p.disciplina] * (fj.amarelos ? 0.6 : 1) * calma;
    if (rng.chance(CFG.vermelhoDireto * P().DISC_CARTAO[fj.p.disciplina])) { expulsar(S1, fj, min, ev, lado, stats, 'vermelho'); recalcular(m); }
    else if (rng.chance(pc)) {
      fj.amarelos++; stats[lado].amarelos++; ev(min, 'amarelo', lado, fj);
      if (fj.amarelos >= 2) { expulsar(S1, fj, min, ev, lado, stats, 'vermelho (2º amarelo)'); recalcular(m); }
    }
  }

  function sorteia(side, rng, grupos, peso) {
    const c = side.campo.filter((j) => grupos.includes(P().GRUPO[j.slot]));
    return rng.weighted(c.length ? c : side.campo, peso);
  }

  const novoStats = () => ({ chutes: 0, no_gol: 0, faltas: 0, amarelos: 0, vermelhos: 0, posse: 0, escanteios: 0 });
  const recalcular = (m) => {
    m.F = [forcas(m.S[0]), forcas(m.S[1])];
    { const ls = m.S[0].campo.concat(m.S[1].campo), L = ls.reduce((a, j) => a + j.base, 0) / Math.max(1, ls.length); m.baixo = P().clamp((72 - L) / 24, 0, 1.1); }
    if (m.nivela) for (const k of ['ataque', 'defesa', 'controle', 'gk', 'pas', 'rit']) { const mid = (m.F[0][k] + m.F[1][k]) / 2; m.F[0][k] = mid + (m.F[0][k] - mid) * m.nivela; m.F[1][k] = mid + (m.F[1][k] - mid) * m.nivela; }
  };
  const placarDe = (m) => [m.S[0].gols, m.S[1].gols];

  // Cria uma partida "viva": avance minuto a minuto com passo(m). Permite pausar, trocar jogadores e mudar a tática.
  function criar(timeCasa, timeFora, rng) {
    const S = [montar(timeCasa, rng), montar(timeFora, rng)];
    S[0].time.mando = true; S[1].time.mando = false;
    const m = { S, rng, min: 0, eventos: [], stats: [novoStats(), novoStats()], F: null, terminou: false, nivela: timeCasa.nivela || 0 };
    recalcular(m); return m;
  }

  function passo(m) {
    const { S, rng, stats, eventos } = m;
    const min = ++m.min;
    if (m.penPend) cobrarPenalti(m, m.penPend.lado, null);
    const ctrl = () => { const a = Math.pow(m.F[0].controle, CFG.expoControle), b = Math.pow(m.F[1].controle, CFG.expoControle); return a / (a + b); };
    const ev = (min, tipo, lado, jog, extra) => eventos.push({ min, tipo, lado, jogador: jog && jog.p.nome, ...extra });
    if (min === 46) { S.forEach((s, i) => { s.ajusteInt = leitura(m, i).b; }); recalcular(m); }
    if (min % 5 === 0) recalcular(m);
      // cansaço: perda por minuto depende do atributo FIS (FIS 99 ≈ -13 por jogo; FIS 30 ≈ -26)
      for (const s of S) for (const j of s.campo) {
        j.minutos++;
        j.fresco = j.entrou > 0 && min - j.entrou < CFG.freshD ? 1 + CFG.freshB * (1 - (min - j.entrou) / CFG.freshD) : 1;   // pernas frescas de quem entrou
        const perda = (33 - j.p.attr.FIS * 0.22) / 90 * (s.time.tatica === 'ofensivo' ? 1.1 : s.time.tatica === 'defensivo' ? 0.95 : 1) * P().fatorGasto(j.p.idade);
        j.p.stamina = Math.max(0, j.p.stamina - perda);
        if (rng.chance(CFG.lesaoPorJogadorMin * P().clamp(1.85 - j.p.attr.FIS / 65, 0.5, 1.6) * (0.55 + 1.1 * Math.pow(1 - j.p.stamina / 100, 1.2) + 0.25)) && !j.lesionado) {
          j.lesionado = true; j.p.lesao = rng.int(1, 8); j.p.stamina = Math.min(j.p.stamina, 15);
          ev(min, 'lesao', S.indexOf(s), j, { pos: j.slot });
          if (s.manual) { const idx = s.campo.indexOf(j); s.campo = s.campo.filter((x) => x !== j); j.saiu = min; (s.vagas = s.vagas || []).push({ slot: j.slot, idx, nome: j.p.nome, motivo: 'lesao', pos: j.slot }); }
          else trocarForcado(s, j, min, rng, ev, S.indexOf(s));
          recalcular(m);
        }
      }
      // quem tem a bola neste minuto?
      const pc = ctrl();
      const nAtaques = rng.chance(CFG.ataquesPorMinuto * (m.F[0].t.tempo + m.F[1].t.tempo) / 2) ? 1 : 0;   // dois times fechados = jogo truncado
      stats[0].posse += pc; stats[1].posse += 1 - pc;
      for (let i = 0; i < 2; i++) {   // passes do minuto: quem tem mais a bola troca mais passes; PAS e a posse decidem quantos saem certos
        const share = i === 0 ? pc : 1 - pc, n = Math.round(10 * share + rng.next() - 0.5);
        for (let q = 0; q < n; q++) {
          const pj = sorteia(S[i], rng, ['M', 'A', 'D'], (j) => j.p.attr.PAS * (P().GRUPO[j.slot] === 'M' ? 2 : 1));
          pj.pt = (pj.pt || 0) + 1; if (rng.chance(P().clamp(0.74 + (pj.p.attr.PAS - 50) * 0.004 + (share - 0.5) * 0.12 - (P().GRUPO[pj.slot] === 'A' ? 0.08 : 0), 0.45, 0.95))) pj.pc = (pj.pc || 0) + 1;
        }
      }
      if (nAtaques) {
        const folga = (i) => { const l = S[i].gols - S[1 - i].gols; return l >= 2 ? Math.pow(0.7, l - 1) : 1; };   // goleada: quem está muito à frente poupa o time
        const peso0 = pc * m.F[0].t.tempo * folga(0), peso1 = (1 - pc) * m.F[1].t.tempo * folga(1);
        const a = rng.chance(peso0 / (peso0 + peso1)) ? 0 : 1, d = 1 - a;
        const A = S[a], D = S[d];
        const bonusContra = m.F[a].t.contraK * (m.F[d].t.abertura > 0 ? m.F[d].t.abertura : m.F[d].t.abertura * 0.4) - m.F[d].t.fecha; // espaço para o contra-ataque e retranca
        const dif = m.F[a].ataque - m.F[d].defesa;
        const lead = A.gols - D.gols;
        // passe: a bola chega ao ataque (meias, laterais, zagueiros e até o goleiro). Qualquer um com bom passe pode dar o passe final.
        const pesoPas = (j) => Math.pow(j.p.attr.PAS * efM(j), 1.3) * { G: 0.03, M: 1.6, A: 4.6, D: 0.22 }[GR(j)] * (LATERAIS.includes(j.slot) ? 1.5 : 1);
        let passador = sorteia(A, rng, ['G', 'M', 'A', 'D'], pesoPas);
        passador.passes++;
        // drible × marcação: o marcador pode parar na falta (macetadores fazem mais), na área vira pênalti; perto da área, falta direta
        const dri = sorteia(A, rng, ['A', 'M', 'D'], (j) => Math.pow(j.p.attr.DRI, 1.5) * { A: 4, M: 2, D: 0.3 }[GR(j)]);
        const mk = sorteia(D, rng, ['D', 'M'], (j) => Math.pow(j.p.attr.DEF, 1.2) * (GR(j) === 'D' ? 3 : 1));
        const dv = dri.p.attr.DRI * efM(dri), mv = (mk.p.attr.DEF * 0.7 + mk.p.attr.RIT * 0.15 + mk.p.attr.FIS * 0.15) * efM(mk);
        if (!m.penPend && rng.chance(P().clamp(0.053 + (dv - mv) * kcDe(m) * 0.0020, 0.01, 0.15) * P().DISC_FALTA[mk.p.disciplina])) {
          cometerFalta(m, d, mk, min, ev, 1);
          if (rng.chance({ A: 0.24, M: 0.11, D: 0.02 }[GR(dri)])) { if (A.manual) m.penPend = { lado: a, min, faltoso: mk.p.nome }; else cobrarPenalti(m, a, null, mk.p.nome); }
          else if (rng.chance(0.5)) cobrarFalta(m, a, ev, min);
        } else {
          const venceu = rng.chance(P().clamp(0.30 + (dv - mv) * kcDe(m) * 0.012, 0.06, 0.65));
          const pChute = P().clamp(0.378 + (dif > 0 ? dif * m.F[d].t.comp : dif) * 0.0065 + bonusContra - (lead >= 2 ? 0.05 * (lead - 1) : 0)
            + (m.F[a].pas - m.F[d].pas) * 0.0038 + (m.F[a].rit - m.F[d].rit) * 0.0022 + (venceu ? 0.16 : 0) + CFG.baixoChute * (m.baixo || 0), 0.2, 0.75);
          if (rng.chance(pChute)) {
            // cruzamento (lateral/ponta com a bola) vira cabeçada; no resto, o centroavante de finalização e ritmo
            const cruz = LATERAIS.includes(passador.slot) && passador.slot !== 'PD' && passador.slot !== 'PE' ? rng.chance(0.32) : (passador.slot === 'PD' || passador.slot === 'PE') && rng.chance(0.2);
            const marc = mk, mEff = (marc.p.attr.DEF * 0.7 + marc.p.attr.RIT * 0.15 + marc.p.attr.FIS * 0.15) * efM(marc);
            let r;
            if (cruz) {
              const hd = sorteia(A, rng, ['A', 'M', 'D'], (j) => (j === passador ? 0 : Math.pow(Math.max(cabDe(j) * efM(j), 5), 2) * { A: 4, M: 0.8, D: 0.3 }[GR(j)]));
              r = chutar(m, a, hd, passador, cabDe(hd) * efM(hd), mEff * 0.95, 'cabeca', ev, min, { origem: 'cruzamento', cobrador: passador.p.nome });
            } else {
              const atk = sorteia(A, rng, ['A', 'M', 'D'], (j) => Math.pow(j.p.attr.CHU, 1.3) * { A: 4, M: 1.5, D: 0.25 }[GR(j)]);
              if (atk === passador) { passador.passes--; passador = sorteia(A, rng, ['G', 'M', 'A', 'D'], (j) => (j === atk ? 0 : pesoPas(j))); passador.passes++; }   // o passe final não vem do próprio finalizador
              r = chutar(m, a, atk, passador, (atk.p.attr.CHU * 0.7 + atk.p.attr.RIT * 0.15 + atk.p.attr.DRI * 0.15) * efM(atk), mEff, 'bola', ev, min);
            }
            if (!r.gol && rng.chance(r.noGol ? 0.40 : 0.18)) escanteio(m, a, ev, min);
          } else {
            const des = sorteia(D, rng, ['D', 'M'], (j) => (j.p.attr.DEF * 0.8 + j.p.attr.RIT * 0.2) * (GR(j) === 'D' ? 2 : 1));
            des.desarmes++;
            if (rng.chance(0.07)) escanteio(m, a, ev, min);
          }
        }
      }
      if (min === 45) fimDoTempo(m);
      if (!m.penPend && rng.chance(PEN_P)) {   // pênalti sem drible (mão na bola, toque): favorece quem mais ataca; o humano escolhe o batedor
        const pa = Math.pow(m.F[0].ataque, 1.6), pb = Math.pow(m.F[1].ataque, 1.6), a = rng.chance(pa / (pa + pb)) ? 0 : 1, d = 1 - a;
        const cj = S[d].campo.filter((j) => j.slot !== 'GOL'), fj = rng.weighted(cj.length ? cj : S[d].campo, (j) => P().DISC_FALTA[j.p.disciplina] * (1.2 - j.p.attr.DEF / 300));
        cometerFalta(m, d, fj, min, ev, 2.9);
        if (S[a].manual) m.penPend = { lado: a, min, faltoso: fj.p.nome }; else cobrarPenalti(m, a, null, fj.p.nome);
      }
      // faltas (cometidas pelo time sem a bola, de preferência)
      if (rng.chance(CFG.faltaBase * 1.7)) {
        const lado = rng.chance(0.5 + (0.5 - ctrl()) * 0.3) ? 0 : 1; // quem tem menos a bola faz mais falta
        const S1 = S[lado];
        const fj = rng.weighted(S1.campo, (j) => P().DISC_FALTA[j.p.disciplina] * (P().GRUPO[j.slot] === 'A' ? 0.6 : 1) * (1.2 - j.p.attr.DEF / 300));
        cometerFalta(m, lado, fj, min, ev, 1);
        const z = rng.next();
        if (z < 0.075) cobrarFalta(m, 1 - lado, ev, min);   // perto da área: cobrança direta
        else if (z < 0.125) { const cand = S[1 - lado].campo.filter((j) => j.slot !== 'GOL'); if (cand.length) bolaAerea(m, 1 - lado, cand.slice().sort((x, y) => cobrNota(y) - cobrNota(x))[0], ev, min, 'falta'); }   // falta lateral na área
      }
  }

  // leitura da escalação para a tela do técnico: sinergia, capitão e batedores sugeridos
  function analise(time) {
    const side = montar(time, bf.RNG.create(1)), sn = sinergia(side), nt = side.campo.filter((j) => j.slot !== 'GOL');
    const cob = side.campo.slice().sort((x, y) => cobrNota(y) - cobrNota(x))[0], esc = nt.slice().sort((x, y) => y.p.attr.PAS - x.p.attr.PAS)[0];
    return { sin: sn, capitao: side.capId, cobrador: cob.p.id, escanteio: esc && esc.p.id, pas: idxPas(side), rit: idxRit(side) };
  }
  function fimDoTempo(m) { m.S.forEach((s, i) => { s.h1 = { tatica: s.time.tatica, formacao: s.time.formacao, dif: s.gols - m.S[1 - i].gols }; }); }

  function finalizar(m) {
    const placar = placarDe(m);
    m.S.forEach((s, i) => { for (const j of s.todos.values()) j.nota = calcNota(j, i, placar); });
    m.terminou = true;
    return { placar, eventos: m.eventos, stats: m.stats.map((x) => ({ ...x, posse: Math.round(x.posse / Math.max(1, m.min) * 100) })), lados: m.S };
  }

  // Partida inteira de uma vez (simulação rápida). opts.intervalo(S, stats, eventos) é chamado aos 46'; opts.ia liga as trocas automáticas.
  function simular(timeCasa, timeFora, rng, opts = {}) {
    const m = criar(timeCasa, timeFora, rng);
    for (let i = 1; i <= 90; i++) {
      if (i === 46) { if (opts.ia) m.S.forEach((s, k) => iaIntervalo(m, k)); if (opts.intervalo) opts.intervalo(m.S, m.stats, m.eventos); recalcular(m); }
      if (opts.ia && (i === 60 || i === 70 || i === 80)) m.S.forEach((s) => iaSubstituicoes(m, s));
      passo(m);
    }
    return finalizar(m);
  }

  // Troca automática do computador: tira quem está mais cansado (stamina < 75) e põe o melhor reserva para o slot.
  function iaSubstituicoes(m, s) {
    if (s.subs >= s.maxSubs) return;
    const cand = s.campo.filter((j) => j.slot !== 'GOL').sort((a, b) => a.p.stamina - b.p.stamina)[0];
    if (!cand || cand.p.stamina > 75) return;
    const livres = s.banco.filter((p) => p.lesao === 0 && p.pos !== 'GOL');
    if (!livres.length) return;
    const nota = (p) => P().ovrNoSlot(p, cand.slot) * (0.8 + p.stamina / 500);
    const melhor = livres.sort((a, b) => nota(b) - nota(a))[0];
    substituirM(m, m.S.indexOf(s), cand.p.id, melhor.id, 'tática');
  }

  function expulsar(s, j, min, ev, lado, stats, motivo) {
    j.expulso = true; stats[lado].vermelhos++; ev(min, 'vermelho', lado, j, { motivo });
    const idx = s.campo.indexOf(j);
    s.campo = s.campo.filter((x) => x !== j); j.saiu = min;
    abrirVaga(s, j, idx, min, ev, lado, 'vermelho');
  }
  // técnico humano escolhe quem entra (vaga fica pendente); computador preenche na hora com o melhor reserva
  function abrirVaga(s, j, idx, min, ev, lado, motivo) {
    if (s.manual) { (s.vagas = s.vagas || []).push({ slot: j.slot, idx, nome: j.p.nome, motivo, pos: j.slot }); return; }
    preencherAuto(s, j.slot, idx, min, ev, lado, j.p.nome);
  }
  function preencherAuto(s, slot, idx, min, ev, lado, saiuNome) {
    if (s.subs >= s.maxSubs) return false;
    const ok = s.banco.filter((b) => b.lesao === 0 && b.stamina > 50); if (!ok.length) return false;
    const novoP = ok.sort((a, b) => P().ovrNoSlot(b, slot) - P().ovrNoSlot(a, slot))[0];
    s.banco = s.banco.filter((b) => b !== novoP); s.subs++;
    const nj = novo(novoP, slot); nj.entrou = min; s.todos.set(novoP.id, nj);
    s.campo.splice(Math.min(idx, s.campo.length), 0, nj);
    ev(min, 'substituicao', lado, nj, { saiu: saiuNome, motivo: 'vaga' });
    return true;
  }
  function preencherVaga(m, lado, entraId) {
    const s = m.S[lado], v = (s.vagas || [])[0]; if (!v) return { ok: false, motivo: 'Não há vaga a preencher.' };
    if (s.subs >= s.maxSubs) return { ok: false, motivo: 'Limite de ' + s.maxSubs + ' substituições atingido.' };
    const p = s.banco.find((b) => b.id === entraId); if (!p) return { ok: false, motivo: 'Escolha um jogador do banco.' };
    if (p.lesao > 0) return { ok: false, motivo: 'Jogador lesionado.' };
    s.banco = s.banco.filter((b) => b !== p); s.subs++;
    const nj = novo(p, v.slot); nj.entrou = m.min; s.todos.set(p.id, nj); s.campo.splice(Math.min(v.idx, s.campo.length), 0, nj);
    s.vagas.shift(); m.eventos.push({ min: m.min, tipo: 'substituicao', lado, jogador: p.nome, saiu: v.nome, motivo: 'vaga' }); recalcular(m);
    return { ok: true };
  }
  function ignorarVagas(m, lado) { m.S[lado].vagas = []; recalcular(m); }
  function resolverVagasAuto(m) {
    m.S.forEach((s, i) => { (s.vagas || []).forEach((v) => preencherAuto(s, v.slot, v.idx, m.min, (mm, t, l, j, x) => m.eventos.push({ min: mm, tipo: t, lado: l, jogador: j && j.p.nome, ...x }), i, v.nome)); s.vagas = []; });
    recalcular(m);
  }

  // --- pênalti: o resultado depende de finalização, moral e cansaço do batedor e da defesa do goleiro (~75% de conversão)
  const PEN_P = 0.0008;   // pênaltis sem drible; a maior parte nasce do duelo drible × marcação (total ≈ 0,3 por jogo)
  const PEN_DIR = [['canto esquerdo', 'no canto esquerdo', 0.20], ['canto direito', 'no canto direito', 0.20], ['ângulo esquerdo', 'no ângulo esquerdo', 0.12], ['ângulo direito', 'no ângulo direito', 0.12], ['meio', 'no meio do gol', 0.10], ['em cima do meio', 'em cima do meio', 0.07]];
  const PEN_SAVE = { 'canto esquerdo': 0.22, 'canto direito': 0.22, 'ângulo esquerdo': 0.05, 'ângulo direito': 0.05, 'meio': 0.30, 'em cima do meio': 0.10 };
  const penNota = (j) => ((j.p.attr.CHU * 0.65 + P().cobrDe(j.p) * 0.35) * 0.7 + j.p.moral * 0.3) * mStam(j.p.stamina);
  // Mando: em casa ajuda um pouco, fora atrapalha mais; o peso é menor com moral individual e do time altas (casa +, fora −).
  function ajusteMando(casa, moralInd, moralTime) {
    if (casa == null) return 0;
    const m = P().clamp((moralInd + moralTime) / 200, 0, 1);
    return casa ? 0.012 * (0.5 + m) : -0.02 * (1 - 0.8 * m);
  }
  // ctx = { casa: o batedor joga em casa?, mt: moral média do time do batedor, mtg: moral média do time do goleiro }
  function penaltiResultado(atk, gkj, rng, ctx) {
    ctx = ctx || {};
    const chu = atk.p.attr.CHU * 0.65 + P().cobrDe(atk.p) * 0.35, mor = atk.p.moral, gkd = gkj ? gkj.p.attr.DEF : 40;
    const adjB = ajusteMando(ctx.casa, mor, ctx.mt == null ? mor : ctx.mt);
    const adjG = ctx.casa == null ? 0 : ajusteMando(!ctx.casa, gkj ? gkj.p.moral : 60, ctx.mtg == null ? (gkj ? gkj.p.moral : 60) : ctx.mtg);
    const gkMod = gkj ? (0.88 + 0.12 * gkj.p.stamina / 100) * (0.85 + 0.3 * gkj.p.moral / 100) * (1 + 9 * adjG) : 1;
    const pMiss = P().clamp(0.125 - (chu - 55) * 0.0018 - (mor - 60) * 0.0008 + (100 - atk.p.stamina) * 0.0004 - adjB, 0.03, 0.26);
    if (rng.chance(pMiss)) {
      const r = rng.next();
      if (r < 0.45) return { desfecho: 'fora', noAlvo: false, frase: 'pra fora' };
      if (r < 0.75) { const e = rng.chance(0.5); return { desfecho: 'trave', noAlvo: false, frase: e ? 'na trave esquerda' : 'na trave direita' }; }
      return { desfecho: 'travessao', noAlvo: false, frase: 'no travessão' };
    }
    // quem finaliza bem procura os cantos e os ângulos
    const ang = P().clamp(1 + (chu - 55) * 0.012, 0.5, 1.8);
    const pesos = PEN_DIR.map(([k, , w]) => w * (k.startsWith('ângulo') ? ang : k === 'meio' ? 1 / ang : 1)), tot = pesos.reduce((x, y) => x + y, 0);
    let r = rng.next() * tot, i = 0; while (i < pesos.length - 1 && r > pesos[i]) { r -= pesos[i]; i++; }
    const [dir, frase] = PEN_DIR[i], gkf = P().clamp(1 + (gkd - 50) * 0.013, 0.55, 1.6) * P().clamp(1 - (chu - 50) * 0.003, 0.7, 1.2) * gkMod;
    const defendeu = rng.chance(P().clamp(PEN_SAVE[dir] * gkf * 0.74, 0.02, 0.6));
    return { desfecho: defendeu ? 'defendeu' : 'gol', noAlvo: true, direcao: dir, frase };
  }
  // t = { jog: [jogadores], gk: goleiro, pref: id do batedor preferido, casa: bool, mt: moral do time }
  function disputaPenaltis(tA, tB, rng) {
    const fila = (t) => {
      const l = t.jog.filter((p) => p !== t.gk).map((p) => ({ p })).sort((x, y) => penNota(y) - penNota(x)).map((j) => j.p);
      const i = l.findIndex((p) => p.id === t.pref); if (i > 0) l.unshift(l.splice(i, 1)[0]);
      return l.length ? l : [t.gk];
    };
    const fa = fila(tA), fb = fila(tB), gA = t2g(tA), gB = t2g(tB), r = [0, 0];
    function t2g(t) { return t.gk ? { p: t.gk } : null; }
    const bate = (t, f, g, k, adv) => penaltiResultado({ p: f[k % f.length] }, g, rng, { casa: t.casa, mt: t.mt, mtg: adv.mt }).desfecho === 'gol';
    for (let k = 0; k < 5; k++) { if (bate(tA, fa, gB, k, tB)) r[0]++; if (bate(tB, fb, gA, k, tA)) r[1]++; }
    for (let k = 5; r[0] === r[1] && k < 40; k++) { if (bate(tA, fa, gB, k, tB)) r[0]++; if (bate(tB, fb, gA, k, tA)) r[1]++; }
    if (r[0] === r[1]) r[rng.chance(0.5) ? 0 : 1]++;
    return r;
  }
  function cobrarPenalti(m, lado, batedorId, faltoso) {
    const { S, rng, stats } = m, min = m.min, A = S[lado], D = S[1 - lado];
    faltoso = faltoso || (m.penPend && m.penPend.faltoso); m.penPend = null;

// Aba Relatórios de testes: mostra os relatórios das baterias de teste e medições feitas no projeto (arquivos Markdown embutidos no jogo).
(function () {
  const K = window.K, h = K.h, G = K.G;
  const RELATORIOS = [{"id": "relatorios/01-mecanicas-e-balanceamento.md", "titulo": "Relatório da rodada de testes de mecânicas e balanceamento", "md": "# Kfoot 98 — Relatório da rodada de testes de mecânicas e balanceamento\n\nVersão testada: branch `claude/melhorias-5-xt6u1f`, commit `0133c8c` (pasta `kfoot98`).\nNada foi alterado no código, nada foi enviado ao repositório e o artefato não foi republicado. Este documento é só diagnóstico e proposta, para decidirmos juntos antes de implementar.\n\n## Como testei\n\nCarreguei o motor real do jogo (o mesmo código do `index.html`) em Node, sem a tela, e simulei em volume. No total foram cerca de **1,2 milhão de partidas**:\n\n| Bateria | Volume |\n|---|---|\n| Temporadas completas do mundo inteiro (80 clubes, liga + Copa), 8 anos seguidos, 3 lotes | ~120 mil jogos |\n| Matriz de táticas (4×4) e de formações (6×6), times de mesmo nível com elencos clonados | ~200 mil jogos |\n| Grade completa de 24 combinações (6 formações × 4 táticas) em todos contra todos | ~100 mil jogos |\n| Sensibilidade a atributos, posições, stamina e moral (um fator por vez) | ~250 mil jogos |\n| Substituições (6 políticas) | ~18 mil jogos |\n| 10 \"técnicos humanos\" de teste: 240 temporadas completas do mundo (24 mundos × 10 rodízios; cada personalidade jogou 240 temporadas de clube) | ~400 mil jogos |\n| Controle: os mesmos 10 clubes sob comando do computador (24 mundos, 240 temporadas de clube) | ~40 mil jogos |\n| Mundo de 25 anos sem intervenção, preço de ingresso, finanças | ~100 mil jogos |\n\nComo ler os números: \"ppg\" é pontos por jogo (vitória 3, empate 1). Num confronto entre times idênticos o valor esperado é cerca de **1,40** (não 1,00, porque há empates). O erro padrão típico é ±0,02 em cada célula, então diferenças menores que ~0,05 ppg não são distinguíveis de sorte.\n\nLimitações: testei o motor, não a interface. As escalações dos técnicos de teste foram automáticas (o jogo escolhe os 11 melhores disponíveis); só formação, tática e ajustes de intervalo variaram entre as personalidades.\n\n---\n\n## Resumo em uma página\n\n1. **O motor em si está saudável.** 2,7 gols/jogo, mandante vence 42%, empate 24%, visitante 34%. Favorito por prestígio ganha mais, mas azarão ainda vence (com +30 de prestígio o mandante vence 65–70%).\n2. **A qualidade dos jogadores domina tudo; táticas e formações movem pouco.** Cada ponto de overall do time vale ~0,085 ppg. A melhor combinação tática contra a pior vale ~0,17 ppg, ou seja, ~2 pontos de overall. Entre os 10 técnicos de teste, do melhor ao pior deu 0,09 ppg (cerca de 1,3 posição na tabela por ano). O jogador humano dificilmente \"vê\" a diferença das suas escolhas na classificação.\n3. **Stamina praticamente não existe como mecânica de gestão.** Todo titular chega ao apito inicial com ~100% (recupera tudo em 2 dias), perde ~19 pontos durante o jogo, e as substituições da IA e as manuais valem zero (+0,003 ppg). Só que o efeito de stamina baixa seria enorme (cada −10 de stamina inicial custa −0,13 ppg). O problema é que nunca chega a acontecer.\n4. **Moral do jogador pesa bastante, mas vira bola de neve.** Time com moral 0 vs 100 vale 0,47 ppg (~5,5 pontos de overall). O terço de baixo da tabela perde ~23 pontos de moral numa temporada (57 → 34) e o de cima fica estável (~66): quem vai mal piora. Já a **moral do técnico quase não tem consequência** (±1 de moral por jogo no elenco, sem demissão, sem efeito nos clubes do computador).\n5. **Lotação**: os fatores são previsíveis e o humano tem alavancas, mas há **um bug de preço** (explicação abaixo) e, nos clubes de Série D que o humano recebe, o estádio fica em 3–13% e ampliar nunca se paga.\n6. **Defensores valem 4 vezes menos que atacantes** na prática (+10 de overall num zagueiro dá +0,03 ppg; num centroavante, +0,16). O mercado não percebe isso: compra-se atacante e goleiro, nunca defensor.\n7. **O mundo envelhece sozinho.** Clubes do computador nunca renovam elenco: em 20 anos a idade média vai de 26 para 47 e o overall dos times da Série A cai de 71 para 50. Antes disso, o prestígio fixo faz o campeão da Série A sair sempre dos mesmos 8 clubes (Corinthians 29% dos títulos em 72 temporadas) e a Copa do Brasil ir para um time da Série A em 97% das vezes.\n\n---\n\n## 1. Stamina\n\n**Como funciona hoje:** perda por jogo = (26 − FIS×0,13)/90 por minuto, ×1,1 se ofensivo, ×0,95 se defensivo, ×fator de idade. Recuperação = (6 + FIS×0,08) por dia de descanso × fator de idade. A força do jogador é multiplicada por 0,70 + 0,30 × stamina/100.\n\n**O que medi:**\n\n| Medida | Resultado |\n|---|---|\n| Stamina dos titulares no apito inicial (milhares de amostras) | média 99,9; percentil 10 = 100; mínimo 26–36 (só após lesão) |\n| Stamina dos titulares no fim do jogo | média ~81 |\n| Titulares com 32+ anos no apito inicial | média 99,9 |\n| Efeito de começar com stamina menor (todo o time, adversário a 100) | 90 → −0,13 ppg · 80 → −0,29 · 70 → −0,42 · 60 → −0,57 · 50 → −0,72 |\n| Substituições (trocar os 3 mais cansados aos 60', ao intervalo, escalonado, política da IA, nenhuma) | todas entre 1,363 e 1,366 ppg, ou seja, **zero diferença** |\n| Trocas por jogo | IA: 0,13 (quase só lesões); manual agressivo: 0,9 |\n\n**Conclusão:** a fórmula de efeito é forte, mas o descanso entre jogos (3–4 dias × 10–13 de recuperação por dia) é folgado demais e apaga todo o desgaste. Resultado: o jogador humano nunca precisa rodar o elenco, e as 3 substituições de 1998 não servem para nada além de lesão. O reserva é pior que o titular e o ganho de fôlego (~5% de força no fim) não compensa.\n\n**Propostas (da mais simples à mais ambiciosa):**\n- **A (recomendo):** reduzir a recuperação para ~3–4 por dia (e deixar o FIS e a idade pesarem mais). Titulares que jogam toda semana ficariam em 80–90 no apito inicial, e rodar o elenco passa a valer a pena.\n- **B:** a IA do computador também trocar por stamina \u003c 65 (hoje \u003c 45), para os adversários não parecerem \"robôs de 90 minutos\".\n- **C:** dar valor às substituições: o jogador que entra ganha um pequeno bônus de \"pernas frescas\" nos primeiros 20 minutos, ou o ganho de stamina entra na equação da substituição.\n- Qualquer uma exige reavaliar o impacto: cada −10 de stamina inicial custa 0,13 ppg, então uma recuperação muito curta deixaria o jogo punitivo.\n\n## 2. Moral do jogador e do técnico\n\n**Como funciona hoje:** o multiplicador de força vai de 0,95 (moral 0) a 1,05 (moral 100). A moral muda a cada jogo em `(nota − 6,3) × 5`; quem não joga puxa para 50 com −1 por jogo (equilíbrio em ~25). A moral do técnico muda ±8 por resultado (mais contra time maior) e repassa `(moral do técnico − 50) × 0,02` para o elenco, só dos clubes humanos.\n\n**O que medi:**\n\n| Medida | Resultado |\n|---|---|\n| Efeito da moral do time (adversário a 65) | 0 → 1,05 ppg · 25 → 1,18 · 45 → 1,27 · 65 → 1,36 · 85 → 1,45 · 100 → 1,52 |\n| Moral média dos 14 melhores, ao longo das rodadas 6 → 36 (Série A) | 1º terço: 66 → 66 · 2º terço: 62 → 55 · último terço: 57 → 34 |\n| Série D, mesma conta | 1º terço: 63 → 65 · 2º: 58 → 53 · último: 55 → 39 |\n| Moral dos titulares (todas as divisões) | média 60, percentil 10 = 32, percentil 90 = 97 |\n| Moral dos reservas (fora dos 14 melhores) | média 43 |\n| Moral do técnico ao fim da temporada | 1º terço: 83 · 2º: 57 · último: 27 |\n| Técnico com moral ≥ 95 durante o ano | 22% do tempo no 1º terço |\n\n**Conclusões:**\n- A moral é uma alavanca **forte** (a faixa típica de 35 a 95 já mexe ~0,3 ppg, o mesmo que +3,5 de overall), mas ela é **autorreforçada**: ganhar sobe a moral, que ajuda a ganhar. Um time que entra em má fase tem pouco como reagir, porque o humano não tem nenhuma ação de moral (conversa, prêmio, folga). O que sobra é jogar melhor.\n- A **moral do técnico não tem consequência real**: não há demissão, nem pressão da diretoria, e o repasse ao elenco é ±1 por jogo no máximo, só no clube humano. Hoje ela é um painel bonito.\n- Reservas ficam em ~25–45 de moral, então quando alguém precisa jogar (lesão) entra deprimido.\n\n**Propostas:**\n- **A (recomendo):** dar ao humano pelo menos uma ação de moral (prêmio por vitória, folga extra, conversa no vestiário) com custo em dinheiro ou stamina, e um freio na espiral (ex.: moral de quem perde tende a parar em ~40, em vez de cair sem fim).\n- **B:** dar consequência à moral do técnico: abaixo de ~20 por N jogos a diretoria avisa e depois demite (game over no single player, ou perda de pontos de patrocínio); acima de 80, bônus em negociação/patrocínio.\n- **C:** estreitar a faixa do multiplicador (0,97–1,03) se acharmos a espiral forte demais. É decisão de design: hoje ela recompensa boas campanhas, mas também pune demais as ruins.\n- **D:** deixar reservas que entram em campo recuperarem moral mais rápido (ou não caírem abaixo de ~40).\n\n## 3. Lotação dos estádios\n\n**Fórmula atual:** `público = demanda_do_clube × (1 + 0,35 × forma) × rival × (preço/preço_padrão)^−1,3 × ruído(±8%)`, com teto na capacidade e piso de 3% da capacidade. `demanda = 25 × prestígio^1,55 × k_divisão`.\n\n**Fatores que influenciam (e os que não influenciam):**\n\n| Fator | Efeito | Observação |\n|---|---|---|\n| Prestígio do mandante | base da demanda (~87× entre o maior e o menor clube) | fixo para sempre, nunca muda com campanhas |\n| Forma (últimos 5 jogos, qualquer competição) | ×0,65 (5 derrotas) a ×1,35 (5 vitórias) | conta só V/E/D: perder 0×5 ou 0×1 é igual; goleada a favor não ajuda |\n| Adversário | ×(1 + (prest. visitante − prest. mandante)/200), limitado a 0,90–1,30 | jogar contra time grande rende no máximo +30% |\n| Clássico (mesma cidade) | ×1,25 | só Rio, São Paulo, Belém etc.; vale para clubes pequenos também |\n| Preço do ingresso | (preço/padrão)^−1,3, de ×0,5 a ×3 | elasticidade fixa |\n| Ruído | ±8% por jogo | |\n| **Não influenciam** | posição na tabela, decisão/final, fase da Copa, dia da semana, nível/conforto do estádio, gols vistos, ano a ano | |\n\n**Resultados medidos (liga, 72 temporadas):**\n\n| Divisão | Lotação média | Jogos lotados | Menor / maior clube |\n|---|---|---|---|\n| A | 54% | 6% | 20% / 93% |\n| B | 38% | 2% | 14% / 93% |\n| C | 21% | 0% | 10% / 58% |\n| D | 12% | 0% | 3% / 26% |\n\nGrandes estádios dão lotação baixa (Flamengo 32%, Botafogo 20%, São Paulo 39%) e os pequenos de sucesso lotam (Palmeiras 91%, Santos 93%). É coerente com o Brasil da época, mas tem efeito de jogo:\n- **Ampliar o estádio quase nunca se paga**: das 30 equipes que analisei, só Santos (retorno 1,5 ano), Portuguesa (1,5), Palmeiras (4,4) e Atlético-PR (4,8) têm demanda acima da capacidade. Nos 10 clubes que o humano pode receber (Série D), nunca (demanda = 3–12% da capacidade).\n- **O humano recebe clubes com 3–12% de lotação** (Bangu 8%, Guarany de Bagé 3,5%). Mesmo com preço ×0,5, forma +1, clássico e rival grande, o teto teórico é 19–70%.\n\n### Bug confirmado: o piso de 3% permite explorar o preço\n\nO piso (3% da capacidade) é aplicado depois do efeito do preço. Quando a demanda cai abaixo do piso, o público trava no piso e subir o preço deixa de afastar torcida. Medi no jogo real (média de 3 temporadas, bilheteria anual em R$ mil / público médio):\n\n| Clube | Preço padrão (R$4) | ×0,5 (R$2) | ×3 (R$12) |\n|---|---|---|---|\n| Marília | 79 mil / 926 | 97 mil / 2.279 | **146 mil / 570** |\n| Guarany de Bagé | 27 mil / 331 | 31 mil / 783 | **72 mil / 298** |\n| Bangu | 124 mil / 1.522 | 152 mil / 3.747 | 125 mil / 514 |\n\nEm clubes muito pequenos o preço máximo rende 2 a 2,7× mais que o padrão sem perder público, e o preço mínimo (que seria o \"ótimo\" teórico, receita ∝ preço^−0,3) também rende mais que o padrão. A curva de receita fica em \"U\", com dois ótimos, um deles absurdo.\n\n### Economia dos clubes que o humano recebe (Série D)\n\nSem mexer em nada, 1 temporada: receita R$106–204 mil (TV fixa de R$80 mil é a maior parte), despesa R$115–149 mil, saldo de −R$9 mil a +R$56 mil, caixa inicial R$74–96 mil. O patrocínio melhor (Cola Colinha, R$47–60 mil/ano, aceita com 54–60%) praticamente dobra o saldo. É apertado, mas jogável, e o patrocínio é a decisão com mais peso.\n\n**Propostas:**\n- **A (corrigir já):** aplicar o piso antes do efeito do preço, ou fazer o piso valer só até o preço padrão, para eliminar a exploração.\n- **B:** incluir no cálculo a posição na tabela e o saldo de gols na forma (hoje só V/E/D), para o humano sentir recompensa por goleadas e por briga de título.\n- **C:** fazer o prestígio mudar com os resultados (título +, rebaixamento −, campanha de Copa +), mesmo que lento. Hoje só a troca de divisão altera a demanda.\n- **D:** dar ao humano de clube pequeno ferramentas além do preço: campanha de sócios/promoção de ingresso (custo fixo, efeito de demanda por N jogos), jogo-evento, ou sócio-torcedor.\n- **E:** se quisermos que ampliar estádio seja decisão real, a demanda dos clubes médios precisa chegar perto da capacidade; ou então tirar as obras da tela para os clubes onde nunca fazem sentido.\n\n## 4. Atributos, posições, táticas e formações\n\n### 4.1 Atributos (+10 em um atributo nos 11 titulares, adversário igual)\n\n| Atributo | ppg | Δ vs base (1,356) |\n|---|---|---|\n| CHU (chute) | 1,629 | **+0,27** |\n| DEF (defesa) | 1,568 | **+0,21** |\n| FIS (físico) | 1,458 | +0,10 |\n| DRI (drible) | 1,452 | +0,10 |\n| PAS (passe) | 1,449 | +0,09 |\n| RIT (ritmo) | 1,435 | +0,08 |\n| Todos +5 | 1,798 | +0,44 |\n| Todos +10 | 2,186 | +0,83 |\n| Todos −5 | 0,951 | −0,40 |\n\nCada ponto de overall no time inteiro vale ~**0,085 ppg** (≈3,2 pontos num campeonato de 38 jogos). Chute e defesa são ~3× mais valiosos que ritmo/passe. Isso é intencional (o peso por posição define), mas não fica claro ao jogador, que vê seis barras do mesmo tamanho.\n\n### 4.2 Valor de cada posição (+10 de overall em um único jogador, 4-4-2)\n\n| Posição | Δ ppg |\n|---|---|\n| Centroavante (CA) | **+0,16** |\n| Segundo atacante (SA) | +0,15 |\n| Goleiro | +0,13 |\n| Volante / Meia central | +0,09 |\n| Ala | +0,08 |\n| Zagueiro / Lateral | **+0,03 a +0,04** |\n| 4 defensores juntos | +0,145 |\n| 4 meias juntos | +0,36 |\n| 2 atacantes juntos | +0,30 |\n\nUm zagueiro bom vale 4× menos que um centroavante bom, mas o mercado (`valorMercado`) cobra o mesmo por overall igual em qualquer posição. Para o humano que perceber isso, a estratégia dominante é comprar atacantes, meias e goleiro e nunca gastar com defensores (a defesa pesa pouco porque a força defensiva usa a média dos defensores, não a soma, e o goleiro absorve 30%).\n\n### 4.3 Táticas (pontos por jogo da linha contra a coluna, times idênticos, 4-4-2)\n\n| | Ofensivo | Equilibrado | Defensivo | Contra |\n|---|---|---|---|---|\n| **Ofensivo** | 1,38 | 1,45 | 1,44 | **1,28** |\n| **Equilibrado** | 1,36 | 1,40 | 1,40 | 1,47 |\n| **Defensivo** | 1,35 | 1,41 | 1,39 | **1,56** |\n| **Contra** | **1,50** | 1,31 | **1,19** | 1,37 |\n| média | 1,39 | 1,40 | 1,42 | 1,34 |\n\nGols por jogo: ofensivo 2,86, equilibrado 2,59, contra 2,44, defensivo 2,34. O ciclo \"pedra-papel-tesoura\" existe (contra bate ofensivo; ofensivo bate defensivo e equilibrado; defensivo e equilibrado batem contra) e muda o estilo do jogo, mas **contra só vence o ofensivo e perde de todo o resto** (média 1,34, a pior). A diferença máxima de uma célula (1,19 a 1,56) é ±0,18 ppg, e nenhuma tática é dominante em média.\n\n### 4.4 Formações (tática equilibrada, linha contra coluna)\n\n| | 4-3-3 | 4-2-3-1 | 4-4-2 | 4-5-1 | 3-5-2 | 3-4-3 | média |\n|---|---|---|---|---|---|---|---|\n| 4-3-3 | 1,40 | 1,31 | 1,37 | 1,31 | 1,33 | 1,37 | 1,35 |\n| 4-2-3-1 | 1,49 | 1,42 | 1,46 | 1,40 | 1,41 | 1,49 | **1,45** |\n| 4-4-2 | 1,43 | 1,33 | 1,40 | 1,33 | 1,34 | 1,41 | 1,37 |\n| 4-5-1 | 1,49 | 1,40 | 1,46 | 1,39 | 1,39 | 1,47 | 1,43 |\n| 3-5-2 | 1,50 | 1,41 | 1,47 | 1,40 | 1,41 | 1,49 | **1,45** |\n| 3-4-3 | 1,42 | 1,33 | 1,39 | 1,32 | 1,34 | 1,37 | 1,36 |\n\nHá três formações melhores (4-2-3-1, 3-5-2, 4-5-1: +0,06 a +0,10 ppg) e três piores (4-3-3, 3-4-3, 4-4-2). O motivo é o bônus de **controle de bola** (`ctl` +3% a +4%) nas três primeiras, que pesa mais que os bônus de ataque do 4-3-3 e do 3-4-3. Na prática o \"time ofensivo clássico\" (4-3-3 ofensivo) é o 21º de 24 combos.\n\n### 4.5 Ranking das 24 combinações (todos contra todos, ~4.100 jogos cada, ±0,02)\n\nMelhores: 4-2-3-1 defensivo (1,451) · 3-5-2 defensivo (1,451) · 4-2-3-1 equilibrado (1,450) · 3-5-2 ofensivo (1,436).\nPiores: 4-3-3 contra (1,276) · 4-4-2 contra (1,282) · 3-4-3 contra (1,295) · 4-3-3 ofensivo (1,306).\nAmplitude total: 0,175 ppg ≈ 2 pontos de overall.\n\nA IA usa 4-3-3 ofensivo quando é bem mais forte e 4-5-1 (contra ou defensivo) quando é bem mais fraca. Ou seja, **os times grandes do computador jogam com uma das piores combinações**, o que ajuda um pouco o humano.\n\n## 5. Teste com 10 técnicos humanos (personalidades)\n\n**Desenho:** 10 clubes de Série D (os que o humano pode receber). Cada personalidade jogou 240 temporadas de clube (24 mundos × 10 rodízios, passando por todos os clubes e elencos). Escalação automática dos melhores 11; só formação/tática/ajuste de intervalo variaram. Controle: os mesmos clubes sob a IA.\n\n| Personalidade | ppg | Gols pró | Gols contra | Posição média (de 20) |\n|---|---|---|---|---|\n| G Camaleão (adapta ao rival: ofensivo se mais forte, contra se mais fraco) | **1,179** | 0,97 | 1,22 | 13,7 |\n| D Retranca (4-5-1 defensivo) | **1,174** | 0,90 | 1,15 | 13,5 |\n| H Otimizado (4-2-3-1 defensivo) | 1,149 | 0,87 | 1,15 | 14,1 |\n| B Contra-ataque (4-5-1 contra) | 1,146 | 0,93 | 1,22 | 14,1 |\n| E Controlador (3-5-2 equilibrado) | 1,145 | 0,96 | 1,28 | 14,3 |\n| F Kamikaze (3-4-3 ofensivo) | 1,140 | 1,01 | 1,36 | 14,3 |\n| I Reativo (4-4-2; muda no intervalo) | 1,108 | 0,92 | 1,31 | 14,6 |\n| J Mandante ofensivo / visitante retranca | 1,102 | 0,93 | 1,27 | 14,7 |\n| A Ofensivo (4-3-3 ofensivo) | 1,085 | 0,97 | 1,40 | 14,7 |\n| C Equilibrado (4-4-2 equilibrado) | 1,085 | 0,92 | 1,31 | 15,0 |\n| *Controle: IA nos mesm
