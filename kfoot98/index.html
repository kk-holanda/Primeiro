<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"></head><body>
<title>Kfoot 98</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Kfoot 98 — layout: moldura de "placar eletrônico de estádio": cabeçalho fino com passos, conteúdo em painéis planos, tabelas densas estilo Brasfoot */
:root {
  --bg: #e6ece4; --panel: #f6f8f2; --panel2: #eaf0e6; --ink: #13241a; --muted: #566a5c; --line: #c3d0c1;
  --accent: #0b6e3f; --accent-ink: #ffffff; --hot: #e8ab00; --hot-ink: #1d1500;
  --st-verde: #2fa84f; --st-vclaro: #9ccc3c; --st-amarelo: #e6c200; --st-laranja: #ec8a1c; --st-vermelho: #d63a2f;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
    --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1810; --panel: #112219; --panel2: #16301f; --ink: #e7f0e5; --muted: #8ea796; --line: #234030;
  --accent: #37c47c; --accent-ink: #06150c; --hot: #f2b705; --hot-ink: #1d1500; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
h3 { font-family: var(--display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* barra superior com passos */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand b { background: var(--hot); color: var(--hot-ink); padding: 0 6px; margin-left: 4px; font-weight: 400; }
.steps { display: flex; gap: 6px; margin-left: auto; list-style: none; padding: 0; margin-block: 0; flex-wrap: wrap; }
.steps li { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 3px 9px; border: 1px solid var(--line); }
.steps li.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.ok { color: var(--ink); }

/* botões */
.btn { appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 11px 22px; font-family: var(--display); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: transform .08s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.alt { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: var(--hot-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* tela 1 */
.hero { position: relative; overflow: hidden; background: #0f2f1c; color: #eef6ea; border-bottom: 4px solid var(--hot); }
.hero svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.hero .wrap { position: relative; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; padding-block: clamp(48px, 12vw, 120px); }
.logo { font-family: var(--display); line-height: .86; text-transform: uppercase; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.logo .k { font-size: clamp(88px, 22vw, 220px); letter-spacing: .01em; }
.logo .y { font-size: clamp(88px, 22vw, 220px); background: var(--hot); color: #1d1500; padding: 0 .09em; }
.hero .lead { max-width: 34ch; font-size: clamp(19px, 2.6vw, 26px); line-height: 1.3; }
.hero .btn { border-color: var(--hot); background: var(--hot); color: #1d1500; font-size: 22px; padding: 14px 30px; }
.hero small { opacity: .7; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.ticker { background: var(--panel); border-bottom: 1px solid var(--line); }
.ticker .wrap { display: flex; gap: 8px 28px; flex-wrap: wrap; padding-block: 14px; font-size: 15px; }
.ticker span b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-right: 6px; color: var(--accent); }

/* telas 2-5 */
.page { padding-block: 28px 8px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-direction: column; gap: 8px; }
.head p { max-width: 70ch; color: var(--muted); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.rule { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rule b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; }
.rule span { font-size: 15px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); margin-top: 4px; align-self: flex-start; }
.seg button { appearance: none; background: transparent; border: 0; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.divs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.div { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.div > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); gap: 8px; }
.div ol { list-style: none; margin: 0; padding: 0; counter-reset: c; }
.div li { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; border-bottom: 1px dotted var(--line); font-size: 15px; counter-increment: c; }
.div li::before { content: counter(c); width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.div li .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.div li .uf { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.div li.sorteavel { background: color-mix(in srgb, var(--hot) 22%, transparent); font-weight: 600; }
.div li.bloq { color: var(--muted); }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.hot { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.slot { border: 1px dashed var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); min-width: 0; }
.slot.me { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--panel2); }
.slot label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.slot input { padding: 10px 12px; border: 2px solid var(--line); background: var(--panel); font-size: 18px; width: 100%; min-width: 0; }
.slot input:focus-visible { border-color: var(--accent); outline-offset: 0; }
.err { color: #c0322a; font-weight: 600; min-height: 1.4em; }
:root[data-theme="dark"] .err { color: #ff7a6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff7a6e; } }

.draw { background: #0f2f1c; color: #eef6ea; border: 1px solid var(--line); padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-left: 6px solid var(--hot); }
.draw .big { font-family: var(--display); font-size: clamp(34px, 8vw, 68px); line-height: 1; text-transform: uppercase; min-height: 1.1em; overflow-wrap: anywhere; }
.draw .big.rolling { opacity: .75; }

.assign { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.club { background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--hot); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.club .who { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.club .nm { font-family: var(--display); font-size: 36px; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* plantel */
.strip { display: flex; flex-wrap: wrap; gap: 6px 26px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.strip div { display: flex; flex-direction: column; min-width: 0; }
.strip small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.strip b { font-size: 17px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs span { padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); }
.tabs span.on { background: var(--accent); color: var(--accent-ink); }
.tabs span.soon::after { content: " · em breve"; font-family: var(--body); font-size: 11px; text-transform: none; letter-spacing: 0; }
.plantel { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .plantel { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; font-weight: 700; }
th.sorted { color: var(--ink); box-shadow: inset 0 -3px var(--hot); }
td.l, th.l { text-align: left; }
td.nm { font-weight: 600; position: sticky; left: 0; background: var(--panel); }
tr.sep td { background: var(--panel2); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); text-align: left; }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover td, tbody tr[data-id]:hover td.nm { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.sel td, tr.sel td.nm { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
td.pos { font-weight: 700; }
.tit { display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 6px; }
.ovr { font-weight: 800; }
.hi { color: var(--accent); font-weight: 700; }
.lo { color: var(--muted); }
.bar { display: inline-block; width: 56px; height: 9px; background: var(--line); vertical-align: middle; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; }
.c-verde { background: var(--st-verde); } .c-verde-claro { background: var(--st-vclaro); } .c-amarelo { background: var(--st-amarelo); } .c-laranja { background: var(--st-laranja); } .c-vermelho { background: var(--st-vermelho); }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
@media (max-width: 960px) { .panel { position: static; } }
.panel .pn { font-family: var(--display); font-size: 28px; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; }
.attr { display: grid; grid-template-columns: 38px 1fr 28px; gap: 8px; align-items: center; font-size: 14px; }
.attr .bar { width: 100%; height: 10px; }
.attr .bar i { background: var(--accent); }
.attr b { text-align: right; }
.fit { display: flex; gap: 6px; flex-wrap: wrap; }
.fit span { border: 1px solid var(--line); padding: 2px 8px; font-size: 14px; }
.fit span b { margin-left: 4px; }
.footnote { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

/* ---------- tooltip ---------- */
.tooltip { position: fixed; z-index: 50; display: none; max-width: 260px; padding: 8px 10px; background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1.35; pointer-events: none; font-weight: 400; text-transform: none; letter-spacing: 0; box-shadow: 0 4px 14px rgb(0 0 0 / .3); }
[data-tip] { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
th[data-tip] { text-decoration: none; }

/* ---------- casa do jogo: cabeçalho, status, abas ---------- */
.gamehead { display: flex; gap: 16px 28px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.gamehead .head { min-width: 0; flex: 1 1 260px; }
.status { flex: 0 1 460px; min-width: min(100%, 300px); background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--hot); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 15px; }
.srow small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.srow > span, .srow > b { display: flex; flex-direction: column; min-width: 0; }
.srow small.muted { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
.ult { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.rl small { font-size: 12px; }
i.res { font-style: normal; font-weight: 800; width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 12px; color: #fff; flex: none; align-self: center; }
i.res.rV { background: var(--st-verde); } i.res.rE { background: #7d8a80; } i.res.rD { background: var(--st-vermelho); }
.status .btn { align-self: flex-start; font-size: 16px; padding: 8px 18px; }
.tabbtn { appearance: none; border: 0; background: transparent; padding: 7px 16px; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 16px; color: var(--muted); cursor: pointer; }
.tabbtn:hover { color: var(--ink); }
.tabbtn.on { background: var(--accent); color: var(--accent-ink); }
.tabs .soon { padding: 7px 16px; }
.btn.sm { font-size: 15px; padding: 7px 14px; }

/* plantel */
.plantelwrap { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.barpct { display: inline-flex; align-items: center; gap: 8px; }
.barpct b { font-size: 14px; min-width: 3.2ch; text-align: right; }
.bar.mini { width: 100%; height: 5px; display: block; }
.bad { color: #c0322a; font-weight: 700; } .warn { color: #a56d00; font-weight: 700; }
:root[data-theme="dark"] .bad { color: #ff7a6e; } :root[data-theme="dark"] .warn { color: var(--hot); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bad { color: #ff7a6e; } :root:not([data-theme="light"]) .warn { color: var(--hot); } }
.panel .media { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.panel .media b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.attrn { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 0; }
.attrn span { font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.attrn b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.meters { display: flex; flex-direction: column; gap: 8px; }
.meters > div { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.meters .bar { width: 100%; flex: 1; }
.meters .barpct { width: 100%; }
.meters .barpct .bar { width: auto; flex: 1; }

/* ---------- tabela ---------- */
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.subtabs .tabbtn { border: 1px solid var(--line); font-size: 15px; padding: 5px 14px; }
.subtabs .tabbtn.on { border-color: var(--accent); }
.ligabox { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .ligabox { grid-template-columns: minmax(0, 1fr); } }
table.liga td.z { color: var(--muted); font-size: 13px; width: 2.4em; }
table.liga tr.z-sobe td.z { box-shadow: inset 4px 0 var(--st-verde); }
table.liga tr.z-desce td.z { box-shadow: inset 4px 0 var(--st-vermelho); }
table.liga tr.meu td, table.liga tr.meu td.nm { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
.rodadas { display: flex; flex-direction: column; gap: 12px; }
.rodada, .jdiv { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.rodada h3, .jdiv h3 { font-size: 16px; margin-bottom: 6px; }
.rodada ul, .jdiv ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rodada li, .jdiv li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); font-size: 14px; align-items: baseline; }
.rodada .tc, .jdiv .tc { text-align: right; overflow-wrap: anywhere; } .rodada .tf, .jdiv .tf { overflow-wrap: anywhere; }
.pl { text-align: center; min-width: 3.6em; }
li.meu { background: color-mix(in srgb, var(--hot) 28%, transparent); font-weight: 700; }
.sw { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; } .sw.sobe { background: var(--st-verde); } .sw.desce { background: var(--st-vermelho); }
.ligalado { display: flex; flex-direction: column; gap: 10px; }
.campeao { font-size: 18px; }
.faseCopa { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
table.copa tr.meu td { background: color-mix(in srgb, var(--hot) 28%, var(--panel)); font-weight: 700; }
td.venc { font-weight: 800; color: var(--accent); }

/* ---------- escalação ---------- */
.escwrap { display: flex; flex-direction: column; gap: 12px; }
.esccontrols { display: flex; gap: 14px 28px; flex-wrap: wrap; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
.esccontrols > div { display: flex; flex-direction: column; gap: 4px; }
.esccontrols .seg { margin-top: 0; }
.escmsg { min-height: 1.4em; color: var(--muted); }
.escgrid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .escgrid { grid-template-columns: minmax(0, 1fr); } }
.campocol { display: flex; flex-direction: column; gap: 6px; }
.campo { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 82vh; background: repeating-linear-gradient(180deg, #1f6b3a 0 12.5%, #1b6035 12.5% 25%); color: rgb(255 255 255 / .55); border: 2px solid #0f3a21; }
.campo .linhas { position: absolute; inset: 0; }
.chip { position: absolute; transform: translate(-50%, -50%); width: 19.5%; min-width: 62px; background: #f5f8f1; color: #13241a; border: 2px solid #13241a; padding: 3px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; text-align: center; line-height: 1.1; font-size: 13px; }
.chip .cs { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #0b6e3f; } .chip .cs em { font-style: normal; color: #b45309; }
.chip b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cv { font-size: 12px; font-variant-numeric: tabular-nums; color: #3c4d41; }
.chip.fora { border-color: #d9780f; background: #fff3e2; }
.chip.sel { outline: 3px solid var(--hot); outline-offset: 1px; background: #fff6cc; }
.chip .bar { background: #c3d0c1; }
.lista { max-height: 82vh; overflow: auto; }
.lista tbody tr { cursor: pointer; }
.lista tbody tr:hover td { background: color-mix(in srgb, var(--hot) 20%, var(--panel)); }
tr.tit-row td { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
tr.indisp td { opacity: .55; }

/* ---------- jogo ao vivo ---------- */

.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; max-height: 360px; overflow: auto; }

.etag { font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 1px 6px; flex: none; background: var(--panel2); border: 1px solid var(--line); }
.etag.gol { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .etag.am { background: #f2c200; color: #1d1500; border-color: #f2c200; } .etag.vm { background: var(--st-vermelho); color: #fff; border-color: var(--st-vermelho); } .etag.les { background: var(--st-laranja); color: #1d1000; border-color: var(--st-laranja); }
.ev.gol { font-weight: 700; }
.joutros { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.jtit { font-size: 18px; }

@keyframes flash { 0% { background: var(--hot); color: var(--hot-ink); } 100% { background: transparent; } }
.subpanel { border: 2px solid var(--hot); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--panel2); }
.subtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.subtop .seg { margin-top: 0; }

i.cartao { display: inline-block; width: 9px; height: 13px; margin-left: 5px; vertical-align: middle; } i.cartao.am { background: #f2c200; } i.cartao.vm { background: var(--st-vermelho); }

/* ---------- resumo ---------- */
.resgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

.strow2 span:first-child { text-align: right; font-weight: 700; } .strow2 span:last-child { font-weight: 700; } .strow2 small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; text-align: center; }
.copainfo { font-size: 18px; }
.nota { display: inline-block; min-width: 3.2em; padding: 1px 6px; font-weight: 800; color: #fff; }
.nota.n-alta { background: #1f8a43; } .nota.n-boa { background: #5d9c2f; } .nota.n-media { background: #8a8f87; } .nota.n-baixa { background: #c0392b; }

/* ======== rodada 3: cores dos clubes, bandeiras, estrelas, ações, modais, moral do técnico ======== */
.escudo { display: inline-block; width: 14px; height: 14px; border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); flex: none; vertical-align: -2px; border-radius: 3px 3px 7px 7px; }

.panel .pn { display: flex; align-items: center; flex-wrap: wrap; }

.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid var(--line); padding-top: 12px; }

.kv .venda, td.venda { color: #8a5a00; font-weight: 700; } :root[data-theme="dark"] .kv .venda, :root[data-theme="dark"] td.venda { color: var(--hot); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kv .venda, :root:not([data-theme="light"]) td.venda { color: var(--hot); } }
td.treino, .kv .treino { color: var(--accent); font-weight: 700; }
.noticias { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--hot); padding: 8px 14px; }
.noticias h3 { font-size: 15px; margin-bottom: 4px; }
.noticias ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.noticias li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }

.rodape { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-end; }
.rodape > .footnote { flex: 1 1 280px; align-self: flex-start; }
.moraltec { flex: 0 1 380px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: min(100%, 300px); }
.mt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.mt-chart svg { width: 100%; height: auto; display: block; overflow: visible; }

.mt-chart .t { fill: var(--muted); font-size: 11px; font-family: var(--body); font-variant-numeric: tabular-nums; }

.mt-chart .r { font-size: 12px; font-weight: 800; font-family: var(--body); } .mt-chart .rV { fill: var(--accent); } .mt-chart .rD { fill: #c0392b; } .mt-chart .rE { fill: var(--muted); }
:root[data-theme="dark"] .mt-chart .rD { fill: #ff7a6e; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mt-chart .rD { fill: #ff7a6e; } }

/* janela modal */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgb(5 18 10 / .6); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; overflow: auto; }

.modal header h3 { font-size: 22px; overflow-wrap: anywhere; }
.modal .x { appearance: none; background: transparent; border: 0; font-size: 30px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 6px; }
.mbody { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* escalação: cartões do campo */

@media (max-width: 860px) { .escgrid { grid-template-columns: minmax(0, 1fr); } .cartao-jog { min-width: 64px; } .chip .cnome { font-size: 10px; } }

/* substituições: tabela com stamina e moral */

/* ======== rodada 4: emblemas, cores do clube no plantel, visão de clube, jogo ======== */
.escudo { width: 22px; height: 23px; border: 0; border-radius: 0; background: none !important; display: inline-flex; vertical-align: middle; flex: none; line-height: 0; }

/* jogo */

/* ======== melhorias 5: bingo, multi técnicos, finanças, resumo clicável ======== */
.strip .sub { font-size: 13px; color: var(--muted); font-weight: 400; display: block; }

        const dv = dri.p.attr.DRI * efM(dri) + (dri.p.trait === 'driblador' ? 6 : 0), mv = (mk.p.trait === 'desarmador' ? 3 : 0) + (mk.p.attr.DEF * 0.7 + mk.p.attr.RIT * 0.15 + mk.p.attr.FIS * 0.15) * efM(mk);
        if (!m.penPend && rng.chance(P().clamp(0.053 + (dv - mv) * kcDe(m) * 0.0020, 0.01, 0.15) * P().DISC_FALTA[mk.p.disciplina] * (mk.p.trait === 'desarmador' ? 0.6 : 1) * (dri.p.trait === 'driblador' ? 1.3 : 1) * (dri.p.trait === 'catimbeiro' ? 1.4 : 1))) {
          cometerFalta(m, d, mk, min, ev, dri.p.trait === 'catimbeiro' ? 1.5 : 1); dri.sofreu = (dri.sofreu || 0) + 1;
          if (rng.chance({ A: 0.24, M: 0.11, D: 0.02 }[GR(dri)] * (dri.p.trait === 'driblador' ? 1.3 : 1))) { if (A.manual) m.penPend = { lado: a, min, faltoso: mk.p.nome }; else cobrarPenalti(m, a, null, mk.p.nome); }
          else if (rng.chance(0.5)) cobrarFalta(m, a, ev, min);
        } else {
          const venceu = rng.chance(P().clamp(0.30 + (dv - mv) * kcDe(m) * 0.012, 0.06, 0.65));
          const pChute = P().clamp(0.378 + (dif > 0 ? dif * m.F[d].t.comp : dif) * 0.0065 + bonusContra + m.F[a].t.chute + m.F[a].mu.chute - (lead >= 2 ? 0.05 * (lead - 1) : 0)
            + (m.F[a].pas - m.F[d].pas) * 0.0038 + (m.F[a].rit - m.F[d].rit) * 0.0022 + (venceu ? 0.16 : 0) + CFG.baixoChute * (m.baixo || 0), 0.2, 0.75);
          const imped = m.F[d].t.offs > 0 && rng.chance(m.F[d].t.offs * (0.6 + 0.8 * m.F[a].t.props.dir) * P().clamp(1 - (m.F[a].rit - m.F[d].rit) * 0.02, 0.3, 1.5));
          if (imped) { stats[a].imp = (stats[a].imp || 0) + 1; }

            const cruz = LATERAIS.includes(passador.slot) && passador.slot !== 'PD' && passador.slot !== 'PE' ? rng.chance(0.32 * m.F[a].t.cruz) : (passador.slot === 'PD' || passador.slot === 'PE') && rng.chance(0.2 * m.F[a].t.cruz);
            const marc = mk, mEff = (marc.p.attr.DEF * 0.7 + marc.p.attr.RIT * 0.15 + marc.p.attr.FIS * 0.15) * efM(marc);
            let r;
            if (cruz) {
              const hd = sorteia(A, rng, ['A', 'M', 'D'], (j) => (j === passador ? 0 : Math.pow(Math.max(cabDe(j) * efM(j), 5), 2) * { A: 4, M: 0.8, D: 0.3 }[GR(j)]));
              r = chutar(m, a, hd, passador, cabDe(hd) * efM(hd) + m.F[a].t.aereo + m.F[a].mu.qual, mEff * 0.95, 'cabeca', ev, min, { origem: 'cruzamento', cobrador: passador.p.nome });
            } else {
              const atk = sorteia(A, rng, ['A', 'M', 'D'], (j) => Math.pow(j.p.attr.CHU, 1.3) * { A: 4, M: 1.5, D: 0.25 }[GR(j)] * (j.p.trait === 'salvador' && j.entrou >= m.meio + 30 && A.gols <= D.gols ? 2 : 1));
              if (atk === passador) { passador.passes--; passador = sorteia(A, rng, ['G', 'M', 'A', 'D'], (j) => (j === atk ? 0 : pesoPas(j))); passador.passes++; }   // o passe final não vem do próprio finalizador
              const cara = rng.chance(CFG.caraP * (passador.p.trait === 'maestro' ? 1.9 : 1) * (atk.p.trait === 'matador' ? 1.2 : 1));
              r = chutar(m, a, atk, passador, (atk.p.attr.CHU * 0.7 + atk.p.attr.RIT * 0.15 + atk.p.attr.DRI * 0.15) * efM(atk) + m.F[a].t.qual + m.F[a].mu.qual * 0.5, mEff, 'bola', ev, min, cara ? { cara: true } : undefined);

      if (!m.penPend && rng.chance(PEN_P * fm)) {   // pênalti sem drible (mão na bola, toque): favorece quem mais ataca; o humano escolhe o batedor
        const pa = Math.pow(m.F[0].ataque, 1.6), pb = Math.pow(m.F[1].ataque, 1.6), a = rng.chance(pa / (pa + pb)) ? 0 : 1, d = 1 - a;
        const cj = S[d].campo.filter((j) => j.slot !== 'GOL'), fj = rng.weighted(cj.length ? cj : S[d].campo, (j) => P().DISC_FALTA[j.p.disciplina] * (1.2 - j.p.attr.DEF / 300));
        cometerFalta(m, d, fj, min, ev, 2.9);

      if (rng.chance(CFG.faltaBase * 1.7 * fm)) {

  }

  // leitura da escalação para a tela do técnico: sinergia, capitão e batedores sugeridos
  function analise(time) {
    const side = montar(time, bf.RNG.create(1)), sn = sinergia(side), nt = side.campo.filter((j) => j.slot !== 'GOL');
    const cob = side.campo.slice().sort((x, y) => cobrNota(y) - cobrNota(x))[0], esc = nt.slice().sort((x, y) => y.p.attr.PAS - x.p.attr.PAS)[0];

  }
  function fimDoTempo(m) { m.S.forEach((s, i) => { s.h1 = { tatica: s.time.tatica, tatica2: s.time.tatica2 || null, formacao: s.time.formacao, dif: s.gols - m.S[1 - i].gols }; }); }

  function finalizar(m) {
    const placar = placarDe(m);
    m.S.forEach((s, i) => { for (const j of s.todos.values()) j.nota = calcNota(j, i, placar); });
    m.terminou = true; m.eventos.forEach((e) => { e.rot = minTxt(m, e.min); });
    return { placar, prorr: m.prorr > 0, acr: m.acr.slice(), eventos: m.eventos, stats: m.stats.map((x) => ({ ...x, posse: Math.round(x.posse / Math.max(1, m.min) * 100) })), lados: m.S };
  }

  // Partida inteira de uma vez (simulação rápida). opts.intervalo(S, stats, eventos) é chamado aos 46'; opts.ia liga as trocas automáticas.
  function simular(timeCasa, timeFora, rng, opts = {}) {
    const m = criar(timeCasa, timeFora, rng);
    while (!acabou(m)) {
      const i = m.min + 1;
      if (m.min === m.meio) { if (opts.ia) m.S.forEach((s, k) => iaIntervalo(m, k)); if (opts.intervalo) opts.intervalo(m.S, m.stats, m.eventos); recalcular(m); }
      if (opts.ia && (i === 60 || i === 70 || i === 80)) m.S.forEach((s) => iaSubstituicoes(m, s));
      passo(m);
    }
    return finalizar(m);
  }

  // Troca automática do computador: tira quem está mais cansado (stamina < 75) e põe o melhor reserva para o slot.
  function iaSubstituicoes(m, s) {
    if (s.subs >= s.maxSubs) return;
    const cand = s.campo.filter((j) => j.slot !== 'GOL').sort((a, b) => a.p.stamina - b.p.stamina)[0];
    if (!cand || cand.p.stamina > 75) return;
    const livres = s.banco.filter((p) => p.lesao === 0 && p.pos !== 'GOL');
    if (!livres.length) return;
    const perd = s.gols <= m.S[1 - m.S.indexOf(s)].gols;
    const nota = (p) => P().ovrNoSlot(p, cand.slot) * (0.8 + p.stamina / 500) + (p.trait === 'salvador' && perd && m.min >= m.meio + 25 ? 8 : 0);
    const melhor = livres.sort((a, b) => nota(b) - nota(a))[0];
    substituirM(m, m.S.indexOf(s), cand.p.id, melhor.id, 'tática');
  }

  function expulsar(s, j, min, ev, lado, stats, motivo) {
    j.expulso = true; stats[lado].vermelhos++; ev(min, 'vermelho', lado, j, { motivo });
    const idx = s.campo.indexOf(j);
    s.campo = s.campo.filter((x) => x !== j); j.saiu = min;
    abrirVaga(s, j, idx, min, ev, lado, 'vermelho');
  }
  // técnico humano escolhe quem entra (vaga fica pendente); computador preenche na hora com o melhor reserva
  function abrirVaga(s, j, idx, min, ev, lado, motivo) {
    if (s.manual) { (s.vagas = s.vagas || []).push({ slot: j.slot, idx, nome: j.p.nome, motivo, pos: j.slot }); return; }
    preencherAuto(s, j.slot, idx, min, ev, lado, j.p.nome);
  }
  function preencherAuto(s, slot, idx, min, ev, lado, saiuNome) {
    if (s.subs >= s.maxSubs) return false;
    const ok = s.banco.filter((b) => b.lesao === 0 && b.stamina > 50); if (!ok.length) return false;
    const novoP = ok.sort((a, b) => P().ovrNoSlot(b, slot) - P().ovrNoSlot(a, slot))[0];
    s.banco = s.banco.filter((b) => b !== novoP); s.subs++;
    const nj = novo(novoP, slot); nj.entrou = min; s.todos.set(novoP.id, nj);
    s.campo.splice(Math.min(idx, s.campo.length), 0, nj);

    return true;
  }
  function preencherVaga(m, lado, entraId) {
    const s = m.S[lado], v = (s.vagas || [])[0]; if (!v) return { ok: false, motivo: 'Não há vaga a preencher.' };
    if (s.subs >= s.maxSubs) return { ok: false, motivo: 'Limite de ' + s.maxSubs + ' substituições atingido.' };
    const p = s.banco.find((b) => b.id === entraId); if (!p) return { ok: false, motivo: 'Escolha um jogador do banco.' };
    if (p.lesao > 0) return { ok: false, motivo: 'Jogador lesionado.' };
    s.banco = s.banco.filter((b) => b !== p); s.subs++;
    const nj = novo(p, v.slot); nj.entrou = m.min; s.todos.set(p.id, nj); s.campo.splice(Math.min(v.idx, s.campo.length), 0, nj);
    s.vagas.shift(); m.eventos.push({ min: m.min, tipo: 'substituicao', lado, jogador: p.nome, saiu: v.nome, motivo: 'vaga' }); recalcular(m);
    return { ok: true };
  }
  function ignorarVagas(m, lado) { m.S[lado].vagas = []; recalcular(m); }
  function resolverVagasAuto(m) {
    m.S.forEach((s, i) => { (s.vagas || []).forEach((v) => preencherAuto(s, v.slot, v.idx, m.min, (mm, t, l, j, x) => m.eventos.push({ min: mm, tipo: t, lado: l, jogador: j && j.p.nome, ...x }), i, v.nome)); s.vagas = []; });
    recalcular(m);
  }

  // --- pênalti: o resultado depende de finalização, moral e cansaço do batedor e da defesa do goleiro (~75% de conversão)
  const PEN_P = 0.0008;   // pênaltis sem drible; a maior parte nasce do duelo drible × marcação (total ≈ 0,3 por jogo)
  const PEN_DIR = [['canto esquerdo', 'no canto esquerdo', 0.20], ['canto direito', 'no canto direito', 0.20], ['ângulo esquerdo', 'no ângulo esquerdo', 0.12], ['ângulo direito', 'no ângulo direito', 0.12], ['meio', 'no meio do gol', 0.10], ['em cima do meio', 'em cima do meio', 0.07]];
  const PEN_SAVE = { 'canto esquerdo': 0.22, 'canto direito': 0.22, 'ângulo esquerdo': 0.05, 'ângulo direito': 0.05, 'meio': 0.30, 'em cima do meio': 0.10 };
  const penNota = (j) => ((j.p.attr.CHU * 0.65 + P().cobrDe(j.p) * 0.35) * 0.7 + j.p.moral * 0.3) * mStam(j.p.stamina);
  // Mando: em casa ajuda um pouco, fora atrapalha mais; o peso é menor com moral individual e do time altas (casa +, fora −).
  function ajusteMando(casa, moralInd, moralTime) {
    if (casa == null) return 0;
    const m = P().clamp((moralInd + moralTime) / 200, 0, 1);
    return casa ? 0.012 * (0.5 + m) : -0.02 * (1 - 0.8 * m);
  }
  // ctx = { casa: o batedor joga em casa?, mt: moral média do time do batedor, mtg: moral média do time do goleiro }
  function penaltiResultado(atk, gkj, rng, ctx) {
    ctx = ctx || {};
    const chu = atk.p.attr.CHU * 0.65 + P().cobrDe(atk.p) * 0.35, mor = atk.p.moral, gkd = gkj ? gkj.p.attr.DEF : 40;
    const adjB = ajusteMando(ctx.casa, mor, ctx.mt == null ? mor : ctx.mt);
    const adjG = ctx.casa == null ? 0 : ajusteMando(!ctx.casa, gkj ? gkj.p.moral : 60, ctx.mtg == null ? (gkj ? gkj.p.moral : 60) : ctx.mtg);
    const gkMod = gkj ? (0.88 + 0.12 * gkj.p.stamina / 100) * (0.85 + 0.3 * gkj.p.moral / 100) * (1 + 9 * adjG) : 1;
    const pMiss = P().clamp(0.125 - (chu - 55) * 0.0018 - (mor - 60) * 0.0008 + (100 - atk.p.stamina) * 0.0004 - adjB, 0.03, 0.26);
    if (rng.chance(pMiss)) {
      const r = rng.next();
      if (r < 0.45) return { desfecho: 'fora', noAlvo: false, frase: 'pra fora' };
      if (r < 0.75) { const e = rng.chance(0.5); return { desfecho: 'trave', noAlvo: false, frase: e ? 'na trave esquerda' : 'na trave direita' }; }
      return { desfecho: 'travessao', noAlvo: false, frase: 'no travessão' };
    }
    // quem finaliza bem procura os cantos e os ângulos
    const ang = P().clamp(1 + (chu - 55) * 0.012, 0.5, 1.8);
    const pesos = PEN_DIR.map(([k, , w]) => w * (k.startsWith('ângulo') ? ang : k === 'meio' ? 1 / ang : 1)), tot = pesos.reduce((x, y) => x + y, 0);
    let r = rng.next() * tot, i = 0; while (i < pesos.length - 1 && r > pesos[i]) { r -= pesos[i]; i++; }
    const [dir, frase] = PEN_DIR[i], gkf = P().clamp(1 + (gkd - 50) * 0.013, 0.55, 1.6) * P().clamp(1 - (chu - 50) * 0.003, 0.7, 1.2) * gkMod;
    const defendeu = rng.chance(P().clamp(PEN_SAVE[dir] * gkf * 0.74, 0.02, 0.6));
    return { desfecho: defendeu ? 'defendeu' : 'gol', noAlvo: true, direcao: dir, frase };
  }
  // t = { jog: [jogadores], gk: goleiro, pref: id do batedor preferido, casa: bool, mt: moral do time }
  function disputaPenaltis(tA, tB, rng) {
    const fila = (t) => {
      const l = t.jog.filter((p) => p !== t.gk).map((p) => ({ p })).sort((x, y) => penNota(y) - penNota(x)).map((j) => j.p);
      const i = l.findIndex((p) => p.id === t.pref); if (i > 0) l.unshift(l.splice(i, 1)[0]);
      return l.length ? l : [t.gk];
    };
    const fa = fila(tA), fb = fila(tB), gA = t2g(tA), gB = t2g(tB), r = [0, 0];
    function t2g(t) { return t.gk ? { p: t.gk } : null; }
    const bate = (t, f, g, k, adv) => penaltiResultado({ p: f[k % f.length] }, g, rng, { casa: t.casa, mt: t.mt, mtg: adv.mt }).desfecho === 'gol';
    for (let k = 0; k < 5; k++) { if (bate(tA, fa, gB, k, tB)) r[0]++; if (bate(tB, fb, gA, k, tA)) r[1]++; }
    for (let k = 5; r[0] === r[1] && k < 40; k++) { if (bate(tA, fa, gB, k, tB)) r[0]++; if (bate(tB, fb, gA, k, tA)) r[1]++; }
    if (r[0] === r[1]) r[rng.chance(0.5) ? 0 : 1]++;
    return r;
  }
  function cobrarPenalti(m, lado, batedorId, faltoso) {
    const { S, rng, stats } = m, min = m.min, A = S[lado], D = S[1 - lado];
    faltoso = faltoso || (m.penPend && m.penPend.faltoso); m.penPend = null;
    let atk = A.campo.find((j) => j.p.id === batedorId) || A.campo.find((j) => j.p.id === A.time.batedor);
    if (!atk) atk = A.campo.filter((j) => j.slot !== 'GOL').sort((x, y) => penNota(y) - penNota(x))[0] || A.campo[0];
    const gkj = D.campo.find((j) => j.slot === 'GOL'), mm = (s) => { const l = s.campo.filter((j) => !j.lesionado); return l.length ? l.reduce((a, j) => a + j.p.moral, 0) / l.length : 60; };
    const r = penaltiResultado(atk, gkj, rng, { casa: !!A.time.mando, mt: mm(A), mtg: mm(D) });
    stats[lado].chutes++; atk.chutes = (atk.chutes || 0) + 1;
    if (r.noAlvo) { stats[lado].no_gol++; atk.noGol = (atk.noGol || 0) + 1; }
    const entry = { ...r, lado, min, batedor: atk.p.nome, batedorId: atk.p.id, pos: atk.slot, goleiro: gkj && gkj.p.nome, faltoso, pop: !!(A.manual || D.manual), favorHumano: !!A.manual, contraHumano: !!D.manual, visto: false };
    (m.penLog = m.penLog || []).push(entry);
    if (r.desfecho === 'gol') { A.gols++; atk.g++; atk.p.gols++; m.eventos.push({ min, tipo: 'gol', lado, jogador: atk.p.nome, assist: null, pen: true, placar: [S[0].gols, S[1].gols] }); }
    else { if (r.desfecho === 'defendeu' && gkj) gkj.defesas++; m.eventos.push({ min, tipo: 'penalti', lado, jogador: atk.p.nome, desfecho: r.desfecho, goleiro: gkj && gkj.p.nome, texto: r.desfecho === 'defendeu' ? 'defendido por ' + (gkj ? gkj.p.nome : 'o goleiro') : 'chutou ' + r.frase }); }
    return entry;
  }

  function trocarForcado(s, j, min, rng, ev, lado) {
    const ok = s.subs < s.maxSubs ? s.banco.filter((b) => b.lesao === 0 && b.stamina > 50) : [];
    if (ok.length) {
      // escolhe o reserva de maior encaixe no slot
      const novoP = ok.sort((a, b) => P().ovrNoSlot(b, j.slot) - P().ovrNoSlot(a, j.slot))[0];
      s.banco = s.banco.filter((b) => b !== novoP); s.subs++;
      const nj = novo(novoP, j.slot); nj.entrou = min; s.todos.set(novoP.id, nj);
      s.campo[s.campo.indexOf(j)] = nj; j.saiu = min;
      ev(min, 'substituicao', lado, nj, { saiu: j.p.nome, motivo: 'lesão' });
    } else { s.campo = s.campo.filter((x) => x !== j); j.saiu = min; } // joga com 10
  }

  // Nota 0-10 (1 casa). Base 6.0; eventos somam/subtraem. Tempo jogado reduz o peso (quem entra aos 80' tende a 6.0).
  function calcNota(j, lado, placar) {
    const meu = placar[lado], adv = placar[1 - lado];
    const g = P().GRUPO[j.slot];
    let n = 6.0;
    n += 1.1 * j.g + 0.7 * j.ast;
    n += 0.18 * j.desarmes * (g === 'A' ? 1.3 : 1) + 0.035 * j.passes + (j.slot === 'GOL' ? 0.35 * j.defesas : 0);

  // ---- caixa negativo: moral cai a cada rodada; cartas da diretoria nas rodadas 1 e 4; leilão forçado na 5ª ----
  function leilaoForcado(g, c) {

// Aba Relatórios de testes: mostra os relatórios das baterias de teste e medições feitas no projeto (arquivos Markdown embutidos no jogo).
(function () {
  const K = window.K, h = K.h, G = K.G;
  const RELATORIOS = [{"id": "relatorios/01-mecanicas-e-balanceamento.md", "titulo": "Relatório da rodada de testes de mecânicas e balanceamento", "md": "# Kfoot 98 — Relatório da rodada de testes de mecânicas e balanceamento\n\nVersão testada: branch `claude/melhorias-5-xt6u1f`, commit `0133c8c` (pasta `kfoot98`).\nNada foi alterado no código, nada foi enviado ao repositório e o artefato não foi republicado. Este documento é só diagnóstico e proposta, para decidirmos juntos antes de implementar.\n\n## Como testei\n\nCarreguei o motor real do jogo (o mesmo código do `index.html`) em Node, sem a tela, e simulei em volume. No total foram cerca de **1,2 milhão de partidas**:\n\n| Bateria | Volume |\n|---|---|\n| Temporadas completas do mundo inteiro (80 clubes, liga + Copa), 8 anos seguidos, 3 lotes | ~120 mil jogos |\n| Matriz de táticas (4×4) e de formações (6×6), times de mesmo nível com elencos clonados | ~200 mil jogos |\n| Grade completa de 24 combinações (6 formações × 4 táticas) em todos contra todos | ~100 mil jogos |\n| Sensibilidade a atributos, posições, stamina e moral (um fator por vez) | ~250 mil jogos |\n| Substituições (6 políticas) | ~18 mil jogos |\n| 10 \"técnicos humanos\" de teste: 240 temporadas completas do mundo (24 mundos × 10 rodízios; cada personalidade jogou 240 temporadas de clube) | ~400 mil jogos |\n| Controle: os mesmos 10 clubes sob comando do computador (24 mundos, 240 temporadas de clube) | ~40 mil jogos |\n| Mundo de 25 anos sem intervenção, preço de ingresso, finanças | ~100 mil jogos |\n\nComo ler os números: \"ppg\" é pontos por jogo (vitória 3, empate 1). Num confronto entre times idênticos o valor esperado é cerca de **1,40** (não 1,00, porque há empates). O erro padrão típico é ±0,02 em cada célula, então diferenças menores que ~0,05 ppg não são distinguíveis de sorte.\n\nLimitações: testei o motor, não a interface. As escalações dos técnicos de teste foram automáticas (o jogo escolhe os 11 melhores disponíveis); só formação, tática e ajustes de intervalo variaram entre as personalidades.\n\n---\n\n## Resumo em uma página\n\n1. **O motor em si está saudável.** 2,7 gols/jogo, mandante vence 42%, empate 24%, visitante 34%. Favorito por prestígio ganha mais, mas azarão ainda vence (com +30 de prestígio o mandante vence 65–70%).\n2. **A qualidade dos jogadores domina tudo; táticas e formações movem pouco.** Cada ponto de overall do time vale ~0,085 ppg. A melhor combinação tática contra a pior vale ~0,17 ppg, ou seja, ~2 pontos de overall. Entre os 10 técnicos de teste, do melhor ao pior deu 0,09 ppg (cerca de 1,3 posição na tabela por ano). O jogador humano dificilmente \"vê\" a diferença das suas escolhas na classificação.\n3. **Stamina praticamente não existe como mecânica de gestão.** Todo titular chega ao apito inicial com ~100% (recupera tudo em 2 dias), perde ~19 pontos durante o jogo, e as substituições da IA e as manuais valem zero (+0,003 ppg). Só que o efeito de stamina baixa seria enorme (cada −10 de stamina inicial custa −0,13 ppg). O problema é que nunca chega a acontecer.\n4. **Moral do jogador pesa bastante, mas vira bola de neve.** Time com moral 0 vs 100 vale 0,47 ppg (~5,5 pontos de overall). O terço de baixo da tabela perde ~23 pontos de moral numa temporada (57 → 34) e o de cima fica estável (~66): quem vai mal piora. Já a **moral do técnico quase não tem consequência** (±1 de moral por jogo no elenco, sem demissão, sem efeito nos clubes do computador).\n5. **Lotação**: os fatores são previsíveis e o humano tem alavancas, mas há **um bug de preço** (explicação abaixo) e, nos clubes de Série D que o humano recebe, o estádio fica em 3–13% e ampliar nunca se paga.\n6. **Defensores valem 4 vezes menos que atacantes** na prática (+10 de overall num zagueiro dá +0,03 ppg; num centroavante, +0,16). O mercado não percebe isso: compra-se atacante e goleiro, nunca defensor.\n7. **O mundo envelhece sozinho.** Clubes do computador nunca renovam elenco: em 20 anos a idade média vai de 26 para 47 e o overall dos times da Série A cai de 71 para 50. Antes disso, o prestígio fixo faz o campeão da Série A sair sempre dos mesmos 8 clubes (Corinthians 29% dos títulos em 72 temporadas) e a Copa do Brasil ir para um time da Série A em 97% das vezes.\n\n---\n\n## 1. Stamina\n\n**Como funciona hoje:** perda por jogo = (26 − FIS×0,13)/90 por minuto, ×1,1 se ofensivo, ×0,95 se defensivo, ×fator de idade. Recuperação = (6 + FIS×0,08) por dia de descanso × fator de idade. A força do jogador é multiplicada por 0,70 + 0,30 × stamina/100.\n\n**O que medi:**\n\n| Medida | Resultado |\n|---|---|\n| Stamina dos titulares no apito inicial (milhares de amostras) | média 99,9; percentil 10 = 100; mínimo 26–36 (só após lesão) |\n| Stamina dos titulares no fim do jogo | média ~81 |\n| Titulares com 32+ anos no apito inicial | média 99,9 |\n| Efeito de começar com stamina menor (todo o time, adversário a 100) | 90 → −0,13 ppg · 80 → −0,29 · 70 → −0,42 · 60 → −0,57 · 50 → −0,72 |\n| Substituições (trocar os 3 mais cansados aos 60', ao intervalo, escalonado, política da IA, nenhuma) | todas entre 1,363 e 1,366 ppg, ou seja, **zero diferença** |\n| Trocas por jogo | IA: 0,13 (quase só lesões); manual agressivo: 0,9 |\n\n**Conclusão:** a fórmula de efeito é forte, mas o descanso entre jogos (3–4 dias × 10–13 de recuperação por dia) é folgado demais e apaga todo o desgaste. Resultado: o jogador humano nunca precisa rodar o elenco, e as 3 substituições de 1998 não servem para nada além de lesão. O reserva é pior que o titular e o ganho de fôlego (~5% de força no fim) não compensa.\n\n**Propostas (da mais simples à mais ambiciosa):**\n- **A (recomendo):** reduzir a recuperação para ~3–4 por dia (e deixar o FIS e a idade pesarem mais). Titulares que jogam toda semana ficariam em 80–90 no apito inicial, e rodar o elenco passa a valer a pena.\n- **B:** a IA do computador também trocar por stamina \u003c 65 (hoje \u003c 45), para os adversários não parecerem \"robôs de 90 minutos\".\n- **C:** dar valor às substituições: o jogador que entra ganha um pequeno bônus de \"pernas frescas\" nos primeiros 20 minutos, ou o ganho de stamina entra na equação da substituição.\n- Qualquer uma exige reavaliar o impacto: cada −10 de stamina inicial custa 0,13 ppg, então uma recuperação muito curta deixaria o jogo punitivo.\n\n## 2. Moral do jogador e do técnico\n\n**Como funciona hoje:** o multiplicador de força vai de 0,95 (moral 0) a 1,05 (moral 100). A moral muda a cada jogo em `(nota − 6,3) × 5`; quem não joga puxa para 50 com −1 por jogo (equilíbrio em ~25). A moral do técnico muda ±8 por resultado (mais contra time maior) e repassa `(moral do técnico − 50) × 0,02` para o elenco, só dos clubes humanos.\n\n**O que medi:**\n\n| Medida | Resultado |\n|---|---|\n| Efeito da moral do time (adversário a 65) | 0 → 1,05 ppg · 25 → 1,18 · 45 → 1,27 · 65 → 1,36 · 85 → 1,45 · 100 → 1,52 |\n| Moral média dos 14 melhores, ao longo das rodadas 6 → 36 (Série A) | 1º terço: 66 → 66 · 2º terço: 62 → 55 · último terço: 57 → 34 |\n| Série D, mesma conta | 1º terço: 63 → 65 · 2º: 58 → 53 · último: 55 → 39 |\n| Moral dos titulares (todas as divisões) | média 60, percentil 10 = 32, percentil 90 = 97 |\n| Moral dos reservas (fora dos 14 melhores) | média 43 |\n| Moral do técnico ao fim da temporada | 1º terço: 83 · 2º: 57 · último: 27 |\n| Técnico com moral ≥ 95 durante o ano | 22% do tempo no 1º terço |\n\n**Conclusões:**\n- A moral é uma alavanca **forte** (a faixa típica de 35 a 95 já mexe ~0,3 ppg, o mesmo que +3,5 de overall), mas ela é **autorreforçada**: ganhar sobe a moral, que ajuda a ganhar. Um time que entra em má fase tem pouco como reagir, porque o humano não tem nenhuma ação de moral (conversa, prêmio, folga). O que sobra é jogar melhor.\n- A **moral do técnico não tem consequência real**: não há demissão, nem pressão da diretoria, e o repasse ao elenco é ±1 por jogo no máximo, só no clube humano. Hoje ela é um painel bonito.\n- Reservas ficam em ~25–45 de moral, então quando alguém precisa jogar (lesão) entra deprimido.\n\n**Propostas:**\n- **A (recomendo):** dar ao humano pelo menos uma ação de moral (prêmio por vitória, folga extra, conversa no vestiário) com custo em dinheiro ou stamina, e um freio na espiral (ex.: moral de quem perde tende a parar em ~40, em vez de cair sem fim).\n- **B:** dar consequência à moral do técnico: abaixo de ~20 por N jogos a diretoria avisa e depois demite (game over no single player, ou perda de pontos de patrocínio); acima de 80, bônus em negociação/patrocínio.\n- **C:** estreitar a faixa do multiplicador (0,97–1,03) se acharmos a espiral forte demais. É decisão de design: hoje ela recompensa boas campanhas, mas também pune demais as ruins.\n- **D:** deixar reservas que entram em campo recuperarem moral mais rápido (ou não caírem abaixo de ~40).\n\n## 3. Lotação dos estádios\n\n**Fórmula atual:** `público = demanda_do_clube × (1 + 0,35 × forma) × rival × (preço/preço_padrão)^−1,3 × ruído(±8%)`, com teto na capacidade e piso de 3% da capacidade. `demanda = 25 × prestígio^1,55 × k_divisão`.\n\n**Fatores que influenciam (e os que não influenciam):**\n\n| Fator | Efeito | Observação |\n|---|---|---|\n| Prestígio do mandante | base da demanda (~87× entre o maior e o menor clube) | fixo para sempre, nunca muda com campanhas |\n| Forma (últimos 5 jogos, qualquer competição) | ×0,65 (5 derrotas) a ×1,35 (5 vitórias) | conta só V/E/D: perder 0×5 ou 0×1 é igual; goleada a favor não ajuda |\n| Adversário | ×(1 + (prest. visitante − prest. mandante)/200), limitado a 0,90–1,30 | jogar contra time grande rende no máximo +30% |\n| Clássico (mesma cidade) | ×1,25 | só Rio, São Paulo, Belém etc.; vale para clubes pequenos também |\n| Preço do ingresso | (preço/padrão)^−1,3, de ×0,5 a ×3 | elasticidade fixa |\n| Ruído | ±8% por jogo | |\n| **Não influenciam** | posição na tabela, decisão/final, fase da Copa, dia da semana, nível/conforto do estádio, gols vistos, ano a ano | |\n\n**Resultados medidos (liga, 72 temporadas):**\n\n| Divisão | Lotação média | Jogos lotados | Menor / maior clube |\n|---|---|---|---|\n| A | 54% | 6% | 20% / 93% |\n| B | 38% | 2% | 14% / 93% |\n| C | 21% | 0% | 10% / 58% |\n| D | 12% | 0% | 3% / 26% |\n\nGrandes estádios dão lotação baixa (Flamengo 32%, Botafogo 20%, São Paulo 39%) e os pequenos de sucesso lotam (Palmeiras 91%, Santos 93%). É coerente com o Brasil da época, mas tem efeito de jogo:\n- **Ampliar o estádio quase nunca se paga**: das 30 equipes que analisei, só Santos (retorno 1,5 ano), Portuguesa (1,5), Palmeiras (4,4) e Atlético-PR (4,8) têm demanda acima da capacidade. Nos 10 clubes que o humano pode receber (Série D), nunca (demanda = 3–12% da capacidade).\n- **O humano recebe clubes com 3–12% de lotação** (Bangu 8%, Guarany de Bagé 3,5%). Mesmo com preço ×0,5, forma +1, clássico e rival grande, o teto teórico é 19–70%.\n\n### Bug confirmado: o piso de 3% permite explorar o preço\n\nO piso (3% da capacidade) é aplicado depois do efeito do preço. Quando a demanda cai abaixo do piso, o público trava no piso e subir o preço deixa de afastar torcida. Medi no jogo real (média de 3 temporadas, bilheteria anual em R$ mil / público médio):\n\n| Clube | Preço padrão (R$4) | ×0,5 (R$2) | ×3 (R$12) |\n|---|---|---|---|\n| Marília | 79 mil / 926 | 97 mil / 2.279 | **146 mil / 570** |\n| Guarany de Bagé | 27 mil / 331 | 31 mil / 783 | **72 mil / 298** |\n| Bangu | 124 mil / 1.522 | 152 mil / 3.747 | 125 mil / 514 |\n\nEm clubes muito pequenos o preço máximo rende 2 a 2,7× mais que o padrão sem perder público, e o preço mínimo (que seria o \"ótimo\" teórico, receita ∝ preço^−0,3) também rende mais que o padrão. A curva de receita fica em \"U\", com dois ótimos, um deles absurdo.\n\n### Economia dos clubes que o humano recebe (Série D)\n\nSem mexer em nada, 1 temporada: receita R$106–204 mil (TV fixa de R$80 mil é a maior parte), despesa R$115–149 mil, saldo de −R$9 mil a +R$56 mil, caixa inicial R$74–96 mil. O patrocínio melhor (Cola Colinha, R$47–60 mil/ano, aceita com 54–60%) praticamente dobra o saldo. É apertado, mas jogável, e o patrocínio é a decisão com mais peso.\n\n**Propostas:**\n- **A (corrigir já):** aplicar o piso antes do efeito do preço, ou fazer o piso valer só até o preço padrão, para eliminar a exploração.\n- **B:** incluir no cálculo a posição na tabela e o saldo de gols na forma (hoje só V/E/D), para o humano sentir recompensa por goleadas e por briga de título.\n- **C:** fazer o prestígio mudar com os resultados (título +, rebaixamento −, campanha de Copa +), mesmo que lento. Hoje só a troca de divisão altera a demanda.\n- **D:** dar ao humano de clube pequeno ferramentas além do preço: campanha de sócios/promoção de ingresso (custo fixo, efeito de demanda por N jogos), jogo-evento, ou sócio-torcedor.\n- **E:** se quisermos que ampliar estádio seja decisão real, a demanda dos clubes médios precisa chegar perto da capacidade; ou então tirar as obras da tela para os clubes onde nunca fazem sentido.\n\n## 4. Atributos, posições, táticas e formações\n\n### 4.1 Atributos (+10 em um atributo nos 11 titulares, adversário igual)\n\n| Atributo | ppg | Δ vs base (1,356) |\n|---|---|---|\n| CHU (chute) | 1,629 | **+0,27** |\n| DEF (defesa) | 1,568 | **+0,21** |\n| FIS (físico) | 1,458 | +0,10 |\n| DRI (drible) | 1,452 | +0,10 |\n| PAS (passe) | 1,449 | +0,09 |\n| RIT (ritmo) | 1,435 | +0,08 |\n| Todos +5 | 1,798 | +0,44 |\n| Todos +10 | 2,186 | +0,83 |\n| Todos −5 | 0,951 | −0,40 |\n\nCada ponto de overall no time inteiro vale ~**0,085 ppg** (≈3,2 pontos num campeonato de 38 jogos). Chute e defesa são ~3× mais valiosos que ritmo/passe. Isso é intencional (o peso por posição define), mas não fica claro ao jogador, que vê seis barras do mesmo tamanho.\n\n### 4.2 Valor de cada posição (+10 de overall em um único jogador, 4-4-2)\n\n| Posição | Δ ppg |\n|---|---|\n| Centroavante (CA) | **+0,16** |\n| Segundo atacante (SA) | +0,15 |\n| Goleiro | +0,13 |\n| Volante / Meia central | +0,09 |\n| Ala | +0,08 |\n| Zagueiro / Lateral | **+0,03 a +0,04** |\n| 4 defensores juntos | +0,145 |\n| 4 meias juntos | +0,36 |\n| 2 atacantes juntos | +0,30 |\n\nUm zagueiro bom vale 4× menos que um centroavante bom, mas o mercado (`valorMercado`) cobra o mesmo por overall igual em qualquer posição. Para o humano que perceber isso, a estratégia dominante é comprar atacantes, meias e goleiro e nunca gastar com defensores (a defesa pesa pouco porque a força defensiva usa a média dos defensores, não a soma, e o goleiro absorve 30%).\n\n### 4.3 Táticas (pontos por jogo da linha contra a coluna, times idênticos, 4-4-2)\n\n| | Ofensivo | Equilibrado | Defensivo | Contra |\n|---|---|---|---|---|\n| **Ofensivo** | 1,38 | 1,45 | 1,44 | **1,28** |\n| **Equilibrado** | 1,36 | 1,40 | 1,40 | 1,47 |\n| **Defensivo** | 1,35 | 1,41 | 1,39 | **1,56** |\n| **Contra** | **1,50** | 1,31 | **1,19** | 1,37 |\n| média | 1,39 | 1,40 | 1,42 | 1,34 |\n\nGols por jogo: ofensivo 2,86, equilibrado 2,59, contra 2,44, defensivo 2,34. O ciclo \"pedra-papel-tesoura\" existe (contra bate ofensivo; ofensivo bate defensivo e equilibrado; defensivo e equilibrado batem contra) e muda o estilo do jogo, mas **contra só vence o ofensivo e perde de todo o resto** (média 1,34, a pior). A diferença máxima de uma célula (1,19 a 1,56) é ±0,18 ppg, e nenhuma tática é dominante em média.\n\n### 4.4 Formações (tática equilibrada, linha contra coluna)\n\n| | 4-3-3 | 4-2-3-1 | 4-4-2 | 4-5-1 | 3-5-2 | 3-4-3 | média |\n|---|---|---|---|---|---|---|---|\n| 4-3-3 | 1,40 | 1,31 | 1,37 | 1,31 | 1,33 | 1,37 | 1,35 |\n| 4-2-3-1 | 1,49 | 1,42 | 1,46 | 1,40 | 1,41 | 1,49 | **1,45** |\n| 4-4-2 | 1,43 | 1,33 | 1,40 | 1,33 | 1,34 | 1,41 | 1,37 |\n| 4-5-1 | 1,49 | 1,40 | 1,46 | 1,39 | 1,39 | 1,47 | 1,43 |\n| 3-5-2 | 1,50 | 1,41 | 1,47 | 1,40 | 1,41 | 1,49 | **1,45** |\n| 3-4-3 | 1,42 | 1,33 | 1,39 | 1,32 | 1,34 | 1,37 | 1,36 |\n\nHá três formações melhores (4-2-3-1, 3-5-2, 4-5-1: +0,06 a +0,10 ppg) e três piores (4-3-3, 3-4-3, 4-4-2). O motivo é o bônus de **controle de bola** (`ctl` +3% a +4%) nas três primeiras, que pesa mais que os bônus de ataque do 4-3-3 e do 3-4-3. Na prática o \"time ofensivo clássico\" (4-3-3 ofensivo) é o 21º de 24 combos.\n\n### 4.5 Ranking das 24 combinações (todos contra todos, ~4.100 jogos cada, ±0,02)\n\nMelhores: 4-2-3-1 defensivo (1,451) · 3-5-2 defensivo (1,451) · 4-2-3-1 equilibrado (1,450) · 3-5-2 ofensivo (1,436).\nPiores: 4-3-3 contra (1,276) · 4-4-2 contra (1,282) · 3-4-3 contra (1,295) · 4-3-3 ofensivo (1,306).\nAmplitude total: 0,175 ppg ≈ 2 pontos de overall.\n\nA IA usa 4-3-3 ofensivo quando é bem mais forte e 4-5-1 (contra ou defensivo) quando é bem mais fraca. Ou seja, **os times grandes do computador jogam com uma das piores combinações**, o que ajuda um pouco o humano.\n\n## 5. Teste com 10 técnicos humanos (personalidades)\n\n**Desenho:** 10 clubes de Série D (os que o humano pode receber). Cada personalidade jogou 240 temporadas de clube (24 mundos × 10 rodízios, passando por todos os clubes e elencos). Escalação automática dos melhores 11; só formação/tática/ajuste de intervalo variaram. Controle: os mesmos clubes sob a IA.\n\n| Personalidade | ppg | Gols pró | Gols contra | Posição média (de 20) |\n|---|---|---|---|---|\n| G Camaleão (adapta ao rival: ofensivo se mais forte, contra se mais fraco) | **1,179** | 0,97 | 1,22 | 13,7 |\n| D Retranca (4-5-1 defensivo) | **1,174** | 0,90 | 1,15 | 13,5 |\n| H Otimizado (4-2-3-1 defensivo) | 1,149 | 0,87 | 1,15 | 14,1 |\n| B Contra-ataque (4-5-1 contra) | 1,146 | 0,93 | 1,22 | 14,1 |\n| E Controlador (3-5-2 equilibrado) | 1,145 | 0,96 | 1,28 | 14,3 |\n| F Kamikaze (3-4-3 ofensivo) | 1,140 | 1,01 | 1,36 | 14,3 |\n| I Reativo (4-4-2; muda no intervalo) | 1,108 | 0,92 | 1,31 | 14,6 |\n| J Mandante ofensivo / visitante retranca | 1,102 | 0,93 | 1,27 | 14,7 |\n| A Ofensivo (4-3-3 ofensivo) | 1,085 | 0,97 | 1,40 | 14,7 |\n| C Equilibrado (4-4-2 equilibrado) | 1,085 | 0,92 | 1,31 | 15,0 |\n| *Controle: IA nos mesmos clubes* | *1,104* | *0,93* | *1,28* | *14,8* |\n\n(Erro padrão ≈ ±0,02 ppg por personalidade.)\n\n**Leitura:**\n- As escolhas **fazem diferença estatística**, mas pequena: o melhor técnico de teste ganha ~0,075 ppg a mais que a IA (~2,8 pontos por temporada, ~1 posição). O ofensivo e o equilibrado ficam no nível da IA (ou abaixo).\n- As diferenças mais visíveis são **no estilo**, não no resultado: o Kamikaze marca 1,01 gol/jogo e sofre 1,36; a Retranca marca 0,90 e sofre 1,15. Isso o jogador sente nos jogos, mas a classificação praticamente não registra.\n- A personalidade que mais ganha (Camaleão) é a que **lê o adversário**. Isso é bom: premia quem estuda o jogo. Mas o jogador só percebe se a interface mostrar o que o adversário vai fazer.\n- Mudança de tática no intervalo (Reativo) não ajudou (1,108 vs 1,085 do equilibrado puro; dentro do ruído).\n- A lotação média foi idêntica entre personalidades (8,5% a 8,7%), porque a diferença de resultados é pequena demais para a \"forma\" mexer no público.\n\n## 6. Estrutura do campeonato e do mundo (bônus: achados fora do pedido)\n\n- **Prestígio é fixo.** Em 72 temporadas, todos os campeões da Série A saíram de 8 clubes: Corinthians 21 (29%), Flamengo 14, São Paulo 13, Palmeiras 9, Grêmio 6, Vasco 4, Cruzeiro 3, Internacional 2. A correlação prestígio × pontos é 0,75–0,80 na Série A. A Copa do Brasil foi vencida por um time da Série A em 70 de 72 edições.\n- **O mundo envelhece sem reposição.** Só clubes humanos recebem juniores e só humanos perdem contrato (o computador renova sozinho). Simulei 25 anos sem humanos: idade média 25,8 → 47,8; overall dos 14 melhores de Série A 70,9 → 49,7 (D: 48,4 → 27,6). Os primeiros 5 anos são estáveis; depois cai ~1,5 ponto por ano. Não aparece em partidas curtas de teste, mas em campanhas de 10+ anos o jogo degrada.\n- **Disciplina:** 3,0 amarelos e 0,19 vermelhos por jogo, 0,27 lesões por jogo (~0,45 lesionados por clube em qualquer momento). Valores plausíveis.\n- **Gols por divisão:** A 3,1 · B 2,8 · C 2,7 · D 2,4. A Série A tem mais gols que as demais (efeito da média de qualidade mais alta); não é problema.\n\n## 7. Propostas priorizadas\n\n| # | Mudança | Impacto | Esforço | Recomendação |\n|---|---|---|---|---|\n| 1 | Corrigir o piso de 3% do público (exploração de preço) | Evita estratégia absurda em clubes humanos | Baixo | **Fazer** |\n| 2 | Reposição e aposentadoria de jogadores para o computador (juniores, retirada ~36–38) | Torna campanhas longas viáveis | Médio | **Fazer** |\n| 3 | Dar valor à stamina (recuperação mais lenta + IA troca em stamina \u003c 65) | Faz rodízio e substituição terem sentido | Baixo, mas exige ajuste fino | **Fazer, testando** |\n| 4 | Reequilibrar peso dos defensores e/ou preço de mercado por posição | Fecha a estratégia dominante de \"só atacante\" | Baixo/médio | **Fazer** |\n| 5 | Ajustar formações para que 4-3-3 e 3-4-3 não sejam inferiores (bônus de ataque ou penalidade menor no `ctl` das três melhores) | Mais variedade real de escolha | Baixo | **Fazer** |\n| 6 | Dar ações e consequências à moral (prêmio, conversa, demissão do técnico) | Tira a moral de \"painel\" e dá agência | Médio | **Discutir** |\n| 7 | Mostrar ao jogador o que o adversário vai fazer e o efeito de cada escolha (relatório tático pré e pós-jogo) | Faz a diferença de 0,1 ppg ser perceptível | Médio | **Discutir** |\n| 8 | Prestígio dinâmico (título, rebaixamento, Copa) | Mais variedade de campeões e demanda | Médio | **Discutir** |\n| 9 | Ferramentas de público para clube pequeno (campanha de sócios, jogo-evento) | Dá o que fazer com a bilheteria da Série D | Médio | **Discutir** |\n| 10 | Incluir saldo de gols/posição na forma que afeta o público | Realismo e recompensa de goleadas | Baixo | Opcional |\n| 11 | Alargar o efeito de táticas/formações (ex.: dobrar os modificadores) | Escolhas valem ~2 pontos de overall em vez de ~1 | Baixo | **Decisão de design** |\n\n## 8. Onde mais devemos testar\n\n1. **Mercado, contratos e treinamento**: compra/venda/leilão, renovação, salário vs valor, treino de atributos (`concluirTreino`), juniores. Não toquei nisso e há bastante dinheiro e progressão em jogo.\n2. **Campanhas longas com humano** (10+ anos): evolução de atributos, envelhecimento do próprio elenco, fluxo de caixa com compras, dificuldade de manter o clube.\n3. **Progressão de atributos** (`aplicarPosJogo`, `virarAno`): ritmo de crescimento de jovens, queda de veteranos, retorno decrescente.\n4. **Escalação manual** (fora de posição, `afinidade`): testei só a escalação automática; falta medir quanto custa colocar um jogador fora da posição e se compensa.\n5. **Copa do Brasil**: sorteio, mata-mata de 64 clubes, impacto de pênaltis (76% de acerto fixo), calendário apertado.\n6. **Jogo pela interface** (clique a clique): ergonomia das telas de tática, moral, finanças e se o jogador entende os efeitos. Meus testes foram no motor.\n7. **Multiplayer e determinismo**: confirmar que servidor e clientes chegam aos mesmos resultados com mesma semente, com os 10 técnicos humanos ao mesmo tempo.\n8. **Séries B e C** com humano: só testei Série D (é onde o humano começa), mas promoção/rebaixamento muda demanda e custos.\n\n## Apêndice — Scripts\n\nOs scripts que usei estão em `scripts/` (Node; carregam o `index.html` da branch e simulam o motor real): `exp1` baseline e finanças, `exp2` matrizes de tática/formação, `exp3` atributos, posições, stamina e moral, `exp4` lotação (fórmulas), `exp5` substituições, `exp6` grade 24×24, `exp7` dinâmica de moral, `exp8` técnicos humanos, `exp9` mundo em 25 anos, `exp10` preço de ingresso, `exp11` economia da Série D.\n"}, {"id": "relatorios/02-medicoes-melhorias-14-15.md", "titulo": "Medições das Melhorias #14 e #15", "md": "# Medições das Melhorias #14 e #15\n\nMedidas feitas com o motor real do jogo em Node, sem a tela, antes e depois de cada mudança. Os scripts ficam no laboratório de simulação do projeto.\n\n## Copa do Brasil: placares entre grandes e pequenos\n\nCada confronto são duas partidas (ida e volta) entre elencos gerados com o prestígio indicado, 400 confrontos por linha. \"Maior agregado\" é o maior número de gols de um dos lados somando as duas partidas.\n\n| Confronto (prestígio) | Antes: mediana / p90 / máximo | Depois: mediana / p90 / máximo | Favorito avança (depois) |\n|---|---|---|---|\n| 85 × 15 | 8 / 11 / 16 | 5 / 7 / 10 | 92% |\n| 85 × 30 | 6 / 10 / 14 | 4 / 7 / 9 | 85% |\n| 70 × 20 | 6 / 9 / 12 | 4 / 7 / 9 | 81% |\n| 60 × 40 | 4 / 6 / 9 | 3 / 5 / 8 | 58% |\n| 50 × 50 | 4 / 6 / 9 | 3 / 5 / 8 | 36% (casa) |\n\nO que mudou: nos jogos da Copa as forças de ataque, defesa e controle dos dois times se aproximam da média (fator 0,45), e o time que abre 2 ou mais gols poupa o jogo (menos ataques e chutes). A liga não foi alterada.\n\n## Lesões\n\n| Medida | Antes | Depois |\n|---|---|---|\n| Lesões por jogo (os dois times) | 0,28 | 0,14 |\n\nA chance agora depende da stamina do jogador: cansado se lesiona até cerca de 2,3 vezes mais que descansado.\n\n## Caixa inicial e o que ele compra\n\n| Série | Caixa mediano antes | Caixa mediano depois |\n|---|---|---|\n| A | R$ 13,8 mi | R$ 13,8 mi |\n| B | R$ 2,7 mi | R$ 3,6 mi |\n| C | R$ 600 mil | R$ 1,1 mi |\n| D | R$ 100 mil | R$ 540 mil |\n\nMelhor jogador comprável por um clube da Série D, medido pela média do jogador (os titulares da D têm média 54,7):\n\n| Caixa | Série C | Série B | Série A |\n|---|---|---|---|\n| R$ 100 mil | 58 | 58 | 60 |\n| R$ 540 mil | 60 | 67 | 72 |\n\n## Premiações e acesso/rebaixamento (20 temporadas, mundo só com computador)\n\n- Os prêmios somam cerca de R$ 21 mi por ano para os 80 clubes.\n- A média de overall por série (14 melhores) ficou estável nos primeiros anos: Série A 71 → 70, B 62 → 61, C 55, D 49 → 48.\n- Rodando 20 anos **sem** os bônus de atributo e **com** eles, os números foram praticamente iguais: jogadores com finalização 90 ou mais chegaram a 52 sem bônus e 59 com bônus no ano 20.\n\n### Problemas que já existiam no motor (com ou sem prêmios)\n\n1. Nos anos finais o overall médio dos times da Série A cai de 71 para cerca de 67 e depois se recupera.\n2. Jogadores com finalização 90+ vão aumentando ao longo dos anos.\n3. Alguns clubes do computador ficam com caixa negativo depois de uns 15 anos.\n4. O artilheiro de uma série chegava a 60–70 gols; reduzi a concentração das finalizações e hoje fica em 25–50.\n\n## Pênaltis e gols\n\n2,58 gols por jogo; cerca de 0,34 pênalti por jogo; conversão de 75% a 80%.\n"}, {"id": "relatorios/03-bateria-detalhada.md", "titulo": "Relatório 2: bateria detalhada de balanceamento", "md": "# Kfoot 98 — Relatório 2: bateria detalhada de balanceamento\n\nVersão testada: branch `claude/melhorias-5-xt6u1f`, jogo na versão 17 (commit `2defbbd`, já com os prêmios extras: melhor goleiro, revelação, garçom e melhor técnico). Nada foi alterado no código, nada foi enviado ao repositório e o artefato não foi republicado. Este relatório é só diagnóstico e proposta, para decidirmos juntos.\n\n## Como testei\n\nCarreguei o motor real do jogo em Node, sem a tela, e simulei em volume. Usei o mesmo código que roda no navegador, incluindo tática, formação, sinergia, leitura de intervalo, stamina dinâmica, moral, lesões, pênaltis, Copa nivelada, aposentadorias e premiações.\n\n| Bateria | Volume |\n|---|---|\n| Mundo inteiro (80 clubes, liga e Copa), 12 mundos de 10 temporadas | ~200 mil jogos de liga |\n| Goleiro e posições trocadas (atacante no gol etc.) | ~100 mil jogos |\n| ±10 de overall por posição e por atributo, atributos com mesmo overall | ~250 mil jogos |\n| Stamina inicial, moral, substituições, rodízio, intervalo | ~150 mil jogos |\n| Táticas (4×4), formações (6×6) e grade de 24 combinações | ~160 mil jogos |\n| 10 estilos de técnico humano, 240 temporadas de clube cada | ~400 mil jogos |\n| 5 níveis de habilidade em 10 clubes de todas as séries, 240 temporadas cada, mais campanhas de 3 anos | ~500 mil jogos |\n| Copa nivelada, moral ao longo da temporada, mundo de 25 anos | ~100 mil jogos |\n\nLeitura dos números: ppg é pontos por jogo (vitória 3, empate 1). Entre times idênticos o esperado é cerca de 1,35 a 1,40. O erro padrão típico é ±0,02 ppg nas baterias grandes, então diferenças menores que ~0,05 não se distinguem de sorte. GF e GC são gols feitos e sofridos por jogo.\n\nLimitações: testei o motor, não a interface. Os técnicos de teste não negociaram nada no mercado, não treinaram jogadores e escalaram automaticamente os 11 melhores. Isso significa que medi o efeito de formação, tática, intervalo e trocas, e não o efeito de montar elenco, que provavelmente é o principal caminho de evolução do jogador.\n\n---\n\n## Resumo em uma página\n\n1. **O motor já simula cada posição, e as trocas de posição punem de verdade.** Goleiro ruim sofre 23% mais gols. Um centroavante no gol sofre 61% mais gols (2,04 contra 1,27) e converte 48% dos chutes no alvo contra 34%. Quatro atacantes na defesa levam 2,28 gols por jogo e o time vale 0,58 ppg. O efeito existe e aponta na direção certa, mas é mais fraco do que seria no futebol: um jogador de linha no gol \"defende\" mais do que deveria.\n2. **O jogo é equilibrado no que importa, e tem caos suficiente.** 2,74 gols por jogo, mandante 40% / empate 24% / visitante 36%, 24% de jogos decididos por zero gols de diferença, 40% por um, 24% por dois. Um time 6 pontos de overall mais forte joga em casa e vence 59%, perde 19%.\n3. **A Série A é previsível demais.** A correlação entre força inicial e posição final é 0,87. O campeão foi o time mais forte em 38% das temporadas e esteve entre os 3 mais fortes em 74%. Em 120 temporadas só 8 clubes foram campeões e o Corinthians ganhou 35%.\n4. **Atributos, stamina e moral afetam o jogo, e isso é forte.** Moral de 0 para 100 vale 0,56 ppg. Stamina inicial 80 em vez de 100 custa 0,31 ppg. Cada ponto de overall do time vale ~0,085 ppg. Mas os atributos não são iguais: chute (CHU) e defesa (DEF) pesam muito, enquanto ritmo (RIT), físico (FIS), passe (PAS) e drible (DRI) quase não mudam o resultado, mesmo com overall igual.\n5. **As escolhas do técnico humano quase não aparecem no resultado.** Entre os 10 estilos de teste, a diferença do melhor ao pior foi 0,09 ppg (3,5 pontos por temporada). Um técnico que sorteia formação e tática a cada jogo fica no topo do ranking. Entre 5 níveis de habilidade (do aleatório ao expert) a diferença foi de 0,05 a 0,07 ppg. O clube sorteado muda o ppg de 0,65 a 1,80. Ou seja, a dificuldade é decidida pelo sorteio do clube, não pelo que o jogador faz.\n6. **A leitura de intervalo foi anulada pelo computador.** Se o computador não reagisse, a resposta tática certa no intervalo valeria +0,13 ppg e a errada −0,10. Como o computador responde à mudança do humano em 60% das vezes (sempre depois dele), a resposta certa do humano vale zero.\n7. **A sinergia não é neutra.** Com elencos normais ela já dá +4% a +6% de defesa para quase toda combinação com defesa forte e +5% de controle para 4-2-3-1 e 3-5-2, no limite de 6%. O humano que \"monta o time certo\" não tem para onde crescer, e quem não monta nada ganha o mesmo bônus.\n8. **Pontos já corrigidos desde o relatório 1:** o mundo não envelhece mais (25 anos estáveis, idade média ~25 e overall da Série A perto de 67,5), a Copa nivelada funciona, o público dos clubes pequenos subiu (Série D 25%), e a recuperação de stamina agora cria desgaste real em sequências de jogos.\n\n---\n\n## 1. O jogo é rodado posição por posição?\n\nO minuto a minuto funciona assim: define-se quem tem a bola (controle dos meias, ataque e defesa), se há uma finalização (ataque contra a defesa do rival) e, na finalização, quem chuta (atacantes ficam com 64% dos chutes, meias 31%, defensores 5%), quem marca (zagueiro ou volante, pesado pela DEF) e o goleiro (DEF e overall no gol). Também há faltas, cartões, lesões, pênaltis e passes.\n\n### 1.1 Gols, chutes e passes por setor (200 mil jogos)\n\n| Indicador | Atacantes | Meias | Defensores |\n|---|---|---|---|\n| Gols | 65% | 29% | 6% |\n| Chutes | 64% | 31% | 5% |\n| Assistências | 13% | 57% | 30% |\n| Desarmes | 0% | 31% | 69% |\n\nGols e chutes estão realistas. **Assistências não:** defensores dão 30% e atacantes só 13%, porque o passador é sorteado entre todos pesado por PAS e os defensores têm muitos passes. Em um jogo real, atacantes e meias dão a maioria das assistências. Os atacantes nunca fazem desarme, o que também é uma simplificação.\n\n### 1.2 Quem está no gol\n\nTeste: mesmo elenco, 4-4-2 equilibrado contra time igual (6 mil jogos por linha). A linha base tem 1,27 gols sofridos por jogo e 34% de conversão dos chutes no alvo.\n\n| Quem joga no gol | GC por jogo | Conversão no alvo | ppg |\n|---|---|---|---|\n| Goleiro titular normal | 1,27 | 34% | 1,35 |\n| Goleiro ruim (todos os atributos −20) | 1,56 | 40% | 1,15 |\n| Goleiro ruim só em DEF (−25) | 1,55 | 40% | 1,17 |\n| Goleiro elite (+15) | 1,05 | 29% | 1,52 |\n| Melhor zagueiro no gol | 1,67 | 39% | 1,09 |\n| Melhor volante no gol | 1,66 | 39% | 1,09 |\n| Melhor meia (MEI) no gol | 1,96 | 47% | 0,94 |\n| Melhor centroavante no gol | 2,04 | 48% | 0,86 |\n| Jogador de linha com menor DEF no gol | 2,10 | 51% | 0,86 |\n\nConclusão: o que você pediu funciona. Um atacante no gol sofre bem mais gols, principalmente se a defesa dele é ruim: +61% contra o goleiro normal e +65% com o menor DEF. A DEF do goleiro sozinha já explica quase todo o efeito (−25 de DEF = 1,55 gols). O ponto fraco é de realismo: no futebol um atacante no gol tomaria bem mais, perto de 3 gols por jogo, e aqui o limite parece ser a faixa de probabilidades do chute (14% a 58% de gol). Também sofre-se mais chutes (10,4 para 11,6 por jogo), o que mostra que a defesa em volta reage à troca.\n\n### 1.3 Outras posições trocadas\n\n| Troca | GF | GC | ppg |\n|---|---|---|---|\n| Base | 1,26 | 1,27 | 1,35 |\n| Melhor goleiro de centroavante | 0,87 | 1,38 | 0,96 |\n| Melhor zagueiro de centroavante | 0,99 | 1,31 | 1,12 |\n| Dois melhores zagueiros nos dois ataques | 0,77 | 1,40 | 0,86 |\n| Melhor centroavante de zagueiro | 1,19 | 1,49 | 1,14 |\n| Dois centroavantes de zagueiros | 1,12 | 1,72 | 0,93 |\n| Três atacantes no meio | 0,88 | 1,61 | 0,82 |\n| Quatro atacantes na defesa | 1,05 | 2,28 | 0,58 |\n| Lateral esquerdo de zagueiro | 1,21 | 1,37 | 1,23 |\n\nO efeito de jogar fora de posição aparece nos gols a favor e contra, nos chutes sofridos e no ppg, e é maior quanto mais distante a posição. Isso é coerente com o que você pediu.\n\n### 1.4 Valor de cada posição (+10 e −10 de overall em um jogador)\n\n| Posição | +10 | −10 |\n|---|---|---|\n| Goleiro | +0,135 | −0,10 |\n| Zagueiro (cada) | +0,05 a +0,06 | −0,02 |\n| Lateral (cada) | +0,04 | −0,02 |\n| Volante | +0,12 | −0,08 |\n| Meia central | +0,10 | −0,06 |\n| Ala (cada) | +0,09 a +0,10 | −0,06 |\n| Centroavante | +0,16 | −0,12 |\n| Segundo atacante | +0,13 | |\n\nHouve melhora desde o relatório 1 (zagueiro de +0,03 para +0,05), mas defensores e laterais ainda valem pelo menos metade de um volante ou ala e cerca de um terço de um centroavante. O mercado cobra o mesmo por overall igual em qualquer posição, então o jogador esperto continua pagando menos por defesa do que o jogo recompensa em ataque.\n\n### 1.5 O que a posição \"cobra\" do jogador\n\nOs quatro números acima juntos sugerem uma lógica clara: o gol é decidido em três pontos (quem chuta, quem marca, goleiro), e os setores de defesa pesam pela média, não pela soma. Isso é um desenho aceitável, mas explica por que atacantes e goleiros são sempre prioridade de compra.\n\n---\n\n## 2. Atributos\n\n### 2.1 Efeito de cada atributo nos 11 titulares\n\n| Atributo | +10 | −10 | O que muda |\n|---|---|---|---|\n| CHU (chute) | +0,29 | −0,25 | GF de 1,26 para 1,60 |\n| DEF (defesa) | +0,32 | −0,23 | GC de 1,27 para 0,94 |\n| PAS (passe) | +0,14 | −0,07 | pouco |\n| DRI (drible) | +0,14 | −0,08 | pouco |\n| FIS (físico) | +0,09 | −0,08 | stamina |\n| RIT (ritmo) | +0,04 | −0,07 | quase nada |\n| Todos
